<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="900" viewBox="0 0 1310 900" role="img" aria-label="images-ocr Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#5B8DEF"/>
  </marker>
  <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#8A72D6"/>
  </marker>
  <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#D6A441"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .layer{stroke:#D7E2EC;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:43px;font-weight:400;fill:#203040}
    .subtitle{font-family:"Comic Mono";font-size:15px;font-weight:400;fill:#536476}
    .layer-title{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#405366}
    .card-title{font-family:"Architects Daughter";font-size:22px;font-weight:400;fill:#203040}
    .detail{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#405366}
    .footer{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#627184}
    .card{filter:url(#shadow);stroke-width:2}
    .edge-blue{stroke:#5B8DEF;stroke-width:2.2;fill:none;marker-end:url(#arrow-blue);stroke-linecap:round;stroke-linejoin:round}
    .edge-purple{stroke:#8A72D6;stroke-width:2.2;fill:none;marker-end:url(#arrow-purple);stroke-linecap:round;stroke-linejoin:round}
    .edge-amber{stroke:#D6A441;stroke-width:2.2;fill:none;marker-end:url(#arrow-amber);stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1310" height="900"/>
<rect class="frame" x="32" y="28" width="1246" height="842" rx="28"/>
<text class="title" x="66" y="82">images-ocr Architecture</text>
<text class="subtitle" x="70" y="118">Top-down OCR layers around ImmutableImage, coroutine dispatch, per-call Tess4J state, and host Tesseract runtime.</text>

<rect class="layer" x="64" y="148" width="1182" height="116" rx="18" fill="#F7FBFF"/>
<text class="layer-title" x="92" y="182">1. Caller Input</text>
<g id="application" transform="translate(300,176)">
  <rect class="card" x="0" y="0" width="270" height="70" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="135" y="29" text-anchor="middle">Application Code</text>
  <text class="detail" x="135" y="50" text-anchor="middle">blocking or coroutine caller</text>
</g>
<g id="image" transform="translate(820,176)">
  <rect class="card" x="0" y="0" width="270" height="70" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="135" y="29" text-anchor="middle">ImmutableImage</text>
  <text class="detail" x="135" y="50" text-anchor="middle">Scrimage image value</text>
</g>

<rect class="layer" x="64" y="292" width="1182" height="124" rx="18" fill="#FAFCF7"/>
<text class="layer-title" x="92" y="326">2. Public OCR API</text>
<g id="blocking-api" transform="translate(300,328)">
  <rect class="card" x="0" y="0" width="270" height="70" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="135" y="29" text-anchor="middle">extractText</text>
  <text class="detail" x="135" y="50" text-anchor="middle">blocking extension</text>
</g>
<g id="suspend-api" transform="translate(600,328)">
  <rect class="card" x="0" y="0" width="270" height="70" rx="10" fill="#F1ECFF" stroke="#A58BE3"/>
  <text class="card-title" x="135" y="29" text-anchor="middle">suspendExtractText</text>
  <text class="detail" x="135" y="50" text-anchor="middle">withContext(Dispatchers.IO)</text>
</g>
<g id="options" transform="translate(900,328)">
  <rect class="card" x="0" y="0" width="270" height="70" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="135" y="29" text-anchor="middle">OcrOptions</text>
  <text class="detail" x="135" y="50" text-anchor="middle">languages, psm, variables</text>
</g>

<rect class="layer" x="64" y="444" width="1182" height="124" rx="18" fill="#FFFDF7"/>
<text class="layer-title" x="92" y="478">3. Engine Isolation</text>
<g id="engine" transform="translate(410,480)">
  <rect class="card" x="0" y="0" width="270" height="70" rx="10" fill="#F1ECFF" stroke="#A58BE3"/>
  <text class="card-title" x="135" y="29" text-anchor="middle">TesseractOcrEngine</text>
  <text class="detail" x="135" y="50" text-anchor="middle">fresh client per call</text>
</g>
<g id="client" transform="translate(730,480)">
  <rect class="card" x="0" y="0" width="270" height="70" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="135" y="29" text-anchor="middle">TesseractClient</text>
  <text class="detail" x="135" y="50" text-anchor="middle">internal adapter boundary</text>
</g>

<rect class="layer" x="64" y="596" width="1182" height="124" rx="18" fill="#F7FBFF"/>
<text class="layer-title" x="92" y="630">4. Host Native Runtime</text>
<g id="tess4j" transform="translate(410,632)">
  <rect class="card" x="0" y="0" width="270" height="70" rx="10" fill="#FFF0E6" stroke="#E28A5D"/>
  <text class="card-title" x="135" y="29" text-anchor="middle">Tess4J</text>
  <text class="detail" x="135" y="50" text-anchor="middle">JNA bridge to Tesseract</text>
</g>
<g id="native" transform="translate(730,632)">
  <rect class="card" x="0" y="0" width="270" height="70" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="135" y="29" text-anchor="middle">Tesseract + traineddata</text>
  <text class="detail" x="135" y="50" text-anchor="middle">runtime language packs</text>
</g>

<rect class="layer" x="64" y="748" width="1182" height="92" rx="18" fill="#FAFCF7"/>
<text class="layer-title" x="92" y="782">5. Result Contract</text>
<g id="result" transform="translate(520,770)">
  <rect class="card" x="0" y="0" width="270" height="52" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="135" y="31" text-anchor="middle">OcrResult or OcrException</text>
</g>

<path class="edge-blue" d="M 435 246 L 435 328"/>
<path class="edge-purple" d="M 955 246 L 955 300 L 1035 300 L 1035 328"/>
<path class="edge-blue" d="M 435 398 L 435 430 L 545 430 L 545 480"/>
<path class="edge-purple" d="M 735 398 L 735 430 L 545 430 L 545 480"/>
<path class="edge-amber" d="M 1035 398 L 1035 430 L 545 430 L 545 480"/>
<path class="edge-purple" d="M 680 515 L 730 515"/>
<path class="edge-amber" d="M 865 550 L 865 632"/>
<path class="edge-amber" d="M 680 667 L 730 667"/>
<path class="edge-blue" d="M 545 550 L 545 736 L 655 736 L 655 770"/>

<text class="footer" x="655" y="858" text-anchor="middle">Source evidence: OcrOptions, OcrEngine, TesseractOcrEngine, ImmutableImage OCR extensions, and runtime README requirements.</text>
</svg>
