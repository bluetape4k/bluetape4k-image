<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="900" viewBox="0 0 1310 900" role="img" aria-label="images-ocr Recognition Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#5B8DEF"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:43px;font-weight:400;fill:#203040}
    .subtitle{font-family:"Comic Mono";font-size:15px;font-weight:400;fill:#536476}
    .participant{font-family:"Architects Daughter";font-size:19px;font-weight:400;fill:#203040}
    .detail{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#405366}
    .step{font-family:"Comic Mono";font-size:13px;font-weight:400;fill:#203040}
    .footer{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#627184}
    .box{filter:url(#shadow);stroke-width:2}
    .lifeline{stroke:#B7C4D3;stroke-width:1.8;stroke-dasharray:7 7}
    .call{stroke:#5B8DEF;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round}
    .return{stroke:#758297;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow);stroke-linecap:round}
    .band{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.4;opacity:0.96}
  </style>
</defs>
<rect class="canvas" width="1310" height="900"/>
<rect class="frame" x="32" y="28" width="1246" height="842" rx="28"/>
<text class="title" x="66" y="82">images-ocr Recognition Sequence</text>
<text class="subtitle" x="70" y="118">The suspend path moves blocking OCR onto Dispatchers.IO, then delegates to the same per-call engine path.</text>

<g id="p1" transform="translate(82,158)">
  <rect class="box" x="0" y="0" width="172" height="62" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="participant" x="86" y="28" text-anchor="middle">Caller</text>
  <text class="detail" x="86" y="47" text-anchor="middle">service code</text>
</g>
<g id="p2" transform="translate(310,158)">
  <rect class="box" x="0" y="0" width="172" height="62" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="participant" x="86" y="28" text-anchor="middle">ImmutableImage</text>
  <text class="detail" x="86" y="47" text-anchor="middle">extension API</text>
</g>
<g id="p3" transform="translate(538,158)">
  <rect class="box" x="0" y="0" width="172" height="62" rx="10" fill="#F1ECFF" stroke="#A58BE3"/>
  <text class="participant" x="86" y="28" text-anchor="middle">OcrEngine</text>
  <text class="detail" x="86" y="47" text-anchor="middle">Tesseract engine</text>
</g>
<g id="p4" transform="translate(766,158)">
  <rect class="box" x="0" y="0" width="172" height="62" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="participant" x="86" y="28" text-anchor="middle">TesseractClient</text>
  <text class="detail" x="86" y="47" text-anchor="middle">internal boundary</text>
</g>
<g id="p5" transform="translate(994,158)">
  <rect class="box" x="0" y="0" width="172" height="62" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="participant" x="86" y="28" text-anchor="middle">Tesseract</text>
  <text class="detail" x="86" y="47" text-anchor="middle">native runtime</text>
</g>

<line class="lifeline" x1="168" y1="230" x2="168" y2="790"/>
<line class="lifeline" x1="396" y1="230" x2="396" y2="790"/>
<line class="lifeline" x1="624" y1="230" x2="624" y2="790"/>
<line class="lifeline" x1="852" y1="230" x2="852" y2="790"/>
<line class="lifeline" x1="1080" y1="230" x2="1080" y2="790"/>

<rect class="band" x="208" y="254" width="148" height="26" rx="8"/>
<text class="step" x="282" y="272" text-anchor="middle">1. call extractText</text>
<path class="call" d="M 168 292 L 396 292"/>

<rect class="band" x="400" y="326" width="220" height="26" rx="8"/>
<text class="step" x="510" y="344" text-anchor="middle">2. choose default engine/options</text>
<path class="call" d="M 396 364 L 624 364"/>

<rect class="band" x="648" y="398" width="180" height="26" rx="8"/>
<text class="step" x="738" y="416" text-anchor="middle">3. create fresh client</text>
<path class="call" d="M 624 436 L 852 436"/>

<rect class="band" x="626" y="470" width="222" height="26" rx="8"/>
<text class="step" x="737" y="488" text-anchor="middle">4. apply language, psm, variables</text>
<path class="call" d="M 852 508 L 852 538 L 624 538"/>

<rect class="band" x="888" y="572" width="158" height="26" rx="8"/>
<text class="step" x="967" y="590" text-anchor="middle">5. doOCR(image.awt)</text>
<path class="call" d="M 852 610 L 1080 610"/>

<rect class="band" x="704" y="644" width="164" height="26" rx="8"/>
<text class="step" x="786" y="662" text-anchor="middle">6. raw text or failure</text>
<path class="return" d="M 1080 682 L 624 682"/>

<rect class="band" x="374" y="716" width="186" height="26" rx="8"/>
<text class="step" x="467" y="734" text-anchor="middle">7. trim and return String</text>
<path class="return" d="M 624 754 L 168 754"/>

<text class="footer" x="655" y="846" text-anchor="middle">Failure path: native runtime errors become OcrConfigurationException; Tess4J/runtime failures become OcrException.</text>
</svg>
