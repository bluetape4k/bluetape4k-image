<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="1010" viewBox="0 0 1310 1010" role="img" aria-label="images-ocr Class Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 1 L 12 6 L 0 11 Z" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
  </marker>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:43px;font-weight:400;fill:#203040}
    .subtitle{font-family:"Comic Mono";font-size:15px;font-weight:400;fill:#536476}
    .class-title{font-family:"Architects Daughter";font-size:20px;font-weight:400;fill:#203040}
    .member{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#405366}
    .stereo{font-family:"Comic Mono";font-size:11px;font-weight:400;fill:#627184}
    .footer{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#627184}
    .box{filter:url(#shadow);stroke-width:2}
    .line{stroke:#758297;stroke-width:2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .inherit-line{stroke:#758297;stroke-width:2;fill:none;marker-end:url(#inherit);stroke-linecap:round;stroke-linejoin:round}
    .impl-line{stroke:#758297;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#inherit);stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1310" height="1010"/>
<rect class="frame" x="32" y="28" width="1246" height="952" rx="28"/>
<text class="title" x="66" y="82">images-ocr Class Diagram</text>
<text class="subtitle" x="70" y="118">Public API types, internal Tesseract adapter boundary, option enums, and OCR error hierarchy.</text>

<g id="ocr-engine" transform="translate(530,160)">
  <rect class="box" x="0" y="0" width="250" height="126" rx="6" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="125" y="24" text-anchor="middle">&lt;&lt;fun interface&gt;&gt;</text>
  <text class="class-title" x="125" y="49" text-anchor="middle">OcrEngine</text>
  <line x1="0" y1="64" x2="250" y2="64" stroke="#D7E2EC"/>
  <text class="member" x="16" y="88">+ recognize(image, options)</text>
  <text class="member" x="16" y="108">  : OcrResult</text>
</g>

<g id="tesseract-engine" transform="translate(530,348)">
  <rect class="box" x="0" y="0" width="250" height="146" rx="6" fill="#F1ECFF" stroke="#A58BE3"/>
  <text class="class-title" x="125" y="32" text-anchor="middle">TesseractOcrEngine</text>
  <line x1="0" y1="52" x2="250" y2="52" stroke="#D7E2EC"/>
  <text class="member" x="16" y="76">+ TesseractOcrEngine()</text>
  <text class="member" x="16" y="96">+ recognize(image, options)</text>
  <line x1="0" y1="112" x2="250" y2="112" stroke="#D7E2EC"/>
  <text class="member" x="16" y="132">- configure(client, options)</text>
</g>

<g id="extensions" transform="translate(96,348)">
  <rect class="box" x="0" y="0" width="310" height="146" rx="6" fill="#EAF7EF" stroke="#58A978"/>
  <text class="class-title" x="155" y="32" text-anchor="middle">ImmutableImage OCR Extensions</text>
  <line x1="0" y1="52" x2="310" y2="52" stroke="#D7E2EC"/>
  <text class="member" x="16" y="78">+ extractText(options, engine)</text>
  <text class="member" x="16" y="101">+ suspendExtractText(...)</text>
  <text class="member" x="16" y="124">  uses Dispatchers.IO by default</text>
</g>

<g id="options" transform="translate(904,160)">
  <rect class="box" x="0" y="0" width="310" height="166" rx="6" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="155" y="24" text-anchor="middle">&lt;&lt;data class&gt;&gt;</text>
  <text class="class-title" x="155" y="49" text-anchor="middle">OcrOptions</text>
  <line x1="0" y1="64" x2="310" y2="64" stroke="#D7E2EC"/>
  <text class="member" x="16" y="88">+ languages: List&lt;String&gt;</text>
  <text class="member" x="16" y="108">+ tessdataPath: String?</text>
  <text class="member" x="16" y="128">+ engineMode, pageSegmentationMode</text>
  <text class="member" x="16" y="148">+ variables, configs, trimText</text>
</g>

<g id="result" transform="translate(96,160)">
  <rect class="box" x="0" y="0" width="310" height="126" rx="6" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="155" y="24" text-anchor="middle">&lt;&lt;data class&gt;&gt;</text>
  <text class="class-title" x="155" y="49" text-anchor="middle">OcrResult</text>
  <line x1="0" y1="64" x2="310" y2="64" stroke="#D7E2EC"/>
  <text class="member" x="16" y="88">+ text: String</text>
  <text class="member" x="16" y="108">+ options: OcrOptions</text>
</g>

<g id="client" transform="translate(530,584)">
  <rect class="box" x="0" y="0" width="250" height="166" rx="6" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="125" y="24" text-anchor="middle">&lt;&lt;internal interface&gt;&gt;</text>
  <text class="class-title" x="125" y="49" text-anchor="middle">TesseractClient</text>
  <line x1="0" y1="64" x2="250" y2="64" stroke="#D7E2EC"/>
  <text class="member" x="16" y="86">+ setLanguage(...)</text>
  <text class="member" x="16" y="106">+ setPageSegMode(...)</text>
  <text class="member" x="16" y="126">+ setVariable(...)</text>
  <text class="member" x="16" y="146">+ doOCR(image): String</text>
</g>

<g id="client-impl" transform="translate(510,814)">
  <rect class="box" x="0" y="0" width="290" height="86" rx="6" fill="#FFF0E6" stroke="#E28A5D"/>
  <text class="stereo" x="145" y="24" text-anchor="middle">&lt;&lt;private class&gt;&gt;</text>
  <text class="class-title" x="145" y="50" text-anchor="middle">Tess4jTesseractClient</text>
  <text class="member" x="145" y="72" text-anchor="middle">wraps ITesseract</text>
</g>

<g id="engine-mode" transform="translate(904,390)">
  <rect class="box" x="0" y="0" width="310" height="106" rx="6" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="stereo" x="155" y="24" text-anchor="middle">&lt;&lt;enum&gt;&gt;</text>
  <text class="class-title" x="155" y="49" text-anchor="middle">TesseractEngineMode</text>
  <line x1="0" y1="64" x2="310" y2="64" stroke="#D7E2EC"/>
  <text class="member" x="16" y="88">DEFAULT, LSTM_ONLY, ...</text>
</g>

<g id="page-mode" transform="translate(904,540)">
  <rect class="box" x="0" y="0" width="310" height="126" rx="6" fill="#F1ECFF" stroke="#A58BE3"/>
  <text class="stereo" x="155" y="24" text-anchor="middle">&lt;&lt;enum&gt;&gt;</text>
  <text class="class-title" x="155" y="43" text-anchor="middle">Tesseract Page</text>
  <text class="class-title" x="155" y="64" text-anchor="middle">Segmentation Mode</text>
  <line x1="0" y1="78" x2="310" y2="78" stroke="#D7E2EC"/>
  <text class="member" x="16" y="102">AUTO, SINGLE_LINE, SPARSE_TEXT, ...</text>
  <text class="member" x="16" y="122">wraps Tess4J PSM constants</text>
</g>

<g id="exception" transform="translate(96,584)">
  <rect class="box" x="0" y="0" width="310" height="106" rx="6" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="class-title" x="155" y="32" text-anchor="middle">OcrException</text>
  <line x1="0" y1="52" x2="310" y2="52" stroke="#D7E2EC"/>
  <text class="member" x="16" y="77">+ message: String</text>
  <text class="member" x="16" y="97">+ cause: Throwable?</text>
</g>

<g id="config-exception" transform="translate(96,754)">
  <rect class="box" x="0" y="0" width="310" height="86" rx="6" fill="#FFF0E6" stroke="#E28A5D"/>
  <text class="class-title" x="155" y="33" text-anchor="middle">OcrConfigurationException</text>
  <text class="member" x="155" y="59" text-anchor="middle">native runtime / tessdata setup</text>
</g>

