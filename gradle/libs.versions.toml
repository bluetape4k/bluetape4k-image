# AWS SDK v2
aws2-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws2" }
aws2-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws2" }
aws2-cloudfront = { module = "software.amazon.awssdk:cloudfront", version.ref = "aws2" }

# bluetape4k-aws
