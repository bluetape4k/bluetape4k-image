name: Dependency Submission

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  # Set the repository variable to `enabled` only after GitHub Dependency graph
  # is enabled for this repository. The default keeps a disabled repository
  # from reporting a misleading failed submission check.
  DEPENDENCY_GRAPH_POLICY: ${{ vars.DEPENDENCY_GRAPH_POLICY || 'disabled' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  dependency_policy:
    name: Dependency Submission Policy
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.policy.outputs.enabled }}
    steps:
      - name: Resolve repository policy
        id: policy
        shell: bash
        run: |
          set -Eeuo pipefail

          policy="$(printf '%s' "$DEPENDENCY_GRAPH_POLICY" | tr '[:upper:]' '[:lower:]')"
          case "$policy" in
            enabled)
              enabled=true
              result="submission enabled"
              ;;
            disabled)
              enabled=false
              result="submission skipped intentionally; repository Dependency graph is disabled by policy"
              ;;
            *)
              echo "::error::DEPENDENCY_GRAPH_POLICY must be 'enabled' or 'disabled', got '$DEPENDENCY_GRAPH_POLICY'" >&2
              exit 1
              ;;
          esac

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          {
            echo "### Dependency Submission policy"
            echo "- Repository policy: $policy"
            echo "- Result: $result"
            if [[ "$enabled" == true ]]; then
              echo "- The repository Dependency graph must be enabled before submission can succeed."
            else
              echo "- To submit snapshots, enable the repository Dependency graph and set DEPENDENCY_GRAPH_POLICY=enabled."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-submission:
    name: Dependency Submission
    needs: dependency_policy
    if: >-
      needs.dependency_policy.outputs.enabled == 'true' &&
      (github.event_name == 'push' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/develop

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          additional-arguments: --no-configuration-cache --no-daemon
