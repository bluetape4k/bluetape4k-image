      - name: Generate Kover XML report
        if: always()
        run: ./gradlew --refresh-dependencies :bluetape4k-images-captcha:koverXmlReport --no-configuration-cache --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images-captcha
          path: '**/build/test-results/test/*.xml'
