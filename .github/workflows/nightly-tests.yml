  # ── 5. images-ocr 모듈 ───────────────────────────────────────────────────
  test-images-ocr:
    name: Test / images-ocr
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '11 19 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') }}

    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test images-ocr
        # Ubuntu 24.04 ships Leptonica 1.82, while current Lept4J/Tess4J expects
        # newer native symbols. Nightly keeps host-native OCR local/manual and
        # uses the Testcontainers-backed smoke gate for portable coverage.
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-images-ocr:test -Docr.container.enabled=true --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
