      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images-vips-java25
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-images-vips-java25
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── 9. 커버리지 집계 ─────────────────────────────────────────────────────
  coverage-report:
    name: Coverage Report

    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    needs:
      - test-images
      - test-images-captcha
      - test-images-ktor
      - test-images-spring-boot
      - test-images-vips-api
      - test-images-vips-java21
      - test-images-vips-java25
    if: ${{ always() && ((github.event_name == 'schedule' && github.event.schedule == '11 19 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')) }}
    steps:
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 30

  # ── 10. 결과 집계 ─────────────────────────────────────────────────────────
  nightly-status:
    name: Nightly Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    needs:
      - build
      - test-images
      - test-images-captcha
      - test-images-ktor
      - test-images-spring-boot
      - test-images-vips-api
      - test-images-vips-java21
      - test-images-vips-java25
      - coverage-report
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Nightly results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "Nightly failed"
            exit 1
          fi
          echo "Nightly passed"
