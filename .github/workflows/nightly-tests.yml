name: Nightly

on:
  schedule:
    - cron: '11 19 * * 1-6'  # Daily smoke, UTC 19:11 (KST 04:11) Mon-Sat
    - cron: '11 19 * * 0'    # Weekly full, UTC 19:11 (KST 04:11) Sunday
  workflow_dispatch:
    inputs:
      scope:
        description: 'Nightly scope to run'
        required: true
        type: choice
        default: full
        options:
          - smoke
          - full

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  # ── 0. Gradle Wrapper 검증 ────────────────────────────────────────────────
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

  # ── 1. 전체 빌드 + Detekt ─────────────────────────────────────────────────
  build:
    name: Build & Detekt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Build (compile only)
        run: ./gradlew --refresh-dependencies build -x test --parallel --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Detekt static analysis
        run: ./gradlew --refresh-dependencies detekt --parallel --no-configuration-cache

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: 'build/reports/detekt/*.xml'
          retention-days: 14

  # ── 2. images 모듈 ────────────────────────────────────────────────────────
  test-images:
    name: Test / images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test images
        run: |
          for attempt in 1 2 3; do
            ./gradlew --refresh-dependencies :bluetape4k-images:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 3 ] && sleep 10 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: ./gradlew --refresh-dependencies :bluetape4k-images:koverXmlReport --no-configuration-cache --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-images
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── 3. images-captcha 모듈 ────────────────────────────────────────────────
  test-images-captcha:
    name: Test / images-captcha
    runs-on: ubuntu-latest
    timeout-minutes: 10
