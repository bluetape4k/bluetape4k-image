          path: '**/build/reports/kover/'
          retention-days: 14

  # ── 5. images-spring-boot 모듈 (smoke + full) ─────────────────────────────
  test-images-spring-boot:
    name: Test / images-spring-boot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
