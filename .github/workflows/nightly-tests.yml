  # ── 11. 커버리지 집계 ────────────────────────────────────────────────────
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test-images
      - test-images-barcode-api
      - test-images-barcode-zxing
      - test-images-captcha
      - test-images-ocr
      - test-images-ktor
      - test-images-spring-boot
      - test-images-vips-api
      - test-images-vips-java21
      - test-images-vips-java25
    if: ${{ always() && ((github.event_name == 'schedule' && github.event.schedule == '11 19 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Validate expected coverage artifacts
        shell: bash
        run: |
          set -euo pipefail

          expected_artifacts=(
            coverage-images
            coverage-images-barcode-api
            coverage-images-barcode-zxing
            coverage-images-captcha
            coverage-images-ocr
            coverage-images-ktor
            coverage-images-spring-boot
            coverage-images-vips-api
            coverage-images-vips-java21
            coverage-images-vips-java25
          )

          missing_artifacts=()
          empty_artifacts=()

          for artifact in "${expected_artifacts[@]}"; do
            artifact_dir="coverage-artifacts/${artifact}"
            normalized_artifact_dir="coverage-artifacts/${artifact#coverage-}"
            if [[ ! -d "${artifact_dir}" && -d "${normalized_artifact_dir}" ]]; then
              artifact_dir="${normalized_artifact_dir}"
            fi

            if [[ ! -d "${artifact_dir}" ]]; then
              missing_artifacts+=("${artifact}")
              continue
            fi

            if ! find "${artifact_dir}" -type f \( -name 'report.xml' -o -name 'reportJvm.xml' \) -print -quit | grep -q .; then
              empty_artifacts+=("${artifact}")
            fi
          done

          if (( ${#missing_artifacts[@]} > 0 || ${#empty_artifacts[@]} > 0 )); then
            echo "::error title=Coverage artifacts incomplete::Expected coverage artifacts are missing or empty."

            if (( ${#missing_artifacts[@]} > 0 )); then
              printf 'Missing artifacts:\n'
              printf '  - %s\n' "${missing_artifacts[@]}"
            fi

            if (( ${#empty_artifacts[@]} > 0 )); then
              printf 'Empty artifacts:\n'
              printf '  - %s\n' "${empty_artifacts[@]}"
            fi

            echo "Downloaded artifacts:"
            find coverage-artifacts -maxdepth 2 -type d -print 2>/dev/null | sort || true
            exit 1
          fi

          printf 'Validated %s expected coverage artifacts.\n' "${#expected_artifacts[@]}"

      - name: Aggregate Kover coverage summary
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 30

  nightly-status:
    name: Nightly Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    needs:
      - build
      - test-images
      - test-images-barcode-api
      - test-images-barcode-zxing
      - test-images-captcha
      - test-images-ocr
      - test-images-ktor
      - test-images-spring-boot
      - test-images-vips-api
      - test-images-vips-java21
      - test-images-vips-java25
      - coverage-report
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Nightly results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "Nightly failed"
            exit 1
          fi
          echo "Nightly passed"
