  # ── 8. images-vips-java25 모듈 ────────────────────────────────────────────
  test-images-vips-java25:
    name: Test / images-vips-java25
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '11 19 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') }}

    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '25-ea'
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test images-vips-java25
        run: |
          for attempt in 1 2 3; do
            ./gradlew --refresh-dependencies :bluetape4k-images-vips-java25:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
