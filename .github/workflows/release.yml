name: Publish Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 0.2.0). Must match an existing tag.'
        required: true
        type: string
      diagnoseSigning:
        description: 'Run signing diagnostics before publishing'
        required: false
        default: false
        type: boolean
      catalogRef:
        description: 'bluetape4k-dependencies catalog ref to use during release'
        required: false
        default: ''
        type: string
      validation_run_id:
        description: 'Nightly run ID that already completed full validation for this release tag'
        required: false
        default: ''
        type: string
      override_full_validation:
        description: 'Manual override when intentionally releasing without a full Nightly validation run'
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  actions: read

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            VERSION="$TAG_NAME"
          else
            VERSION="$INPUT_VERSION"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION"

  release-validation:
    name: Verify release validation
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      validation_run_id: ${{ steps.validate.outputs.validation_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}
          fetch-depth: 0

      - name: Check full validation jobs
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VALIDATION_RUN_ID: ${{ github.event.inputs.validation_run_id || '' }}
          MANUAL_OVERRIDE: ${{ github.event.inputs.override_full_validation || false }}
          RELEASE_REF: ${{ needs.resolve-version.outputs.ref }}
        run: |
          set -euo pipefail

          release_sha="$(git rev-list -n 1 "$RELEASE_REF")"
          validation_run_id="$MANUAL_VALIDATION_RUN_ID"

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_OVERRIDE" == "true" ]]; then
            echo "::warning::Manual override requested; bypassing full release validation requirement for $release_sha."
            echo "validation_run_id=override" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$validation_run_id" ]]; then
            validation_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly-tests.yml/runs" \
              -f status=completed \
              -f per_page=100 \
              --jq ".workflow_runs[] | select(.head_sha == \"$release_sha\" and .conclusion == \"success\") | .id" \
              | head -1)"
          fi

          if [[ -z "$validation_run_id" ]]; then
            echo "::error::No successful Nightly validation run found for release commit $release_sha. Run full Nightly for the tag commit or provide validation_run_id with an explicit override if intentionally bypassing."
            exit 1
          fi

          required_jobs=(
            "Test / images"
            "Test / images-barcode-api"
            "Test / images-barcode-zxing"
            "Test / images-captcha"
            "Test / images-ocr"
            "Test / images-ktor"
            "Test / images-spring-boot"
            "Test / images-vips-api"
            "Test / images-vips-java21"
            "Test / images-vips-java25"
          )

          job_results="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${validation_run_id}/jobs" \
            --paginate \
            --jq '.jobs[] | [.name, .conclusion] | @tsv')"

          for job_name in "${required_jobs[@]}"; do
            conclusion="$(awk -F '\t' -v name="$job_name" '$1 == name { result = $2 } END { print result }' <<< "$job_results")"
            if [[ "$conclusion" != "success" ]]; then
              echo "::error::Release validation is not publish-eligible: $job_name concluded '${conclusion:-missing}' in run $validation_run_id."
              exit 1
            fi
          done

          echo "Full release validation succeeded in Nightly run $validation_run_id for $release_sha."
          echo "validation_run_id=$validation_run_id" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish RELEASE to Maven Central Portal
    needs: [resolve-version, release-validation]
    runs-on: ubuntu-latest
    environment: maven-central-release

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}
          fetch-depth: 0

      - name: Resolve dependencies catalog ref
        id: catalog
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CATALOG_REF: ${{ github.event.inputs.catalogRef || '' }}
          REPOSITORY_CATALOG_REF: ${{ vars.BLUETAPE4K_DEPENDENCIES_CATALOG_REF || '' }}
        run: |
          set -euo pipefail
          DEFAULT_CATALOG_REF=$(sed -nE 's/^[[:space:]]*\.orElse\("([^"]+)"\).*/\1/p' settings.gradle.kts | head -1)

          if [[ -z "$DEFAULT_CATALOG_REF" ]]; then
            echo "::error::Could not resolve checked-in bluetape4k-dependencies catalog default from settings.gradle.kts"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_CATALOG_REF" ]]; then
            SELECTED_CATALOG_REF="$INPUT_CATALOG_REF"
            CATALOG_SOURCE="workflow_dispatch input catalogRef"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$REPOSITORY_CATALOG_REF" ]]; then
            SELECTED_CATALOG_REF="$REPOSITORY_CATALOG_REF"
            CATALOG_SOURCE="repository variable BLUETAPE4K_DEPENDENCIES_CATALOG_REF"
          else
            SELECTED_CATALOG_REF="$DEFAULT_CATALOG_REF"
            CATALOG_SOURCE="checked-in settings.gradle.kts default"
          fi

          if [[ "$EVENT_NAME" == "push" && -n "$REPOSITORY_CATALOG_REF" && "$REPOSITORY_CATALOG_REF" != "$DEFAULT_CATALOG_REF" ]]; then
            echo "::notice::Ignoring repository catalog variable '$REPOSITORY_CATALOG_REF' for tag-triggered release. Using checked-in default '$DEFAULT_CATALOG_REF'."
          fi

          echo "BLUETAPE4K_DEPENDENCIES_CATALOG_REF=$SELECTED_CATALOG_REF" >> "$GITHUB_ENV"
          {
            echo "ref=$SELECTED_CATALOG_REF"
            echo "source=$CATALOG_SOURCE"
          } >> "$GITHUB_OUTPUT"

          echo "catalogRef=$SELECTED_CATALOG_REF"
          echo "catalogSource=$CATALOG_SOURCE"
          echo "checkedInDefault=$DEFAULT_CATALOG_REF"
          echo "repositoryVariable=${REPOSITORY_CATALOG_REF:-<unset>}"

      - name: Verify dependencies catalog aliases
        shell: bash
        run: |
          set -euo pipefail
          catalog_file="$RUNNER_TEMP/bluetape4k-libs.versions.toml"
          catalog_url="https://raw.githubusercontent.com/bluetape4k/bluetape4k-dependencies/${BLUETAPE4K_DEPENDENCIES_CATALOG_REF}/gradle/libs.versions.toml"
          required_aliases=(
            "bluetape4k-bom"
            "bluetape4k-exposed-bom"
            "exposed-plugin"
          )

          echo "Fetching bluetape4k-dependencies catalog: $catalog_url"
          curl -fsSL "$catalog_url" -o "$catalog_file"

          for alias in "${required_aliases[@]}"; do
            if ! grep -Eq "^[[:space:]]*${alias}[[:space:]]*=" "$catalog_file"; then
              echo "::error::Catalog ref '${BLUETAPE4K_DEPENDENCIES_CATALOG_REF}' is missing required alias: ${alias}"
              exit 1
            fi
          done

          echo "Verified catalog aliases from ${BLUETAPE4K_DEPENDENCIES_CATALOG_REF}:"
          grep -E '^[[:space:]]*(bluetape4k-bom|bluetape4k-exposed-bom|exposed-plugin)[[:space:]]*=' "$catalog_file"

      - name: Verify gradle.properties matches tag
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          BASE=$(grep -E '^baseVersion=' gradle.properties | cut -d= -f2)
          SNAP=$(grep -E '^snapshotVersion=' gradle.properties | cut -d= -f2 || echo "")
          echo "tag=$VERSION baseVersion=$BASE snapshotVersion='$SNAP'"
          if [[ "$BASE" != "$VERSION" ]]; then
            echo "::error::gradle.properties baseVersion ($BASE) does not match tag ($VERSION)"
            exit 1
          fi
          if [[ -n "$SNAP" ]]; then
            echo "::error::snapshotVersion must be empty for release. Got: '$SNAP'"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Diagnose signing inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnoseSigning }}
        shell: bash
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          python3 <<'PY'
          import base64, os

          raw_key = os.environ.get("SIGNING_KEY", "")
          key_id = os.environ.get("SIGNING_KEY_ID", "")
          password = os.environ.get("SIGNING_PASSWORD", "")

          print(f"SIGNING_KEY_ID set={bool(key_id)} length={len(key_id)}")
          print(f"SIGNING_PASSWORD set={bool(password)} length={len(password)}")
          print(f"SIGNING_KEY set={bool(raw_key)} length={len(raw_key)}")

          if raw_key.lstrip().startswith("-----BEGIN"):
              normalized_key = raw_key.replace("\\n", "\n")
              source = "armored"
          elif "\\n" in raw_key:
              normalized_key = raw_key.replace("\\n", "\n")
              source = "escaped_newlines"
          else:
              try:
                  normalized_key = base64.b64decode(raw_key.strip()).decode("utf-8")
                  source = "base64"
              except Exception:
                  normalized_key = raw_key
                  source = "raw"

          print(f"SIGNING_KEY source={source} normalized_length={len(normalized_key)}")
          print(f"SIGNING_KEY armored={'BEGIN PGP PRIVATE KEY BLOCK' in normalized_key}")
          PY

      - name: Publish to Central Portal
        run: >
          ./gradlew publishAggregationToCentralPortal
          --no-daemon
          --no-configuration-cache
          --no-build-cache
          --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

  github-release:
    name: Create GitHub Release
    needs: [resolve-version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}
          fetch-depth: 0

      - name: Resolve previous tag
        id: prev_tag
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          PREV=$(git tag --list --sort=-v:refname \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$' \
            | grep -vx "$VERSION" \
            | head -1 || true)
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREV:-(none)}"

      - name: Compose release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          PREV_TAG: ${{ steps.prev_tag.outputs.previous }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"

          awk -v ver="$VERSION" '
            BEGIN { inblock=0 }
            /^## \[/ {
              if (inblock) exit
              if (index($0, "[" ver "]") > 0) { inblock=1; next }
            }
            inblock { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "::warning::No CHANGELOG section found for $VERSION. Using fallback notes."
            printf "Release %s\n\nSee [CHANGELOG.md](./CHANGELOG.md) for details.\n\n" "$VERSION" > "$NOTES_FILE"
          fi

          if [[ -n "$PREV_TAG" ]]; then
            CONTRIBUTORS=$(git shortlog -sne "${PREV_TAG}..${VERSION}" \
              | sed -E 's/^[[:space:]]*[0-9]+[[:space:]]+//' \
              | sort -u || true)
            if [[ -n "$CONTRIBUTORS" ]]; then
              {
                printf '\n## Contributors\n\n'
                printf 'Thanks to everyone who contributed to this release.\n\n'
                while IFS= read -r line; do
                  printf -- '- %s\n' "$line"
                done <<< "$CONTRIBUTORS"
              } >> "$NOTES_FILE"
            fi

            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$REPO" "$PREV_TAG" "$VERSION" >> "$NOTES_FILE"
          else
            printf '\n**Full Changelog**: https://github.com/%s/commits/%s\n' \
              "$REPO" "$VERSION" >> "$NOTES_FILE"
          fi

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "--- Release notes preview (head 60 lines) ---"
          head -60 "$NOTES_FILE"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          if [[ "$VERSION" =~ -(RC|Beta|Alpha|M) ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$NOTES_FILE" \
            $PRERELEASE_FLAG
