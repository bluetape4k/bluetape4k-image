            --provenance-bundle .producer-state/attestations/provenance.bundle.jsonl \
            --sbom-bundle .producer-state/attestations/sbom.bundle.jsonl \
            --staging-digest "${{ needs.release-readback.outputs.staging-digest }}" \
            --release-digest "${{ needs.release-readback.outputs.release-digest }}" \
            --reconciliation-sha256 "$RECONCILIATION_SHA" \
            --cleanup-sha256 "$CLEANUP_SHA" \
            --revocations docker/paddleocr/revocations.json \
            --revocations-commit-sha "$REVOCATIONS_COMMIT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output-root .producer-state/evidence-source
          python3 scripts/research/paddle_ocr_producer.py create-evidence-oci \
            --source-root .producer-state/evidence-source \
            --output-root .producer-state/evidence-oci \
            --image-index-digest "${{ needs.release-readback.outputs.image-index-digest }}" \
            --image-platform-digest "${{ needs.release-readback.outputs.image-platform-digest }}" \
            --image-config-digest "${{ needs.release-readback.outputs.image-config-digest }}" \
            --base-digest "${{ needs.release-readback.outputs.base-digest }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --input-lock-sha256 "$INPUT_LOCK_SHA" \
            --revocations-sha256 "$REVOCATIONS_SHA" \
            --revocations-commit-sha "$REVOCATIONS_COMMIT" \
            > .producer-state/create-evidence-oci-receipt.json
          test -s .producer-state/evidence-source/producer-evidence.json
          test -s .producer-state/evidence-source/artifact-ledger.fragment.json
          test -s .producer-state/evidence-source/inputs/producer-input.lock.json
          test -s .producer-state/evidence-source/manifests/package-lock.json
          test -s .producer-state/evidence-source/manifests/model-detector.json
          test -s .producer-state/evidence-source/manifests/model-recognizer.json
          test -s .producer-state/evidence-source/platform-manifest.json
          test -s .producer-state/evidence-source/sbom.spdx.json
          test -s .producer-state/evidence-source/legal-inventory.json
          test -s .producer-state/evidence-source/attestations/provenance.bundle.jsonl
          test -s .producer-state/evidence-source/attestations/sbom.bundle.jsonl
      - name: Bootstrap verified ORAS
        run: |
          mkdir -p .producer-state/tools
          curl --fail --location --silent --show-error \
            https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz \
            --output .producer-state/oras.tar.gz
          python3 scripts/research/paddle_ocr_producer.py bootstrap-oras \
            --archive .producer-state/oras.tar.gz \
            --tool-root .producer-state/tools
      - name: Execute producer stage - push evidence OCI
        id: push-evidence
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ORAS_BIN="$PWD/.producer-state/tools/oras"
          REGISTRY_CONFIG="$PWD/.producer-state/registry-config.json"
          RELEASE_REPOSITORY=ghcr.io/bluetape4k/paddleocr-service
          printf '%s' "$REGISTRY_TOKEN" | "$ORAS_BIN" login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin --registry-config "$REGISTRY_CONFIG"
          "$ORAS_BIN" cp --from-oci-layout --to-registry-config "$REGISTRY_CONFIG" \
            ".producer-state/evidence-oci:$ATTEMPT_ID" \
            "$RELEASE_REPOSITORY:evidence-$ATTEMPT_ID"
          EVIDENCE_DIGEST=$("$ORAS_BIN" resolve --registry-config "$REGISTRY_CONFIG" \
            "$RELEASE_REPOSITORY:evidence-$ATTEMPT_ID")
          test "$EVIDENCE_DIGEST" = \
            "$(jq -er '.data.manifestDigest' .producer-state/create-evidence-oci-receipt.json)"
          "$ORAS_BIN" manifest fetch --registry-config "$REGISTRY_CONFIG" \
            "$RELEASE_REPOSITORY@$EVIDENCE_DIGEST" > .producer-state/evidence-manifest-readback.json
          test "sha256:$(shasum -a 256 .producer-state/evidence-manifest-readback.json | awk '{print $1}')" = \
            "$EVIDENCE_DIGEST"
          test "$(jq -er '.subject.digest' .producer-state/evidence-manifest-readback.json)" = \
            "${{ needs.release-readback.outputs.release-digest }}"
          test "$(gh api /orgs/bluetape4k/packages/container/paddleocr-service --jq .visibility)" = private
          printf 'evidence-digest=%s\n' "$EVIDENCE_DIGEST" >> "$GITHUB_OUTPUT"
      - *cleanup-step
      - *cleanup-fragment-step
      - *cleanup-upload-step
      - *summary-step
      - *terminal-step
  consumer-verify-private:
    name: PaddleOCR producer / consumer-verify-private
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [release-evidence-push]
    if: ${{ inputs.mode == 'PRODUCE' }}
    env:
      PRODUCER_JOB: consumer-verify-private
    outputs:
      evidence-digest: ${{ needs.release-evidence-push.outputs.evidence-digest }}
    permissions:
      contents: read
      packages: read
    steps:
      - *checkout-step
      - *python-step
      - *trust-step
      - name: Bootstrap verified ORAS
        run: |
          mkdir -p .producer-state/tools
          curl --fail --location --silent --show-error \
            https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz \
            --output .producer-state/oras.tar.gz
          python3 scripts/research/paddle_ocr_producer.py bootstrap-oras \
            --archive .producer-state/oras.tar.gz \
            --tool-root .producer-state/tools
      - name: Execute producer stage - verify private evidence
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_DIGEST: ${{ needs.release-evidence-push.outputs.evidence-digest }}
        run: |
          set -euo pipefail
          ORAS_BIN="$PWD/.producer-state/tools/oras"
          REGISTRY_CONFIG="$PWD/.producer-state/registry-config.json"
          EVIDENCE_REF="ghcr.io/bluetape4k/paddleocr-service@$EVIDENCE_DIGEST"
          printf '%s' "$REGISTRY_TOKEN" | "$ORAS_BIN" login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin --registry-config "$REGISTRY_CONFIG"
          "$ORAS_BIN" manifest fetch --registry-config "$REGISTRY_CONFIG" \
            "$EVIDENCE_REF" > .producer-state/private-evidence-manifest.json
          test "sha256:$(shasum -a 256 .producer-state/private-evidence-manifest.json | awk '{print $1}')" = \
            "$EVIDENCE_DIGEST"
          test "$(jq -er '.artifactType' .producer-state/private-evidence-manifest.json)" = \
            application/vnd.bluetape4k.paddleocr.producer-evidence.v1
          test "$(jq -er '.subject.digest' .producer-state/private-evidence-manifest.json)" = \
            "${{ needs.release-evidence-push.outputs.release-digest }}"
      - *cleanup-step
      - *cleanup-fragment-step
      - *cleanup-upload-step
      - *summary-step
      - *terminal-step
  public-visibility-readback:
    name: PaddleOCR producer / public-visibility-readback
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [consumer-verify-private]
    if: ${{ always() && !cancelled() }}
    environment: paddleocr-producer
    env:
      PRODUCER_JOB: public-visibility-readback
    outputs:
      evidence-digest: ${{ needs.consumer-verify-private.outputs.evidence-digest }}
    permissions:
      contents: read
      packages: read
    steps:
      - *checkout-step
      - *python-step
      - *trust-step
      - name: Execute producer stage - require external public visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api /orgs/bluetape4k/packages/container/paddleocr-service --jq .visibility)" = public
      - *cleanup-step
      - *cleanup-fragment-step
      - *cleanup-upload-step
      - *summary-step
      - *terminal-step
  consumer-verify-public:
    name: PaddleOCR producer / consumer-verify-public
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [public-visibility-readback]
    if: ${{ always() && !cancelled() }}
    env:
      PRODUCER_JOB: consumer-verify-public
    permissions:
      contents: read
    steps:
      - *checkout-step
      - *python-step
      - *trust-step
      - name: Bootstrap verified anonymous ORAS
        run: |
          mkdir -p .producer-state/tools
          curl --fail --location --silent --show-error --max-time 30 \
            https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz \
            --output .producer-state/oras.tar.gz
          test "$(wc -c < .producer-state/oras.tar.gz)" -le 8388608
          python3 scripts/research/paddle_ocr_producer.py bootstrap-oras \
            --archive .producer-state/oras.tar.gz \
            --tool-root .producer-state/tools
      - name: Execute producer stage - anonymous public evidence verification
        env:
          EVIDENCE_DIGEST: ${{ needs.public-visibility-readback.outputs.evidence-digest }}
        run: |
          set -euo pipefail
          EVIDENCE_REF="ghcr.io/bluetape4k/paddleocr-service@$EVIDENCE_DIGEST"
          env -u GH_TOKEN -u GITHUB_TOKEN -u DOCKER_CONFIG -u REGISTRY_AUTH_FILE \
            python3 scripts/research/paddle_ocr_producer.py verify-public-evidence \
              --oras-bin "$PWD/.producer-state/tools/oras" \
              --gh-bin "$(command -v gh)" \
              --ref "$EVIDENCE_REF" \
              --root .producer-state/public-evidence \
              --operation-timeout-seconds 30 \
              --materialization-timeout-seconds 600
      - *cleanup-step
      - *cleanup-fragment-step
      - *cleanup-upload-step
      - *summary-step
      - *terminal-step
  reconcile-readback:
    name: PaddleOCR producer / reconcile-readback
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [validation]
    if: ${{ inputs.mode == 'RECONCILE' }}
    env:
      PRODUCER_JOB: reconcile-readback
      GH_TOKEN: ${{ github.token }}
    outputs:
      producer-status: ${{ steps.validate-reconcile.outputs.producer-status }}
      staging-digest: ${{ steps.validate-reconcile.outputs.staging-digest }}
      release-digest: ${{ steps.validate-reconcile.outputs.release-digest }}
      evidence-digest: ${{ steps.validate-reconcile.outputs.evidence-digest }}
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    steps:
      - *checkout-step
      - *python-step
      - *trust-step
      - name: Execute producer stage - reconcile readback only
        id: validate-reconcile
        env:
          RESUME_ATTEMPT_ID: ${{ inputs.resumeAttemptId }}
          EXPECTED_PRIOR_STATUS: ${{ inputs.expectedPriorStatus }}
          EXPECTED_INPUT_LOCK_SHA256: ${{ inputs.expectedInputLockSha256 }}
          EXPECTED_STAGING_DIGEST: ${{ inputs.expectedStagingDigest }}
          EXPECTED_RELEASE_DIGEST: ${{ inputs.expectedReleaseDigest }}
          EXPECTED_EVIDENCE_DIGEST: ${{ inputs.expectedEvidenceDigest }}
        run: |
          set -euo pipefail
          python3 scripts/research/paddle_ocr_producer.py validate-dispatch \
            --mode RECONCILE \
            --resume-attempt-id "$RESUME_ATTEMPT_ID" \
            --expected-prior-status "$EXPECTED_PRIOR_STATUS" \
            --expected-input-lock-sha256 "$EXPECTED_INPUT_LOCK_SHA256" \
            --expected-staging-digest "$EXPECTED_STAGING_DIGEST" \
            --expected-release-digest "$EXPECTED_RELEASE_DIGEST" \
            --expected-evidence-digest "$EXPECTED_EVIDENCE_DIGEST"
          RESUME_RUN_ID=${RESUME_ATTEMPT_ID%%.*}
          RESUME_RUN_ATTEMPT=${RESUME_ATTEMPT_ID##*.}
          python3 - "$RESUME_RUN_ID" "$RESUME_ATTEMPT_ID" <<'PY'
          import os
          import subprocess
          import sys
          subprocess.run(
              [
                  "gh", "run", "download", sys.argv[1],
                  "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--name", "paddleocr-reconcile-state-" + sys.argv[2],
                  "--dir", ".producer-state/prior-state",
              ],
              check=True,
              stdin=subprocess.DEVNULL,
              timeout=60,
          )
          PY
          test "$(find .producer-state/prior-state -type l -print -quit)" = ""
          test "$(find .producer-state/prior-state -type f | wc -l | tr -d ' ')" = 3
          test "$(find .producer-state/prior-state -type f -exec wc -c {} + | awk 'END {print $1}')" -le 1048576
          PRIOR_STATE=.producer-state/prior-state/reconcile-state.json
          PRIOR_HEAD=$(jq -er '.workflowHeadSha' "$PRIOR_STATE")
          python3 scripts/research/paddle_ocr_producer.py readback-workflow-run \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$RESUME_RUN_ID" \
            --run-attempt "$RESUME_RUN_ATTEMPT" \
            --expected-head "$PRIOR_HEAD" \
            --operation-timeout-seconds 60 \
            --output .producer-state/prior-run-readback.json
          python3 scripts/research/paddle_ocr_producer.py readback-packages \
            --owner bluetape4k \
            --staging-package paddleocr-service-staging \
            --release-package paddleocr-service \
            --attempt-id "$RESUME_ATTEMPT_ID" \
            --image-tag "image-$RESUME_ATTEMPT_ID" \
            --evidence-tag "evidence-$RESUME_ATTEMPT_ID" \
            --operation-timeout-seconds 60 \
            > .producer-state/package-readback.json
          python3 scripts/research/paddle_ocr_producer.py validate-reconcile-state \
            --resume-attempt-id "$RESUME_ATTEMPT_ID" \
            --expected-prior-status "$EXPECTED_PRIOR_STATUS" \
            --expected-input-lock-sha256 "$EXPECTED_INPUT_LOCK_SHA256" \
            --expected-staging-digest "$EXPECTED_STAGING_DIGEST" \
            --expected-release-digest "$EXPECTED_RELEASE_DIGEST" \
            --expected-evidence-digest "$EXPECTED_EVIDENCE_DIGEST" \
            --prior-state "$PRIOR_STATE" \
            --package-readback .producer-state/package-readback.json \
            --input-lock "$PRODUCER_INPUT_LOCK" \
            --output .producer-state/reconcile-observation.json
          printf 'producer-status=%s\n' \
            "$(jq -er '.producerStatus' .producer-state/reconcile-observation.json)" >> "$GITHUB_OUTPUT"
          for artifact in staging release evidence; do
            digest=$(jq -er --arg artifact "$artifact" \
              '.[$artifact].manifestDigest // ""' .producer-state/reconcile-observation.json)
            printf '%s-digest=%s\n' "$artifact" "$digest" >> "$GITHUB_OUTPUT"
          done
      - *cleanup-step
      - *cleanup-fragment-step
      - *cleanup-upload-step
      - *summary-step
      - *terminal-step
  emergency-deny-attest:
    name: PaddleOCR producer / quarantine-pending
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [consumer-verify-public]
    if: ${{ always() && !cancelled() && needs.consumer-verify-public.result == 'failure' }}
    env:
      PRODUCER_JOB: emergency-deny-attest
    permissions:
      contents: read
    steps:
      - *checkout-step
      - *python-step
      - *trust-step
      - name: Execute producer stage - record QUARANTINE_PENDING candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          document = {
              "schemaVersion": 1,
              "attemptId": os.environ["ATTEMPT_ID"],
              "producerStatus": "QUARANTINE_PENDING",
              "reasonCode": "PUBLIC_VERIFICATION_FAILED",
              "requiredNextEvidence": [
                  "protected-develop-revocation",
                  "signed-emergency-receipt",
                  "visibility-readback",
                  "downstream-readback",
              ],
          }
          Path(".producer-state/quarantine-pending.json").write_text(
              json.dumps(document, separators=(",", ":"), sort_keys=True),
              encoding="utf-8",
          )
          PY
      - name: Upload quarantine candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paddleocr-quarantine-pending-${{ env.ATTEMPT_ID }}
          path: .producer-state/quarantine-pending.json
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 90
      - *cleanup-step
      - *cleanup-fragment-step
      - *cleanup-upload-step
      - *summary-step
      - *terminal-step
  cleanup-aggregate:
    name: PaddleOCR producer / cleanup-aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [validation, staging, source-repro-check, image-build, staging-push, staging-attest, staging-readback, release-promotion, release-attest, release-readback, release-evidence-push, consumer-verify-private, public-visibility-readback, consumer-verify-public, reconcile-readback, emergency-deny-attest]
    if: ${{ always() }}
    env:
      PRODUCER_JOB: cleanup-aggregate
      NEEDS_JSON: ${{ toJSON(needs) }}
    permissions:
      contents: read
      actions: read
    steps:
      - *checkout-step
      - *python-step
      - name: Download cleanup fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: cleanup-fragment-${{ env.ATTEMPT_ID }}-*
          path: .producer-state/cleanup-fragments
          merge-multiple: true
      - name: Merge cleanup fragments
        run: |
          set -euo pipefail
          mapfile -t FRAGMENTS < <(find .producer-state/cleanup-fragments -type f -name '*.json' -print | sort)
          ARGS=()
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          needs = json.loads(os.environ["NEEDS_JSON"])
          started = sorted(job for job, state in needs.items() if state.get("result") != "skipped")
          Path(".producer-state/started-jobs.txt").write_text(
              "".join(job + "\n" for job in started), encoding="utf-8"
          )
          PY
          while IFS= read -r job; do
            test -n "$job" && ARGS+=(--started-job "$job")
          done < .producer-state/started-jobs.txt
          for fragment in "${FRAGMENTS[@]}"; do
            ARGS+=(--fragment "$fragment")
          done
          python3 scripts/research/paddle_ocr_producer.py merge-cleanup \
            --attempt-id "$ATTEMPT_ID" \
            --original-status FAILED \
            "${ARGS[@]}" \
            --merged-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output .producer-state/cleanup.json
      - name: Upload cleanup aggregate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paddleocr-cleanup-${{ env.ATTEMPT_ID }}
          path: .producer-state/cleanup.json
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 90
  release-readback-finalize:
    name: PaddleOCR producer / release-readback-finalize
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [staging-push, release-promotion, release-evidence-push, consumer-verify-public, reconcile-readback, emergency-deny-attest, cleanup-aggregate]
    if: ${{ always() }}
    env:
      PRODUCER_JOB: release-readback-finalize
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    steps:
      - *checkout-step
      - *python-step
      - *trust-step
      - name: Download cleanup aggregate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: paddleocr-cleanup-${{ env.ATTEMPT_ID }}
          path: .producer-state/finalizer
      - name: Build immutable finalizer input
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          PUBLIC_RESULT: ${{ needs.consumer-verify-public.result }}
          RECONCILE_RESULT: ${{ needs.reconcile-readback.result }}
          RECONCILE_STATUS: ${{ needs.reconcile-readback.outputs.producer-status }}
          QUARANTINE_RESULT: ${{ needs.emergency-deny-attest.result }}
          CLEANUP_RESULT: ${{ needs.cleanup-aggregate.result }}
          STAGING_DIGEST: ${{ needs.staging-push.outputs.staging-digest }}
          RELEASE_DIGEST: ${{ needs.release-promotion.outputs.release-digest }}
          EVIDENCE_DIGEST: ${{ needs.release-evidence-push.outputs.evidence-digest }}
          RECONCILE_STAGING_DIGEST: ${{ needs.reconcile-readback.outputs.staging-digest }}
          RECONCILE_RELEASE_DIGEST: ${{ needs.reconcile-readback.outputs.release-digest }}
          RECONCILE_EVIDENCE_DIGEST: ${{ needs.reconcile-readback.outputs.evidence-digest }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          reconcile = os.environ["DISPATCH_MODE"] == "RECONCILE"
          if reconcile:
              status = os.environ.get("RECONCILE_STATUS") or "INTERRUPTED"
              conclusion = "success" if os.environ["RECONCILE_RESULT"] == "success" else "failure"
          elif os.environ["PUBLIC_RESULT"] == "success":
              status = "PRODUCER_PASS"
              conclusion = "success"
          elif os.environ["QUARANTINE_RESULT"] == "success" and os.environ.get("EVIDENCE_DIGEST"):
              status = "QUARANTINE_PENDING"
              conclusion = "failure"
          elif os.environ.get("RELEASE_DIGEST"):
              status = "RELEASE_UNVERIFIED"
              conclusion = "failure"
          elif os.environ.get("STAGING_DIGEST"):
              status = "PUBLISHED_UNVERIFIED"
              conclusion = "failure"
          else:
              status = "FAILED"
              conclusion = "failure"
          staging_digest = os.environ.get("RECONCILE_STAGING_DIGEST") if reconcile else os.environ.get("STAGING_DIGEST")
          release_digest = os.environ.get("RECONCILE_RELEASE_DIGEST") if reconcile else os.environ.get("RELEASE_DIGEST")
          evidence_digest = os.environ.get("RECONCILE_EVIDENCE_DIGEST") if reconcile else os.environ.get("EVIDENCE_DIGEST")
          stage = (
              "PUBLIC_EVIDENCE" if evidence_digest else
              "RELEASE" if release_digest else
              "STAGING" if staging_digest else
              "NONE"
          )
          document = {
              "producerStatus": status,
              "lastCompletedStage": stage,
              "runConclusion": conclusion,
          }
          Path(".producer-state/finalizer/input.json").write_text(
              json.dumps(document, separators=(",", ":"), sort_keys=True), encoding="utf-8"
          )
          PY
      - name: Finalize terminal result
        run: |
          python3 scripts/research/paddle_ocr_producer.py finalize-run \
            --input .producer-state/finalizer/input.json \
            --cleanup .producer-state/finalizer/cleanup.json \
            --output .producer-state/finalizer/producer-result.json
      - name: Build immutable reconciliation state
        env:
          STAGING_DIGEST: ${{ needs.staging-push.outputs.staging-digest }}
          RELEASE_DIGEST: ${{ needs.release-promotion.outputs.release-digest }}
          EVIDENCE_DIGEST: ${{ needs.release-evidence-push.outputs.evidence-digest }}
          RECONCILE_STAGING_DIGEST: ${{ needs.reconcile-readback.outputs.staging-digest }}
          RECONCILE_RELEASE_DIGEST: ${{ needs.reconcile-readback.outputs.release-digest }}
          RECONCILE_EVIDENCE_DIGEST: ${{ needs.reconcile-readback.outputs.evidence-digest }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(".producer-state/finalizer")
          canonical = lambda value: json.dumps(value, separators=(",", ":"), sort_keys=True).encode()
          artifact = lambda digest: None if not digest else {"manifestDigest": digest}
          reconcile = os.environ["DISPATCH_MODE"] == "RECONCILE"
          staging_digest = os.environ.get("RECONCILE_STAGING_DIGEST") if reconcile else os.environ.get("STAGING_DIGEST")
          release_digest = os.environ.get("RECONCILE_RELEASE_DIGEST") if reconcile else os.environ.get("RELEASE_DIGEST")
          evidence_digest = os.environ.get("RECONCILE_EVIDENCE_DIGEST") if reconcile else os.environ.get("EVIDENCE_DIGEST")
          evidence_reference = {
              "attemptId": os.environ["ATTEMPT_ID"],
              "manifestDigest": evidence_digest or None,
          }
          reconciliation_readback = {
              "attemptId": os.environ["ATTEMPT_ID"],
              "staging": artifact(staging_digest),
              "release": artifact(release_digest),
              "evidence": artifact(evidence_digest),
          }
          evidence_raw = canonical(evidence_reference)
          reconciliation_raw = canonical(reconciliation_readback)
          (root / "evidence-reference.json").write_bytes(evidence_raw)
          (root / "reconciliation-readback.json").write_bytes(reconciliation_raw)
          result_raw = (root / "producer-result.json").read_bytes()
          cleanup_raw = (root / "cleanup.json").read_bytes()
          result = json.loads(result_raw)
          input_lock_raw = Path(os.environ["PRODUCER_INPUT_LOCK"]).read_bytes()
          state = {
              "schemaVersion": 1,
              "attemptId": os.environ["ATTEMPT_ID"],
              "workflowHeadSha": os.environ["GITHUB_SHA"],
              "producerStatus": result["producerStatus"],
              "inputLockSha256": hashlib.sha256(input_lock_raw).hexdigest(),
              "staging": reconciliation_readback["staging"],
              "release": reconciliation_readback["release"],
              "evidence": reconciliation_readback["evidence"],
              "documentHashes": {
                  "resultSha256": hashlib.sha256(result_raw).hexdigest(),
                  "evidenceSha256": hashlib.sha256(evidence_raw).hexdigest(),
                  "reconciliationSha256": hashlib.sha256(reconciliation_raw).hexdigest(),
                  "cleanupSha256": hashlib.sha256(cleanup_raw).hexdigest(),
              },
          }
          (root / "reconcile-state.json").write_bytes(canonical(state))
          PY
      - name: Upload terminal result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paddleocr-result-${{ env.ATTEMPT_ID }}
          path: .producer-state/finalizer/producer-result.json
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 90
      - name: Upload reconciliation state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paddleocr-reconcile-state-${{ env.ATTEMPT_ID }}
          path: |
            .producer-state/finalizer/reconcile-state.json
            .producer-state/finalizer/evidence-reference.json
            .producer-state/finalizer/reconciliation-readback.json
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 90
