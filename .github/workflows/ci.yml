          retention-days: 7

  test-images-vips-api:
    name: Test / images-vips-api
    runs-on: ubuntu-latest
    environment: maven-central-snapshots
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images-vips-api'] == 'true' || needs.changes.outputs['build-logic'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test images-vips-api
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-images-vips-api:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Verify Vips opt-in compiler fixtures
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew :bluetape4k-images-vips-api:compileOptedVipsOptInFixtureKotlin \
            -PverifyVipsOptInFixtures --no-configuration-cache --no-daemon

          unopted_log="$RUNNER_TEMP/unopted-vips-opt-in.log"
          set +e
          ./gradlew :bluetape4k-images-vips-api:compileUnoptedVipsOptInFixtureKotlin \
            -PverifyVipsOptInFixtures --no-configuration-cache --no-daemon \
            >"$unopted_log" 2>&1
          unopted_exit=$?
          set -e
          cat "$unopted_log"

          if [[ "$unopted_exit" -eq 0 ]]; then
            echo "unopted Vips fixture unexpectedly compiled" >&2
            exit 1
          fi
          grep -q "VipsIncubatingApi" "$unopted_log"
          {
            echo "### Vips opt-in compiler fixtures"
            echo "- opted fixture: 성공"
            echo "- unopted fixture: 의도적 실패"
            echo "- diagnostic: VipsIncubatingApi"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :bluetape4k-images-vips-api:koverXmlReport --no-daemon --no-configuration-cache
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-images-vips-api
          path: '**/build/reports/kover/'
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images-vips-api
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

