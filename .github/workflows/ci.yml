name: CI

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  packages: read

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.filter.outputs.images }}
      images-spring-boot: ${{ steps.filter.outputs.images-spring-boot }}
      images-vips-api: ${{ steps.filter.outputs.images-vips-api }}
      images-vips-java21: ${{ steps.filter.outputs.images-vips-java21 }}
      images-vips-java25: ${{ steps.filter.outputs.images-vips-java25 }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            images:
              - 'images/**'
            images-spring-boot:
              - 'images-spring-boot/**'
            images-vips-api:
              - 'images-vips-api/**'
            images-vips-java21:
              - 'images-vips-java21/**'
            images-vips-java25:
              - 'images-vips-java25/**'

  build:
    name: Build (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build (compile only)
        run: ./gradlew build -x test --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  test-images:
    name: Test / images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test images
        run: |
          for attempt in 1 2 3; do
            ./gradlew :bluetape4k-images:test --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 3 ] && sleep 10 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-images-spring-boot:
    name: Test / images-spring-boot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images-spring-boot'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test images-spring-boot
        run: |
          for attempt in 1 2 3; do
            ./gradlew :bluetape4k-images-spring-boot:test --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 3 ] && sleep 10 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images-spring-boot
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-images-vips-api:
    name: Test / images-vips-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images-vips-api'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test images-vips-api
        run: |
          for attempt in 1 2 3; do
            ./gradlew :bluetape4k-images-vips-api:test --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 3 ] && sleep 10 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images-vips-api
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-images-vips-java21:
    name: Test / images-vips-java21
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images-vips-java21'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test images-vips-java21
        run: |
          for attempt in 1 2 3; do
            ./gradlew :bluetape4k-images-vips-java21:test --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 3 ] && sleep 10 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images-vips-java21
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-images-vips-java25:
    name: Test / images-vips-java25
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images-vips-java25'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25-ea'
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test images-vips-java25
        run: |
          for attempt in 1 2 3; do
            ./gradlew :bluetape4k-images-vips-java25:test --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 3 ] && sleep 10 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images-vips-java25
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - gitleaks
      - changes
      - build
      - test-images
      - test-images-spring-boot
      - test-images-vips-api
      - test-images-vips-java21
      - test-images-vips-java25
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed (skipped jobs treated as success)"
