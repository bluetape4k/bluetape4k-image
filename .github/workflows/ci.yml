name: CI

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  packages: read

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
  CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_FALLBACK_TAG: v8.30.1
        run: |
          GITLEAKS_RELEASE_JSON=$(curl -sSfL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest || true)

          GITLEAKS_ASSET_URL=$(printf '%s' "${GITLEAKS_RELEASE_JSON}" \
            | jq -r '.assets[]? | select(.name | test("linux_x64\\.tar\\.gz$")) | .browser_download_url' \
            | head -n 1)

          if [ -z "${GITLEAKS_ASSET_URL}" ] || [ "${GITLEAKS_ASSET_URL}" = "null" ]; then
            GITLEAKS_VERSION=${GITLEAKS_FALLBACK_TAG#v}
            GITLEAKS_ASSET_URL="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_FALLBACK_TAG}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          fi

          curl -sSfL --retry 3 --retry-delay 5 "${GITLEAKS_ASSET_URL}" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build-logic: ${{ steps.filter.outputs.build-logic }}
      images: ${{ steps.filter.outputs.images }}
      images-barcode-api: ${{ steps.filter.outputs.images-barcode-api }}
      images-captcha: ${{ steps.filter.outputs.images-captcha }}
      images-ocr: ${{ steps.filter.outputs.images-ocr }}
      images-ktor: ${{ steps.filter.outputs.images-ktor }}
      images-spring-boot: ${{ steps.filter.outputs.images-spring-boot }}
      images-vips-api: ${{ steps.filter.outputs.images-vips-api }}
      images-vips-java21: ${{ steps.filter.outputs.images-vips-java21 }}
      images-vips-java25: ${{ steps.filter.outputs.images-vips-java25 }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            build-logic:
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'buildSrc/**'
            images:
              - 'images/**'
            images-barcode-api:
              - 'images-barcode-api/**'
            images-captcha:
              - 'images-captcha/**'
            images-ocr:
              - 'images-ocr/**'
            images-ktor:
              - 'images-ktor/**'
            images-spring-boot:
              - 'images-spring-boot/**'
            images-vips-api:
              - 'images-vips-api/**'
            images-vips-java21:
              - 'images-vips-java21/**'
            images-vips-java25:
              - 'images-vips-java25/**'

  build:
    name: Build (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build (compile only)
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew build -x test --max-workers=1 --no-configuration-cache && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  test-images:
    name: Test / images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images'] == 'true' || needs.changes.outputs['build-logic'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test images
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-images:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-images-captcha:
    name: Test / images-captcha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images-captcha'] == 'true' || needs.changes.outputs['build-logic'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test images-captcha
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-images-captcha:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images-captcha
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-images-spring-boot:
    name: Test / images-spring-boot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images-spring-boot'] == 'true' || needs.changes.outputs['build-logic'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test images-spring-boot
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-images-spring-boot:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images-spring-boot
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-images-barcode-api:
    name: Test / images-barcode-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images-barcode-api'] == 'true' || needs.changes.outputs['build-logic'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test images-barcode-api
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-images-barcode-api:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images-barcode-api
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-images-ocr:
    name: Test / images-ocr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images-ocr'] == 'true' || needs.changes.outputs['build-logic'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test images-ocr
        # Ubuntu 24.04 ships Leptonica 1.82, while current Lept4J/Tess4J expects
        # newer native symbols. CI keeps host-native OCR local/manual and uses
        # the Testcontainers-backed smoke gate for portable OCR runtime coverage.
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-images-ocr:test -Docr.container.enabled=true --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images-ocr
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-images-ktor:
    name: Test / images-ktor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images-ktor'] == 'true' || needs.changes.outputs['build-logic'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test images-ktor
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-images-ktor:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images-ktor
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-images-vips-api:
    name: Test / images-vips-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images-vips-api'] == 'true' || needs.changes.outputs['build-logic'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test images-vips-api
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-images-vips-api:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images-vips-api
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-images-vips-java21:
    name: Test / images-vips-java21
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images-vips-java21'] == 'true' || needs.changes.outputs['build-logic'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test images-vips-java21
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-images-vips-java21:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images-vips-java21
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-images-vips-java25:
    name: Test / images-vips-java25
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images-vips-java25'] == 'true' || needs.changes.outputs['build-logic'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '25-ea'
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test images-vips-java25
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-images-vips-java25:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images-vips-java25
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - gitleaks
      - changes
      - build
      - test-images
      - test-images-barcode-api
      - test-images-captcha
      - test-images-ocr
      - test-images-ktor
      - test-images-spring-boot
      - test-images-vips-api
      - test-images-vips-java21
      - test-images-vips-java25
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
          WORKFLOW_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          BUILD_LOGIC_CHANGED: ${{ needs.changes.outputs['build-logic'] }}
          IMAGES_CHANGED: ${{ needs.changes.outputs['images'] }}
          IMAGES_BARCODE_API_CHANGED: ${{ needs.changes.outputs['images-barcode-api'] }}
          IMAGES_CAPTCHA_CHANGED: ${{ needs.changes.outputs['images-captcha'] }}
          IMAGES_OCR_CHANGED: ${{ needs.changes.outputs['images-ocr'] }}
          IMAGES_KTOR_CHANGED: ${{ needs.changes.outputs['images-ktor'] }}
          IMAGES_SPRING_BOOT_CHANGED: ${{ needs.changes.outputs['images-spring-boot'] }}
          IMAGES_VIPS_API_CHANGED: ${{ needs.changes.outputs['images-vips-api'] }}
          IMAGES_VIPS_JAVA21_CHANGED: ${{ needs.changes.outputs['images-vips-java21'] }}
          IMAGES_VIPS_JAVA25_CHANGED: ${{ needs.changes.outputs['images-vips-java25'] }}
          TEST_IMAGES_RESULT: ${{ needs['test-images'].result }}
          TEST_IMAGES_BARCODE_API_RESULT: ${{ needs['test-images-barcode-api'].result }}
          TEST_IMAGES_CAPTCHA_RESULT: ${{ needs['test-images-captcha'].result }}
          TEST_IMAGES_OCR_RESULT: ${{ needs['test-images-ocr'].result }}
          TEST_IMAGES_KTOR_RESULT: ${{ needs['test-images-ktor'].result }}
          TEST_IMAGES_SPRING_BOOT_RESULT: ${{ needs['test-images-spring-boot'].result }}
          TEST_IMAGES_VIPS_API_RESULT: ${{ needs['test-images-vips-api'].result }}
          TEST_IMAGES_VIPS_JAVA21_RESULT: ${{ needs['test-images-vips-java21'].result }}
          TEST_IMAGES_VIPS_JAVA25_RESULT: ${{ needs['test-images-vips-java25'].result }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi

          require_test() {
            module="$1"
            changed="$2"
            result="$3"

            if [ "$WORKFLOW_DISPATCH" = "true" ] || [ "$BUILD_LOGIC_CHANGED" = "true" ] || [ "$changed" = "true" ]; then
              if [ "$result" = "skipped" ]; then
                echo "Required module test skipped: $module"
                exit 1
              fi
            fi
          }

          require_test "images" "$IMAGES_CHANGED" "$TEST_IMAGES_RESULT"
          require_test "images-barcode-api" "$IMAGES_BARCODE_API_CHANGED" "$TEST_IMAGES_BARCODE_API_RESULT"
          require_test "images-captcha" "$IMAGES_CAPTCHA_CHANGED" "$TEST_IMAGES_CAPTCHA_RESULT"
          require_test "images-ocr" "$IMAGES_OCR_CHANGED" "$TEST_IMAGES_OCR_RESULT"
          require_test "images-ktor" "$IMAGES_KTOR_CHANGED" "$TEST_IMAGES_KTOR_RESULT"
          require_test "images-spring-boot" "$IMAGES_SPRING_BOOT_CHANGED" "$TEST_IMAGES_SPRING_BOOT_RESULT"
          require_test "images-vips-api" "$IMAGES_VIPS_API_CHANGED" "$TEST_IMAGES_VIPS_API_RESULT"
          require_test "images-vips-java21" "$IMAGES_VIPS_JAVA21_CHANGED" "$TEST_IMAGES_VIPS_JAVA21_RESULT"
          require_test "images-vips-java25" "$IMAGES_VIPS_JAVA25_CHANGED" "$TEST_IMAGES_VIPS_JAVA25_RESULT"

          echo "CI passed (skipped jobs were only for unaffected modules)"
