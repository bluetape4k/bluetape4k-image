  test-images-ocr:
    name: Test / images-ocr
    runs-on: ubuntu-latest
    environment: maven-central-snapshots
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
    timeout-minutes: 20
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images-ocr'] == 'true' || needs.changes.outputs['build-logic'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test images-ocr
        # Ubuntu 24.04 ships Leptonica 1.82, while current Lept4J/Tess4J expects
        # newer native symbols. CI keeps host-native OCR local/manual and uses
        # the Testcontainers-backed smoke gate for portable OCR runtime coverage.
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-images-ocr:test -Docr.container.enabled=true --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :bluetape4k-images-ocr:koverXmlReport --no-daemon --no-configuration-cache
        continue-on-error: true

      - name: Upload coverage report
