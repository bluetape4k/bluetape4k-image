          path: '**/build/reports/kover/'
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images-barcode-api
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

