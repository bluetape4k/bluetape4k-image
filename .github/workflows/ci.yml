  vips-verification:
    name: Verify / VIPS consumer·benchmark·BOM
    runs-on: ubuntu-latest
    environment: maven-central-snapshots
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
    timeout-minutes: 45
    needs:
      - build
      - changes
      - test-images-vips-api
      - test-images-vips-java21
      - test-images-vips-java25
    if: ${{ always() && (needs.changes.outputs['vips-verification'] == 'true' || needs.changes.outputs['build-logic'] == 'true' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: '25'
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Verify consumer and bytecode contracts
        id: vips_consumer
        run: |
          ./gradlew :bluetape4k-images-vips-java21:consumerTest \
            -Pvips.consumer.enabled=true -Dvips.enabled=true \
            --no-configuration-cache --no-daemon
          ./gradlew :bluetape4k-images-vips-java21:verifyVipsJava21Bytecode \
            --no-configuration-cache --no-daemon
      - name: Run Java21 JNI benchmark smoke
        id: vips_benchmark
        run: |
          ./gradlew :bluetape4k-images-benchmark:verifyVipsJava21BenchmarkReport \
            -Pvips.impl=java21 -Dvips.benchmark.required=true \
            --no-configuration-cache --no-daemon
      - name: Run published BOM consumer smoke
        id: vips_bom
        run: |
          ./gradlew :bluetape4k-image-bom:verifyVipsBomConsumer \
            --no-configuration-cache --no-daemon
      - name: Summarize VIPS verification
        if: always()
        run: |
          {
            echo '### VIPS consumer·benchmark·BOM verification'
            echo '- Java25 production-only consumer: ${{ steps.vips_consumer.outcome }}'
            echo '- class-file major ceiling: 69 이하 (${{ steps.vips_consumer.outcome }})'
            echo '- Java21 JNI benchmark: ${{ steps.vips_benchmark.outcome }}'
            report_path="$(find benchmark/images-benchmark/build/reports/benchmarks/vipsJava21Smoke -name benchmark.json -type f -print -quit 2>/dev/null || true)"
            if [ -n "$report_path" ]; then
              echo "- benchmark report: $report_path"
              python3 -c 'import json,sys; rows=json.load(open(sys.argv[1],encoding="utf-8")); scores=[row["primaryMetric"]["score"] for row in rows]; print(f"- benchmark backend: java21 JNI; rows: {len(rows)}; score range: {min(scores):.3f}-{max(scores):.3f} ms/op")' "$report_path"
            else
              echo '- benchmark report: 산출물 없음 (이전 단계 실패 가능)'
            fi
            echo '- published BOM consumer: ${{ steps.vips_bom.outcome }}'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload VIPS verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vips-verification-evidence
          path: |
            benchmark/images-benchmark/build/reports/benchmarks/vipsJava21Smoke/**
            images-vips-java21/build/reports/**
          if-no-files-found: warn
          retention-days: 7

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test-images
      - test-images-barcode-api
      - test-images-barcode-zxing
      - test-images-captcha
      - test-images-ocr
      - test-images-ktor
      - test-images-spring-boot
      - test-images-vips-api
      - test-images-vips-java21
      - test-images-vips-java25
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (needs.test-images.result == 'success' || needs.test-images-barcode-api.result == 'success' || needs.test-images-barcode-zxing.result == 'success' || needs.test-images-captcha.result == 'success' || needs.test-images-ocr.result == 'success' || needs.test-images-ktor.result == 'success' || needs.test-images-spring-boot.result == 'success' || needs.test-images-vips-api.result == 'success' || needs.test-images-vips-java21.result == 'success' || needs.test-images-vips-java25.result == 'success')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Validate coverage artifacts
        shell: bash
        env:
          TEST_IMAGES_RESULT: ${{ needs.test-images.result }}
          TEST_IMAGES_BARCODE_API_RESULT: ${{ needs.test-images-barcode-api.result }}
          TEST_IMAGES_BARCODE_ZXING_RESULT: ${{ needs.test-images-barcode-zxing.result }}
          TEST_IMAGES_CAPTCHA_RESULT: ${{ needs.test-images-captcha.result }}
          TEST_IMAGES_OCR_RESULT: ${{ needs.test-images-ocr.result }}
          TEST_IMAGES_KTOR_RESULT: ${{ needs.test-images-ktor.result }}
          TEST_IMAGES_SPRING_BOOT_RESULT: ${{ needs.test-images-spring-boot.result }}
          TEST_IMAGES_VIPS_API_RESULT: ${{ needs.test-images-vips-api.result }}
          TEST_IMAGES_VIPS_JAVA21_RESULT: ${{ needs.test-images-vips-java21.result }}
          TEST_IMAGES_VIPS_JAVA25_RESULT: ${{ needs.test-images-vips-java25.result }}
        run: |
          set -euo pipefail

          coverage_results=(
            "coverage-images:${TEST_IMAGES_RESULT}"
            "coverage-images-barcode-api:${TEST_IMAGES_BARCODE_API_RESULT}"
            "coverage-images-barcode-zxing:${TEST_IMAGES_BARCODE_ZXING_RESULT}"
            "coverage-images-captcha:${TEST_IMAGES_CAPTCHA_RESULT}"
            "coverage-images-ocr:${TEST_IMAGES_OCR_RESULT}"
            "coverage-images-ktor:${TEST_IMAGES_KTOR_RESULT}"
            "coverage-images-spring-boot:${TEST_IMAGES_SPRING_BOOT_RESULT}"
            "coverage-images-vips-api:${TEST_IMAGES_VIPS_API_RESULT}"
            "coverage-images-vips-java21:${TEST_IMAGES_VIPS_JAVA21_RESULT}"
            "coverage-images-vips-java25:${TEST_IMAGES_VIPS_JAVA25_RESULT}"
          )

          expected_artifacts=()
          for coverage_result in "${coverage_results[@]}"; do
            artifact="${coverage_result%%:*}"
            result="${coverage_result##*:}"
            if [[ "$result" == "success" ]]; then
              expected_artifacts+=("$artifact")
            fi
          done

          if (( ${#expected_artifacts[@]} == 0 )); then
            echo "::error title=Coverage artifacts unavailable::Coverage Report ran without a successful module test."
            exit 1
          fi

          missing_artifacts=()
          empty_artifacts=()

          for artifact in "${expected_artifacts[@]}"; do
            artifact_dir="coverage-artifacts/${artifact}"
            normalized_artifact_dir="coverage-artifacts/${artifact#coverage-}"
            if [[ ! -d "${artifact_dir}" && -d "${normalized_artifact_dir}" ]]; then
              artifact_dir="${normalized_artifact_dir}"
            fi

            if [[ ! -d "${artifact_dir}" ]]; then
              missing_artifacts+=("${artifact}")
              continue
            fi

            if ! find "${artifact_dir}" -type f \( -name 'report.xml' -o -name 'reportJvm.xml' \) -print -quit | grep -q .; then
              empty_artifacts+=("${artifact}")
            fi
          done

          if (( ${#missing_artifacts[@]} > 0 || ${#empty_artifacts[@]} > 0 )); then
            echo "::error title=Coverage artifacts incomplete::Expected coverage artifacts are missing or empty."

            if (( ${#missing_artifacts[@]} > 0 )); then
              printf 'Missing artifacts:\n'
              printf '  - %s\n' "${missing_artifacts[@]}"
            fi

            if (( ${#empty_artifacts[@]} > 0 )); then
              printf 'Empty artifacts:\n'
              printf '  - %s\n' "${empty_artifacts[@]}"
            fi

            echo "Downloaded artifacts:"
            find coverage-artifacts -maxdepth 2 -type d -print 2>/dev/null | sort || true
            exit 1
          fi

          printf 'Validated %s expected coverage artifacts.\n' "${#expected_artifacts[@]}"

      - name: Aggregate Kover coverage summary
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 30

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - catalog-governance
      - gitleaks
      - changes
      - build
      - coverage-report
      - test-images
      - test-images-barcode-api
      - test-images-barcode-zxing
      - test-images-captcha
      - test-images-ocr
      - test-images-ktor
      - test-images-spring-boot
      - test-images-spring-boot-filesystem
      - test-images-vips-api
      - test-images-vips-java21
      - test-images-vips-java25
      - vips-verification
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
          WORKFLOW_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          BUILD_LOGIC_CHANGED: ${{ needs.changes.outputs['build-logic'] }}
          IMAGES_CHANGED: ${{ needs.changes.outputs['images'] }}
          IMAGES_BARCODE_API_CHANGED: ${{ needs.changes.outputs['images-barcode-api'] }}
          IMAGES_BARCODE_ZXING_CHANGED: ${{ needs.changes.outputs['images-barcode-zxing'] }}
          IMAGES_CAPTCHA_CHANGED: ${{ needs.changes.outputs['images-captcha'] }}
          IMAGES_OCR_CHANGED: ${{ needs.changes.outputs['images-ocr'] }}
          IMAGES_KTOR_CHANGED: ${{ needs.changes.outputs['images-ktor'] }}
          IMAGES_SPRING_BOOT_CHANGED: ${{ needs.changes.outputs['images-spring-boot'] }}
          IMAGES_VIPS_API_CHANGED: ${{ needs.changes.outputs['images-vips-api'] }}
          IMAGES_VIPS_JAVA21_CHANGED: ${{ needs.changes.outputs['images-vips-java21'] }}
          IMAGES_VIPS_JAVA25_CHANGED: ${{ needs.changes.outputs['images-vips-java25'] }}
          VIPS_VERIFICATION_CHANGED: ${{ needs.changes.outputs['vips-verification'] }}
          TEST_IMAGES_RESULT: ${{ needs['test-images'].result }}
          TEST_IMAGES_BARCODE_API_RESULT: ${{ needs['test-images-barcode-api'].result }}
          TEST_IMAGES_BARCODE_ZXING_RESULT: ${{ needs['test-images-barcode-zxing'].result }}
          TEST_IMAGES_CAPTCHA_RESULT: ${{ needs['test-images-captcha'].result }}
          TEST_IMAGES_OCR_RESULT: ${{ needs['test-images-ocr'].result }}
          TEST_IMAGES_KTOR_RESULT: ${{ needs['test-images-ktor'].result }}
          TEST_IMAGES_SPRING_BOOT_RESULT: ${{ needs['test-images-spring-boot'].result }}
          TEST_IMAGES_SPRING_BOOT_FILESYSTEM_RESULT: ${{ needs['test-images-spring-boot-filesystem'].result }}
          TEST_IMAGES_VIPS_API_RESULT: ${{ needs['test-images-vips-api'].result }}
          TEST_IMAGES_VIPS_JAVA21_RESULT: ${{ needs['test-images-vips-java21'].result }}
          TEST_IMAGES_VIPS_JAVA25_RESULT: ${{ needs['test-images-vips-java25'].result }}
          VIPS_VERIFICATION_RESULT: ${{ needs['vips-verification'].result }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi

          require_test() {
            module="$1"
            changed="$2"
            result="$3"

            if [ "$WORKFLOW_DISPATCH" = "true" ] || [ "$BUILD_LOGIC_CHANGED" = "true" ] || [ "$changed" = "true" ]; then
              if [ "$result" = "skipped" ]; then
                echo "Required module test skipped: $module"
                exit 1
              fi
            fi
          }

          require_test "images" "$IMAGES_CHANGED" "$TEST_IMAGES_RESULT"
          require_test "images-barcode-api" "$IMAGES_BARCODE_API_CHANGED" "$TEST_IMAGES_BARCODE_API_RESULT"
          require_test "images-barcode-zxing" "$IMAGES_BARCODE_ZXING_CHANGED" "$TEST_IMAGES_BARCODE_ZXING_RESULT"
          require_test "images-captcha" "$IMAGES_CAPTCHA_CHANGED" "$TEST_IMAGES_CAPTCHA_RESULT"
          require_test "images-ocr" "$IMAGES_OCR_CHANGED" "$TEST_IMAGES_OCR_RESULT"
          require_test "images-ktor" "$IMAGES_KTOR_CHANGED" "$TEST_IMAGES_KTOR_RESULT"
          require_test "images-spring-boot" "$IMAGES_SPRING_BOOT_CHANGED" "$TEST_IMAGES_SPRING_BOOT_RESULT"
          require_test "images-spring-boot-filesystem" "$IMAGES_SPRING_BOOT_CHANGED" "$TEST_IMAGES_SPRING_BOOT_FILESYSTEM_RESULT"
          require_test "images-vips-api" "$IMAGES_VIPS_API_CHANGED" "$TEST_IMAGES_VIPS_API_RESULT"
          require_test "images-vips-java21" "$IMAGES_VIPS_JAVA21_CHANGED" "$TEST_IMAGES_VIPS_JAVA21_RESULT"
          require_test "images-vips-java25" "$IMAGES_VIPS_JAVA25_CHANGED" "$TEST_IMAGES_VIPS_JAVA25_RESULT"
          require_test "vips-verification" "$VIPS_VERIFICATION_CHANGED" "$VIPS_VERIFICATION_RESULT"

          echo "CI passed (skipped jobs were only for unaffected modules)"
