          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images-spring-boot
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-images-spring-boot-filesystem:
    name: Test / images-spring-boot filesystem (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    environment: maven-central-snapshots
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images-spring-boot'] == 'true' || needs.changes.outputs['build-logic'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test filesystem and storage contracts
        run: |
          ./gradlew :bluetape4k-images-spring-boot:test \
            --tests io.bluetape4k.images.spring.storage.LocalFileSystemContractTest \
            --tests io.bluetape4k.images.spring.storage.LocalImageStorageCrudContractTest \
            --tests io.bluetape4k.images.spring.storage.LocalImageStoragePathContractTest \
            --tests io.bluetape4k.images.spring.storage.LocalImageStorageListingContractTest \
            --no-configuration-cache --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

