name: CI

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  packages: read

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BLUETAPE4K_DEPENDENCIES_CATALOG_REF: '91f9ea9336b5ea991f5675323a1cf25ccfd6f5ed'

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_FALLBACK_TAG: v8.30.1
        run: |
          GITLEAKS_RELEASE_JSON=$(curl -sSfL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest || true)

          GITLEAKS_ASSET_URL=$(printf '%s' "${GITLEAKS_RELEASE_JSON}" \
            | jq -r '.assets[]? | select(.name | test("linux_x64\\.tar\\.gz$")) | .browser_download_url' \
            | head -n 1)

          if [ -z "${GITLEAKS_ASSET_URL}" ] || [ "${GITLEAKS_ASSET_URL}" = "null" ]; then
            GITLEAKS_VERSION=${GITLEAKS_FALLBACK_TAG#v}
            GITLEAKS_ASSET_URL="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_FALLBACK_TAG}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          fi

          curl -sSfL --retry 3 --retry-delay 5 "${GITLEAKS_ASSET_URL}" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6.3.0

  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build-logic: ${{ steps.filter.outputs.build-logic }}
      images: ${{ steps.filter.outputs.images }}
      images-barcode-api: ${{ steps.filter.outputs.images-barcode-api }}
      images-barcode-zxing: ${{ steps.filter.outputs.images-barcode-zxing }}
      images-captcha: ${{ steps.filter.outputs.images-captcha }}
      images-ocr: ${{ steps.filter.outputs.images-ocr }}
      images-ktor: ${{ steps.filter.outputs.images-ktor }}
      images-spring-boot: ${{ steps.filter.outputs.images-spring-boot }}
      images-vips-api: ${{ steps.filter.outputs.images-vips-api }}
      images-vips-java21: ${{ steps.filter.outputs.images-vips-java21 }}
      images-vips-java25: ${{ steps.filter.outputs.images-vips-java25 }}
      vips-verification: ${{ steps.filter.outputs.vips-verification }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            build-logic:
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'buildSrc/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            images:
              - 'images/**'
            images-barcode-api:
              - 'images-barcode-api/**'
            images-barcode-zxing:
              - 'images-barcode-zxing/**'
            images-captcha:
              - 'images-captcha/**'
            images-ocr:
              - 'images-ocr/**'
            images-ktor:
              - 'images-ktor/**'
            images-spring-boot:
              - 'images-spring-boot/**'
            images-vips-api:
              - 'images-vips-api/**'
            images-vips-java21:
              - 'images-vips-java21/**'
            images-vips-java25:
              - 'images-vips-java25/**'
            vips-verification:
              - 'benchmark/images-benchmark/**'
              - 'bom/**'
              - 'images-vips-api/**'
              - 'images-vips-java21/**'
              - 'images-vips-java25/**'
              - '.github/workflows/ci.yml'

  catalog-governance:
    name: Central Catalog Governance
    runs-on: ubuntu-latest
    environment: maven-central-snapshots
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Checkout central manual site
        uses: actions/checkout@v7
        with:
          repository: bluetape4k/bluetape4k.github.io
          ref: develop
          path: .manual-site
          fetch-depth: 1
      - uses: actions/checkout@v7
        with:
          repository: bluetape4k/bluetape4k-dependencies
          ref: ${{ env.BLUETAPE4K_DEPENDENCIES_CATALOG_REF }}
          path: .catalog/bluetape4k-dependencies
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify immutable catalog checkout
        run: test "$(git -C .catalog/bluetape4k-dependencies rev-parse HEAD)" = "$BLUETAPE4K_DEPENDENCIES_CATALOG_REF"
      - name: Check central catalog adoption
        run: |
          python3 .catalog/bluetape4k-dependencies/scripts/sync-shared-versions.py \
            --workspace "$(dirname "$GITHUB_WORKSPACE")" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --check \
            --summary
      - name: Resolve Gradle catalog from checked-out source
        env:
          BLUETAPE4K_DEPENDENCIES_CATALOG_PATH: ${{ github.workspace }}/.catalog/bluetape4k-dependencies/gradle/libs.versions.toml
        run: ./gradlew help --no-daemon
      - name: Verify release validation contract
        run: python3 .github/scripts/test-release-validation-contract.py
      - name: Verify tag-derived manual release drift
        run: |
          MANUAL_TAG=0.4.0
          MANUAL_SHA="$(git rev-parse --verify "refs/tags/${MANUAL_TAG}^{commit}")"
          SITE_ROOT="$GITHUB_WORKSPACE/.manual-site"
          TOOL_ROOT="$SITE_ROOT/scripts/manual/repositories/bluetape4k-image"
          MANUAL_ROOT="$SITE_ROOT/docs/manual/bluetape4k-image"
          ruby "$TOOL_ROOT/export_settings_inventory.rb" settings.gradle.kts build/manual/module-inventory.json
          ruby "$TOOL_ROOT/release_inventory.rb" "$MANUAL_TAG" "$MANUAL_SHA" build/manual/module-inventory.json build/manual/release-module-inventory.json 19
          ruby -I "$TOOL_ROOT" "$TOOL_ROOT/release_inventory_test.rb"
          ruby -I "$TOOL_ROOT" "$TOOL_ROOT/release_drift_test.rb"
          ruby "$TOOL_ROOT/validate_release_drift.rb" \
            --root "$GITHUB_WORKSPACE" \
            --site-root "$SITE_ROOT" \
            --manual-root "$MANUAL_ROOT" \
            --manifest "$MANUAL_ROOT/manifest.yaml" \
            --generated-manifest "$MANUAL_ROOT/generated/manifest.json" \
            --inventory "$GITHUB_WORKSPACE/build/manual/release-module-inventory.json" \
            --tag "$MANUAL_TAG"
          ruby "$TOOL_ROOT/export_manifest.rb" --check "$MANUAL_ROOT/manifest.yaml" "$MANUAL_ROOT/generated/manifest.json"
          ruby -I "$TOOL_ROOT" "$TOOL_ROOT/release_diagram_contract_test.rb"

  build:
    name: Build (compile only)
    runs-on: ubuntu-latest
    environment: maven-central-snapshots
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
    timeout-minutes: 10
    needs: [validate-wrapper, catalog-governance]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build (compile only)
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew build -x test --max-workers=1 --no-configuration-cache && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Verify published JVM ABI baseline
        run: ./gradlew checkProductionAbi --max-workers=1 --no-daemon --no-configuration-cache --no-build-cache

  test-images:
    name: Test / images
    runs-on: ubuntu-latest
    environment: maven-central-snapshots
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['images'] == 'true' || needs.changes.outputs['build-logic'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test images
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-images:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :bluetape4k-images:koverXmlReport --no-daemon --no-configuration-cache
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-images
          path: '**/build/reports/kover/'
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-images
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

