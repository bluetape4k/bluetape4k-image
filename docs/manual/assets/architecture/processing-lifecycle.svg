<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">An Image Pipeline Is a Resource Lifecycle</title><desc id="desc">Image processing lifecycle across immutable JVM images and explicitly owned native handles.</desc>
  <defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="0.58" stop-color="#152235"/><stop offset="1" stop-color="#213149"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#101827"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#020617" flood-opacity="0.38"/></filter>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#67e8f9" flood-opacity="0.2"/></filter>
  <marker id="arrow-cyan" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M0 0 L14 7 L0 14 Z" fill="#9ed8ff" stroke="#9ed8ff"/>
</marker>
<marker id="arrow-teal" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M0 0 L14 7 L0 14 Z" fill="#5eead4" stroke="#5eead4"/>
</marker>
<marker id="arrow-purple" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M0 0 L14 7 L0 14 Z" fill="#c4b5fd" stroke="#c4b5fd"/>
</marker>
<marker id="arrow-amber" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M0 0 L14 7 L0 14 Z" fill="#f6c96b" stroke="#f6c96b"/>
</marker>
<marker id="arrow-rose" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M0 0 L14 7 L0 14 Z" fill="#fda4af" stroke="#fda4af"/>
</marker>

</defs>

  <rect width="1600" height="1040" fill="url(#canvas)"/>
  <rect x="42" y="34" width="1516" height="972" rx="34" fill="url(#panel)" stroke="#536377" stroke-width="4" filter="url(#shadow)"/>
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="48" font-weight="700" fill="#f8fafc"><tspan x="800" y="96">An Image Pipeline Is a Resource Lifecycle</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="500" fill="#b6c4d6"><tspan x="800" y="137">load -&gt; transform -&gt; observe -&gt; encode -&gt; close</tspan></text>
  <g filter="url(#shadow)">
  <rect x="90" y="360" width="195" height="150" rx="22" fill="#172033" stroke="#9ed8ff" stroke-width="4"/>

  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#9ed8ff"><tspan x="187" y="403">Load</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="187" y="440">path / stream</tspan><tspan x="187" y="465">bounded bytes</tspan></text>
</g>
<g filter="url(#shadow)">
  <rect x="335" y="360" width="195" height="150" rx="22" fill="#172033" stroke="#5eead4" stroke-width="4"/>

  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#5eead4"><tspan x="432" y="403">Decode</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="432" y="440">codec capability</tspan><tspan x="432" y="465">immutable image</tspan></text>
</g>
<g filter="url(#shadow)">
  <rect x="580" y="360" width="195" height="150" rx="22" fill="#172033" stroke="#c4b5fd" stroke-width="4"/>

  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#c4b5fd"><tspan x="677" y="403">Transform</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="677" y="440">resize / filter</tspan><tspan x="677" y="465">draw on a copy</tspan></text>
</g>
<g filter="url(#shadow)">
  <rect x="825" y="360" width="195" height="150" rx="22" fill="#172033" stroke="#f6c96b" stroke-width="4"/>

  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#f6c96b"><tspan x="922" y="403">Observe</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="922" y="440">metadata</tspan><tspan x="922" y="465">similarity / metrics</tspan></text>
</g>
<g filter="url(#shadow)">
  <rect x="1070" y="360" width="195" height="150" rx="22" fill="#172033" stroke="#fda4af" stroke-width="4"/>

  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#fda4af"><tspan x="1167" y="403">Encode</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="1167" y="440">format / quality</tspan><tspan x="1167" y="465">destination</tspan></text>
</g>
<g filter="url(#shadow)">
  <rect x="1315" y="360" width="195" height="150" rx="22" fill="#172033" stroke="#5eead4" stroke-width="4"/>

  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#5eead4"><tspan x="1412" y="403">Close</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="1412" y="440">native handles</tspan><tspan x="1412" y="465">close exactly</tspan></text>
</g>

<g id="main-flow"><path id="step-0" d="M285 435 H323" fill="none" stroke="#9ed8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/><path id="step-1" d="M530 435 H568" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path id="step-2" d="M775 435 H813" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><path id="step-3" d="M1020 435 H1058" fill="none" stroke="#f6c96b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><path id="step-4" d="M1265 435 H1303" fill="none" stroke="#fda4af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-rose)"/></g>
<g filter="url(#shadow)">
  <rect x="180" y="180" width="500" height="135" rx="22" fill="#172033" stroke="#9ed8ff" stroke-width="4"/>

  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#9ed8ff"><tspan x="430" y="223">Immutable JVM path</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="430" y="260">each transform returns a new image</tspan><tspan x="430" y="285">Java2D drawing mutates only the copied buffer</tspan></text>
</g>

<g filter="url(#shadow)">
  <rect x="920" y="180" width="500" height="135" rx="22" fill="#172033" stroke="#fda4af" stroke-width="4"/>

  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#fda4af"><tspan x="1170" y="223">Explicit native path</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="1170" y="260">JVips and FFM handles are AutoCloseable</tspan><tspan x="1170" y="285">children never outlive their root image</tspan></text>
</g>

<g id="recovery" filter="url(#glow)">
  <path id="retry" d="M1412 510 V640 H188 V530" fill="none" stroke="#f6c96b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#arrow-amber)"/>
  <path id="cancel" d="M922 510 V700 H800 V780" fill="none" stroke="#fda4af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#arrow-rose)"/>
</g>
<g filter="url(#shadow)">
  <rect x="560" y="780" width="480" height="115" rx="22" fill="#172033" stroke="#fda4af" stroke-width="4"/>

  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#fda4af"><tspan x="800" y="823">Coroutine I/O boundary</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="800" y="860">suspend loading and writing use Dispatchers.IO</tspan><tspan x="800" y="885">cancellation is rethrown instead of hidden</tspan></text>
</g>

<text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="500" fill="#91a4bb"><tspan x="800" y="955">retry starts from a fresh source; never reuse a closed native handle</tspan></text>

</svg>
