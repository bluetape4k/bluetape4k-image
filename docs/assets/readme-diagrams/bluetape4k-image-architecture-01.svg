<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="930" viewBox="0 0 1310 930" role="img" aria-label="Image Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#5B8DEF"/>
  </marker>
  <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#8A72D6"/>
  </marker>
  <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#D6A441"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .layer{stroke:#D7E2EC;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:43px;font-weight:400;fill:#203040}
    .subtitle{font-family:"Comic Mono";font-size:15px;font-weight:400;fill:#536476}
    .layer-title{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#405366}
    .card-title{font-family:"Architects Daughter";font-size:22px;font-weight:400;fill:#203040}
    .detail{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#405366}
    .footer{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#627184}
    .card{filter:url(#shadow);stroke-width:2}
    .edge-blue{stroke:#5B8DEF;stroke-width:2.2;fill:none;marker-end:url(#arrow-blue);stroke-linecap:round;stroke-linejoin:round}
    .edge-purple{stroke:#8A72D6;stroke-width:2.2;fill:none;marker-end:url(#arrow-purple);stroke-linecap:round;stroke-linejoin:round}
    .edge-amber{stroke:#D6A441;stroke-width:2.2;fill:none;marker-end:url(#arrow-amber);stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1310" height="930"/>
<rect class="frame" x="32" y="28" width="1246" height="872" rx="28"/>
<text class="title" x="66" y="82">Image Architecture</text>
<text class="subtitle" x="70" y="118">Top-down module layers from core image processing to adapters, native runtimes, and benchmark evidence.</text>

<rect class="layer" x="64" y="150" width="1182" height="118" rx="18" fill="#F7FBFF"/>
<text class="layer-title" x="92" y="184">1. Foundation</text>
<g id="images" transform="translate(476,176)">
  <rect class="card" x="0" y="0" width="360" height="76" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="180" y="31" text-anchor="middle">images</text>
  <text class="detail" x="180" y="53" text-anchor="middle">Scrimage / Java2D processing core</text>
</g>

<rect class="layer" x="64" y="292" width="1182" height="128" rx="18" fill="#FAFCF7"/>
<text class="layer-title" x="92" y="326">2. Feature API Surface</text>
<g id="captcha" transform="translate(330,326)">
  <rect class="card" x="0" y="0" width="270" height="76" rx="10" fill="#FFF0E6" stroke="#E28A5D"/>
  <text class="card-title" x="135" y="27" text-anchor="middle">images-captcha</text>
  <text class="detail" x="135" y="50" text-anchor="middle">Java2D challenges</text>
</g>
<g id="ocr" transform="translate(630,326)">
  <rect class="card" x="0" y="0" width="270" height="76" rx="10" fill="#F1ECFF" stroke="#A58BE3"/>
  <text class="card-title" x="135" y="27" text-anchor="middle">images-ocr</text>
  <text class="detail" x="135" y="50" text-anchor="middle">Tess4J text extraction</text>
</g>
<g id="vips-api" transform="translate(930,326)">
  <rect class="card" x="0" y="0" width="270" height="76" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="135" y="27" text-anchor="middle">images-vips-api</text>
  <text class="detail" x="135" y="50" text-anchor="middle">VipsImage runtime contract</text>
</g>

<rect class="layer" x="64" y="444" width="1182" height="128" rx="18" fill="#FFFDF7"/>
<text class="layer-title" x="92" y="478">3. Application Integration</text>
<g id="ktor" transform="translate(410,478)">
  <rect class="card" x="0" y="0" width="270" height="76" rx="10" fill="#EAF2FF" stroke="#6D9CE8"/>
  <text class="card-title" x="135" y="27" text-anchor="middle">images-ktor</text>
  <text class="detail" x="135" y="50" text-anchor="middle">Ktor route helpers</text>
</g>
<g id="spring" transform="translate(730,478)">
  <rect class="card" x="0" y="0" width="270" height="76" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="135" y="27" text-anchor="middle">images-spring-boot</text>
  <text class="detail" x="135" y="50" text-anchor="middle">Spring Boot 4 auto-config</text>
</g>

<rect class="layer" x="64" y="596" width="1182" height="128" rx="18" fill="#F7FBFF"/>
<text class="layer-title" x="92" y="630">4. Native Runtime Choices</text>
<g id="tesseract" transform="translate(330,630)">
  <rect class="card" x="0" y="0" width="270" height="76" rx="10" fill="#F1ECFF" stroke="#A58BE3"/>
  <text class="card-title" x="135" y="27" text-anchor="middle">Tesseract host</text>
  <text class="detail" x="135" y="50" text-anchor="middle">traineddata language packs</text>
</g>
<g id="jni" transform="translate(630,630)">
  <rect class="card" x="0" y="0" width="270" height="76" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="135" y="27" text-anchor="middle">Java 21 JNI</text>
  <text class="detail" x="135" y="50" text-anchor="middle">images-vips-java21</text>
</g>
<g id="ffm" transform="translate(930,630)">
  <rect class="card" x="0" y="0" width="270" height="76" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="135" y="27" text-anchor="middle">Java 25 FFM</text>
  <text class="detail" x="135" y="50" text-anchor="middle">images-vips-java25</text>
</g>

<rect class="layer" x="64" y="748" width="1182" height="122" rx="18" fill="#FFFDF7"/>
<text class="layer-title" x="92" y="782">5. Benchmark Evidence</text>
<g id="benchmark" transform="translate(476,780)">
  <rect class="card" x="0" y="0" width="360" height="76" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="180" y="27" text-anchor="middle">images-benchmark</text>
  <text class="detail" x="180" y="50" text-anchor="middle">kotlinx-benchmark resize / encode</text>
</g>

<path class="edge-blue" d="M 596 252 L 596 280 L 465 280 L 465 326"/>
<path class="edge-blue" d="M 656 252 L 656 280 L 765 280 L 765 326"/>
<path class="edge-blue" d="M 716 252 L 716 280 L 1065 280 L 1065 326"/>
<path class="edge-blue" d="M 465 402 L 465 432 L 545 432 L 545 478"/>
<path class="edge-blue" d="M 765 402 L 765 432 L 865 432 L 865 478"/>
<path class="edge-purple" d="M 765 402 L 765 584 L 465 584 L 465 630"/>
<path class="edge-purple" d="M 1065 402 L 1065 584 L 765 584 L 765 630"/>
<path class="edge-purple" d="M 1065 402 L 1065 630"/>
<path class="edge-amber" d="M 765 706 L 765 736 L 656 736 L 656 780"/>
<path class="edge-amber" d="M 1065 706 L 1065 736 L 716 736 L 716 780"/>

<text class="footer" x="655" y="888" text-anchor="middle">Source evidence: settings.gradle.kts modules, root README capability lanes, OCR requirements, adapter modules, and libvips backend requirements.</text>
</svg>
