<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="756" viewBox="0 0 1400 756" role="img" aria-labelledby="title desc">
  <title id="title">Bluetape4k Image module composition</title>
  <desc id="desc">Module composition chart generated from current source layout.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.09"/>
    </filter>
    <style>
      .canvas{fill:#F6F9FC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#536476;font-weight:400}
      .label{font-family:"Comic Mono";font-size:15px;fill:#34465B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .axis{font-family:"Architects Daughter";font-size:21px;fill:#22344A;font-weight:400}
    </style>
  </defs>
  <rect class="canvas" width="1400" height="756"/>
  <rect class="frame" x="36" y="28" width="1328" height="700" rx="24"/>
  <text class="title" x="72" y="82">Bluetape4k Image module composition</text>
  <text class="subtitle" x="76" y="114">Current source-backed group counts for README orientation.</text>

  <text class="axis" x="95" y="178">BOM</text>
  <rect x="385" y="152" width="820" height="32" rx="10" fill="#EEF4F9" stroke="#D7E2EC"/>
  <rect x="385" y="152" width="820" height="32" rx="10" fill="#E8F3FF" stroke="#75A9E8" stroke-width="2"/>
  <text class="label" x="1225" y="169" dominant-baseline="middle">1</text>

  <text class="axis" x="95" y="226">Core processing</text>
  <rect x="385" y="200" width="820" height="32" rx="10" fill="#EEF4F9" stroke="#D7E2EC"/>
  <rect x="385" y="200" width="820" height="32" rx="10" fill="#EAF7EF" stroke="#69B888" stroke-width="2"/>
  <text class="label" x="1225" y="217" dominant-baseline="middle">1</text>

  <text class="axis" x="95" y="274">CAPTCHA</text>
  <rect x="385" y="248" width="820" height="32" rx="10" fill="#EEF4F9" stroke="#D7E2EC"/>
  <rect x="385" y="248" width="820" height="32" rx="10" fill="#FFF0E6" stroke="#E28A5D" stroke-width="2"/>
  <text class="label" x="1225" y="265" dominant-baseline="middle">1</text>

  <text class="axis" x="95" y="322">OCR</text>
  <rect x="385" y="296" width="820" height="32" rx="10" fill="#EEF4F9" stroke="#D7E2EC"/>
  <rect x="385" y="296" width="820" height="32" rx="10" fill="#F1ECFF" stroke="#A58BE3" stroke-width="2"/>
  <text class="label" x="1225" y="313" dominant-baseline="middle">1</text>

  <text class="axis" x="95" y="370">Ktor</text>
  <rect x="385" y="344" width="820" height="32" rx="10" fill="#EEF4F9" stroke="#D7E2EC"/>
  <rect x="385" y="344" width="820" height="32" rx="10" fill="#EAF2FF" stroke="#6D9CE8" stroke-width="2"/>
  <text class="label" x="1225" y="361" dominant-baseline="middle">1</text>

  <text class="axis" x="95" y="418">Spring Boot 4</text>
  <rect x="385" y="392" width="820" height="32" rx="10" fill="#EEF4F9" stroke="#D7E2EC"/>
  <rect x="385" y="392" width="820" height="32" rx="10" fill="#FDECEF" stroke="#DB7890" stroke-width="2"/>
  <text class="label" x="1225" y="409" dominant-baseline="middle">1</text>

  <text class="axis" x="95" y="466">Vips API</text>
  <rect x="385" y="440" width="820" height="32" rx="10" fill="#EEF4F9" stroke="#D7E2EC"/>
