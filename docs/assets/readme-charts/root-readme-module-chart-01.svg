  <rect x="385" y="488" width="820" height="32" rx="10" fill="#EEF4F9" stroke="#D7E2EC"/>
  <rect x="385" y="488" width="820" height="32" rx="10" fill="#E8F3FF" stroke="#5B8DEF" stroke-width="2"/>
  <text class="label" x="1225" y="505" dominant-baseline="middle">1</text>

  <text class="axis" x="95" y="562">Vips Java 25</text>
  <rect x="385" y="536" width="820" height="32" rx="10" fill="#EEF4F9" stroke="#D7E2EC"/>
