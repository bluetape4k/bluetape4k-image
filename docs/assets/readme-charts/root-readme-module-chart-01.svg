  <rect x="385" y="584" width="820" height="32" rx="10" fill="#FFF3D9" stroke="#D9AA4D" stroke-width="2"/>
  <text class="label" x="1225" y="601" dominant-baseline="middle">1</text>

  <text class="small" x="700" y="711" text-anchor="middle">Counts exclude buildSrc and generated build outputs.</text>
</svg>
