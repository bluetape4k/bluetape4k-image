<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="980" viewBox="0 0 2300 980" role="img" aria-label="Ktor Image API Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="2300" height="980"/>
<rect class="frame" x="34" y="28" width="2232" height="922" rx="26"/>
<text class="title" x="70" y="82">Ktor Image API Architecture</text>
<text class="subtitle" x="74" y="116">Application.configureKtorImageApi installs core JSON support and bluetape4k route helpers.</text>
<g id="layers" transform="translate(0 70)">
<rect x="72" y="180" width="450" height="560" rx="18" fill="#E8F3FF" stroke="#5B8DEF" stroke-width="1.8" opacity="0.34"/>
<text class="panel-title" x="90" y="212" dominant-baseline="middle">Application</text>
<rect x="560" y="180" width="460" height="560" rx="18" fill="#EAF7EF" stroke="#58A978" stroke-width="1.8" opacity="0.34"/>
<text class="panel-title" x="578" y="212" dominant-baseline="middle">Ktor Runtime</text>
<rect x="1060" y="180" width="650" height="560" rx="18" fill="#FFF3D9" stroke="#D6A441" stroke-width="1.8" opacity="0.34"/>
<text class="panel-title" x="1078" y="212" dominant-baseline="middle">Route Helpers</text>
<rect x="1740" y="180" width="488" height="560" rx="18" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.8" opacity="0.34"/>
<text class="panel-title" x="1758" y="212" dominant-baseline="middle">Libraries</text>
</g>
<g id="edges" transform="translate(0 70)">
<path class="edge" d="M 500 416 L 560 416 L 560 306 L 620 306" stroke="#758297"/>
<path class="edge" d="M 500 416 L 560 416 L 560 556 L 620 556" stroke="#758297"/>
<path class="edge" d="M 1000 556 L 1060 556 L 1060 416 L 1120 416" stroke="#758297"/>
<path class="edge" d="M 1000 556 L 1060 556 L 1060 616 L 1120 616" stroke="#758297"/>
<path class="edge" d="M 1640 416 L 1780 416" stroke="#758297"/>
<path class="edge" d="M 1680 616 L 1780 616" stroke="#758297"/>
</g>
<g id="nodes" transform="translate(0 70)">
<g id="app">
  <rect class="card" x="110" y="360" width="390" height="112" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="305" y="406.0" text-anchor="middle" dominant-baseline="middle">Application module</text>
  <text class="node-detail" x="305" y="426.0" text-anchor="middle" dominant-baseline="middle">configureKtorImageApi</text>
</g>
<g id="core">
  <rect class="card" x="620" y="250" width="380" height="112" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="810" y="296.0" text-anchor="middle" dominant-baseline="middle">Ktor core plugin</text>
  <text class="node-detail" x="810" y="316.0" text-anchor="middle" dominant-baseline="middle">JSON and errors</text>
</g>
<g id="routing">
  <rect class="card" x="620" y="500" width="380" height="112" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="810" y="546.0" text-anchor="middle" dominant-baseline="middle">Routing DSL</text>
  <text class="node-detail" x="810" y="566.0" text-anchor="middle" dominant-baseline="middle">ready + image routes</text>
</g>
<g id="captcha">
  <rect class="card" x="1120" y="360" width="520" height="112" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="1380" y="406.0" text-anchor="middle" dominant-baseline="middle">bluetape4kCaptchaRoutes</text>
  <text class="node-detail" x="1380" y="426.0" text-anchor="middle" dominant-baseline="middle">CaptchaKtorRoutesConfig</text>
</g>
<g id="thumbnail">
  <rect class="card" x="1120" y="560" width="560" height="112" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="1400" y="606.0" text-anchor="middle" dominant-baseline="middle">bluetape4kImageThumbnailRoutes</text>
  <text class="node-detail" x="1400" y="626.0" text-anchor="middle" dominant-baseline="middle">ImageThumbnailKtorRoutesConfig</text>
</g>
<g id="captchaLib">
  <rect class="card" x="1780" y="360" width="400" height="112" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="1980" y="406.0" text-anchor="middle" dominant-baseline="middle">images-captcha</text>
  <text class="node-detail" x="1980" y="426.0" text-anchor="middle" dominant-baseline="middle">PNG challenge generation</text>
</g>
<g id="images">
  <rect class="card" x="1780" y="560" width="400" height="112" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="node-title" x="1980" y="606.0" text-anchor="middle" dominant-baseline="middle">bluetape4k-images</text>
  <text class="node-detail" x="1980" y="626.0" text-anchor="middle" dominant-baseline="middle">multipart thumbnail</text>
</g>
</g>
<text class="footer" x="1150.0" y="930" text-anchor="middle">Tests use Ktor testApplication and bluetape4kJsonClient against the same module wiring.</text>
</svg>
