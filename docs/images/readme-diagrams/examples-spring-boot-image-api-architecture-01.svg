<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="980" viewBox="0 0 2200 980" role="img" aria-label="Spring Boot Image API Architecture">
<defs>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
  <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  <style>
    .canvas{fill:#ffffff}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#111827;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#6b7280;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#111827;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#6b7280;font-weight:400}
    .panel-title{font-family:"Comic Mono";font-size:16px;fill:#4b5563;font-weight:700;letter-spacing:0.8px}
    .layer{fill:#f3f6fa;stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:8 6}
    .layer-title{font-family:"Comic Mono";font-size:16px;fill:#4b5563;font-weight:700;letter-spacing:0.8px}
    .label{font-family:"Comic Mono";font-size:12px;fill:#374151;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#6b7280;font-weight:400}
    .footer-pill{fill:#ffffff;stroke:#d1d5db;stroke-width:1}
    .card{fill:#ffffff;stroke:#94a3b8;stroke-width:1.9}
    .edge{stroke:#2563eb;stroke-width:2.1;fill:none;marker-end:url(#arrow-blue);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#6b7280;stroke-width:1.8;fill:none;marker-end:url(#arrow-gray);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 4}
    .lifeline{stroke:#d1d5db;stroke-width:1.5;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="2200" height="980"/>
<text class="title" x="70" y="82">Spring Boot Image API Architecture</text>
<text class="subtitle" x="74" y="116">Spring Boot auto-configuration provides local ImageStorage for the quickstart service.</text>
<g id="layers" transform="translate(0 70)">
<rect class="layer" x="72" y="180" width="470" height="560" rx="8"/>
<text class="panel-title" x="90" y="208" dominant-baseline="middle">APPLICATION</text>
<rect class="layer" x="580" y="180" width="500" height="560" rx="8"/>
<text class="panel-title" x="598" y="208" dominant-baseline="middle">API + CONFIG</text>
<rect class="layer" x="1120" y="180" width="470" height="560" rx="8"/>
<text class="panel-title" x="1138" y="208" dominant-baseline="middle">LOCAL SERVICE</text>
<rect class="layer" x="1630" y="180" width="498" height="560" rx="8"/>
<text class="panel-title" x="1648" y="208" dominant-baseline="middle">STORAGE</text>
</g>
<g id="edges" transform="translate(0 70)">
<path class="edge" d="M 500 436 L 560 436 L 560 336 L 620 336" stroke="#758297"/>
<path class="edge" d="M 500 436 L 560 436 L 560 596 L 620 596" stroke="#758297"/>
<path class="edge" d="M 1020 336 L 1080 336 L 1080 438 L 1140 438" stroke="#758297"/>
<path class="edge" d="M 1050 596 L 1090 596 L 1090 438 L 1140 438" stroke="#758297"/>
<path class="edge" d="M 1560 438 L 1660 438" stroke="#758297"/>
<path class="edge" d="M 1850 492 L 1850 600" stroke="#758297"/>
</g>
<g id="nodes" transform="translate(0 70)">
<g id="boot">
  <rect class="card" x="110" y="380" width="390" height="112" rx="8"/>
  <rect x="124" y="416" width="40" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text class="node-title" x="178" y="427.0" dominant-baseline="middle">Spring Boot 4 app</text>
  <text class="node-detail" x="178" y="445.0" dominant-baseline="middle">SpringBootImageApiApplication</text>
</g>
<g id="controller">
  <rect class="card" x="620" y="280" width="400" height="112" rx="8"/>
  <rect x="634" y="316" width="40" height="40" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text class="node-title" x="688" y="327.0" dominant-baseline="middle">ImageApiController</text>
  <text class="node-detail" x="688" y="345.0" dominant-baseline="middle">upload and download endpoints</text>
</g>
<g id="config">
  <rect class="card" x="620" y="540" width="430" height="112" rx="8"/>
  <rect x="634" y="576" width="40" height="40" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text class="node-title" x="688" y="587.0" dominant-baseline="middle">LocalImageApiConfiguration</text>
  <text class="node-detail" x="688" y="605.0" dominant-baseline="middle">wires ImageStorage bean</text>
</g>
<g id="service">
  <rect class="card" x="1140" y="380" width="420" height="116" rx="8"/>
  <rect x="1154" y="418" width="40" height="40" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text class="node-title" x="1208" y="420.0" dominant-baseline="middle">LocalImageApiService</text>
  <text class="node-detail" x="1208" y="438.0" dominant-baseline="middle">UploadOptions allowlist</text>
  <text class="node-detail" x="1208" y="456.0" dominant-baseline="middle">thumbnail generation</text>
</g>
<g id="storage">
  <rect class="card" x="1660" y="380" width="380" height="112" rx="8"/>
  <rect x="1674" y="416" width="40" height="40" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.2"/>
  <text class="node-title" x="1728" y="427.0" dominant-baseline="middle">ImageStorage</text>
  <text class="node-detail" x="1728" y="445.0" dominant-baseline="middle">LocalImageStorage backend</text>
</g>
<g id="files">
  <rect class="card" x="1660" y="600" width="380" height="112" rx="8"/>
  <rect x="1674" y="636" width="40" height="40" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2"/>
  <text class="node-title" x="1728" y="647.0" dominant-baseline="middle">Filesystem root</text>
  <text class="node-detail" x="1728" y="665.0" dominant-baseline="middle">originals/ and thumbnails/</text>
</g>
</g>
<g id="edge-labels" transform="translate(0 70)">
<rect x="426.0" y="310.0" width="88" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="470.0" y="322.0" text-anchor="middle" dominant-baseline="middle">scan</text>
<rect x="426.0" y="505.0" width="88" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="470.0" y="517.0" text-anchor="middle" dominant-baseline="middle">config</text>
<rect x="996.0" y="210.0" width="100" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="1046.0" y="222.0" text-anchor="middle" dominant-baseline="middle">delegate</text>
<rect x="966.0" y="680.0" width="88" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="1010.0" y="692.0" text-anchor="middle" dominant-baseline="middle">bean</text>
<rect x="1532.0" y="310.0" width="156" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="1610.0" y="322.0" text-anchor="middle" dominant-baseline="middle">upload/download</text>
<rect x="1854.0" y="528.0" width="92" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="1900.0" y="540.0" text-anchor="middle" dominant-baseline="middle">persist</text>
</g>
<text class="footer" x="1100.0" y="930" text-anchor="middle">https://github.com/bluetape4k/bluetape4k-image | project: bluetape4k-image | module: examples:spring-boot-image-api</text>
</svg>
