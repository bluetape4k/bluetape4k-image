<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="980" viewBox="0 0 2200 980" role="img" aria-label="Spring Boot Image API Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="2200" height="980"/>
<rect class="frame" x="34" y="28" width="2132" height="922" rx="26"/>
<text class="title" x="70" y="82">Spring Boot Image API Architecture</text>
<text class="subtitle" x="74" y="116">Spring Boot auto-configuration provides local ImageStorage for the quickstart service.</text>
<g id="layers" transform="translate(0 70)">
<rect x="72" y="180" width="470" height="560" rx="18" fill="#E8F3FF" stroke="#5B8DEF" stroke-width="1.8" opacity="0.34"/>
<text class="panel-title" x="90" y="212" dominant-baseline="middle">Application</text>
<rect x="580" y="180" width="500" height="560" rx="18" fill="#EAF7EF" stroke="#58A978" stroke-width="1.8" opacity="0.34"/>
<text class="panel-title" x="598" y="212" dominant-baseline="middle">API + Config</text>
<rect x="1120" y="180" width="470" height="560" rx="18" fill="#FFF3D9" stroke="#D6A441" stroke-width="1.8" opacity="0.34"/>
<text class="panel-title" x="1138" y="212" dominant-baseline="middle">Local Service</text>
<rect x="1630" y="180" width="498" height="560" rx="18" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.8" opacity="0.34"/>
<text class="panel-title" x="1648" y="212" dominant-baseline="middle">Storage</text>
</g>
<g id="edges" transform="translate(0 70)">
<path class="edge" d="M 500 436 L 560 436 L 560 336 L 620 336" stroke="#758297"/>
<path class="edge" d="M 500 436 L 560 436 L 560 596 L 620 596" stroke="#758297"/>
<path class="edge" d="M 1020 336 L 1080 336 L 1080 438 L 1140 438" stroke="#758297"/>
<path class="edge" d="M 1050 596 L 1090 596 L 1090 438 L 1140 438" stroke="#758297"/>
<path class="edge" d="M 1560 438 L 1660 438" stroke="#758297"/>
<path class="edge" d="M 1850 492 L 1850 600" stroke="#758297"/>
</g>
<g id="nodes" transform="translate(0 70)">
<g id="boot">
  <rect class="card" x="110" y="380" width="390" height="112" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="305" y="426.0" text-anchor="middle" dominant-baseline="middle">Spring Boot 4 app</text>
  <text class="node-detail" x="305" y="446.0" text-anchor="middle" dominant-baseline="middle">SpringBootImageApiApplication</text>
</g>
<g id="controller">
  <rect class="card" x="620" y="280" width="400" height="112" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="820" y="326.0" text-anchor="middle" dominant-baseline="middle">ImageApiController</text>
  <text class="node-detail" x="820" y="346.0" text-anchor="middle" dominant-baseline="middle">upload and download endpoints</text>
</g>
<g id="config">
  <rect class="card" x="620" y="540" width="430" height="112" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="835" y="586.0" text-anchor="middle" dominant-baseline="middle">LocalImageApiConfiguration</text>
  <text class="node-detail" x="835" y="606.0" text-anchor="middle" dominant-baseline="middle">wires ImageStorage bean</text>
</g>
<g id="service">
  <rect class="card" x="1140" y="380" width="420" height="116" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="1350" y="418.0" text-anchor="middle" dominant-baseline="middle">LocalImageApiService</text>
  <text class="node-detail" x="1350" y="438.0" text-anchor="middle" dominant-baseline="middle">UploadOptions allowlist</text>
  <text class="node-detail" x="1350" y="458.0" text-anchor="middle" dominant-baseline="middle">thumbnail generation</text>
</g>
<g id="storage">
  <rect class="card" x="1660" y="380" width="380" height="112" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="1850" y="426.0" text-anchor="middle" dominant-baseline="middle">ImageStorage</text>
  <text class="node-detail" x="1850" y="446.0" text-anchor="middle" dominant-baseline="middle">LocalImageStorage backend</text>
</g>
<g id="files">
  <rect class="card" x="1660" y="600" width="380" height="112" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="1850" y="646.0" text-anchor="middle" dominant-baseline="middle">Filesystem root</text>
  <text class="node-detail" x="1850" y="666.0" text-anchor="middle" dominant-baseline="middle">originals/ and thumbnails/</text>
</g>
</g>
<g id="edge-labels" transform="translate(0 70)">
<rect x="438.0" y="310.0" width="64" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="470.0" y="322.0" text-anchor="middle" dominant-baseline="middle">scan</text>
<rect x="432.0" y="505.0" width="76" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="470.0" y="517.0" text-anchor="middle" dominant-baseline="middle">config</text>
<rect x="1000.0" y="210.0" width="92" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1046.0" y="222.0" text-anchor="middle" dominant-baseline="middle">delegate</text>
<rect x="978.0" y="680.0" width="64" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1010.0" y="692.0" text-anchor="middle" dominant-baseline="middle">bean</text>
<rect x="1536.0" y="310.0" width="148" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1610.0" y="322.0" text-anchor="middle" dominant-baseline="middle">upload/download</text>
<rect x="1858.0" y="528.0" width="84" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1900.0" y="540.0" text-anchor="middle" dominant-baseline="middle">persist</text>
</g>
<text class="footer" x="1100.0" y="930" text-anchor="middle">S3/CDN policy is intentionally left to the advanced workshop, not this local quickstart.</text>
</svg>
