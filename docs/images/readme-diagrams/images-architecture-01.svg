</g>
<g transform="translate(1365,236)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="130" y="52.5" text-anchor="middle">SuspendJpegWriter</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">(lossy)</text>
</g>
<g transform="translate(1365,378)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="130" y="52.5" text-anchor="middle">SuspendPngWriter</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">(lossless)</text>
</g>
<g transform="translate(1365,520)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="130" y="52.5" text-anchor="middle">SuspendWebpWriter</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">(best compression)</text>
