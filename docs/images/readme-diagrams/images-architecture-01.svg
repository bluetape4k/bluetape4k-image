<text class="smallLabel" x="130" y="52.5" text-anchor="middle">Crop/Smart</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">Crop/Rotate/Perspect</text>
<text class="smallLabel" x="130" y="94.5" text-anchor="middle">ive/CLAHE)</text>
</g>
