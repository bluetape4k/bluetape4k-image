  <text class="smallLabel" x="130" y="52.5" text-anchor="middle">Watermark</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">(WatermarkFilter)</text>
</g>
<g transform="translate(945,662)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="130" y="52.5" text-anchor="middle">Caption</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">(CaptionFilter)</text>
</g>
