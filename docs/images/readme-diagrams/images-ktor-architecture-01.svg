<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-label="Images Ktor Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="1800" height="1100"/>
<rect class="frame" x="34" y="28" width="1732" height="1042" rx="26"/>
<text class="title" x="70" y="82">Images Ktor Architecture</text>
<text class="subtitle" x="74" y="116">Ktor route helpers compose thumbnail generation, CAPTCHA issue, and one-shot verification.</text>
<g id="layers">
<rect class="layer" x="72" y="176" width="1656" height="132" rx="18"/>
<text class="layer-title" x="104" y="210" dominant-baseline="middle">Application</text>
<rect class="layer" x="72" y="356" width="1656" height="176" rx="18"/>
<text class="layer-title" x="104" y="390" dominant-baseline="middle">Route Helpers</text>
<rect class="layer" x="72" y="588" width="1656" height="160" rx="18"/>
<text class="layer-title" x="104" y="622" dominant-baseline="middle">Processing Libraries</text>
<rect class="layer" x="72" y="806" width="1656" height="148" rx="18"/>
<text class="layer-title" x="104" y="840" dominant-baseline="middle">Host Responsibilities</text>
</g>
<g id="edges">
<path class="edge" d="M 520 283 L 520 340 L 450 340 L 450 382" stroke="#56708C"/>
<path class="edge-dashed" d="M 970 283 L 970 335 L 1540 335 L 1540 440" stroke="#8A72D6"/>
<path class="edge" d="M 600 425 L 720 448" stroke="#56708C"/>
<path class="edge" d="M 600 425 L 675 425 L 675 548 L 1245 548 L 1245 460" stroke="#58A978"/>
<path class="edge" d="M 880 491 L 880 565 L 570 565 L 570 630" stroke="#DB7890"/>
<path class="edge" d="M 1245 460 L 1245 565 L 1025 565 L 1025 606" stroke="#45A7A1"/>
<path class="edge" d="M 1245 460 L 1245 585 L 1430 585 L 1430 642" stroke="#D9AA4D"/>
<path class="edge-dashed" d="M 450 468 L 450 810 L 520 810 L 520 850" stroke="#56708C"/>
<path class="edge-dashed" d="M 570 716 L 570 805 L 950 805 L 950 838" stroke="#D9AA4D"/>
<path class="edge-dashed" d="M 570 716 L 570 805 L 1380 805 L 1380 852" stroke="#45A7A1"/>
</g>
<g id="nodes">
<g id="app">
  <rect class="card" x="370" y="205" width="300" height="78" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="520" y="234.0" text-anchor="middle" dominant-baseline="middle">Ktor application</text>
  <text class="node-detail" x="520" y="254.0" text-anchor="middle" dominant-baseline="middle">install core plugin</text>
</g>
<g id="core">
  <rect class="card" x="805" y="205" width="330" height="78" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="970" y="234.0" text-anchor="middle" dominant-baseline="middle">Ktor core baseline</text>
  <text class="node-detail" x="970" y="254.0" text-anchor="middle" dominant-baseline="middle">JSON and API errors</text>
</g>
<g id="routing">
  <rect class="card" x="300" y="382" width="300" height="86" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="450" y="415.0" text-anchor="middle" dominant-baseline="middle">Routing DSL</text>
  <text class="node-detail" x="450" y="435.0" text-anchor="middle" dominant-baseline="middle">routing { ... }</text>
</g>
<g id="thumb">
  <rect class="card" x="720" y="405" width="320" height="86" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="880" y="428.0" text-anchor="middle" dominant-baseline="middle">Thumbnail routes</text>
  <text class="node-detail" x="880" y="448.0" text-anchor="middle" dominant-baseline="middle">multipart upload</text>
  <text class="node-detail" x="880" y="468.0" text-anchor="middle" dominant-baseline="middle">PNG thumbnail</text>
</g>
<g id="captchaRoutes">
  <rect class="card" x="1085" y="374" width="320" height="86" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="1245" y="407.0" text-anchor="middle" dominant-baseline="middle">CAPTCHA routes</text>
  <text class="node-detail" x="1245" y="427.0" text-anchor="middle" dominant-baseline="middle">issue and verify</text>
</g>
<g id="errors">
  <rect class="card" x="1390" y="440" width="300" height="86" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="1540" y="473.0" text-anchor="middle" dominant-baseline="middle">Error payloads</text>
  <text class="node-detail" x="1540" y="493.0" text-anchor="middle" dominant-baseline="middle">ApiErrorResponse</text>
</g>
<g id="images">
  <rect class="card" x="400" y="630" width="340" height="86" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="570" y="653.0" text-anchor="middle" dominant-baseline="middle">bluetape4k-images</text>
  <text class="node-detail" x="570" y="673.0" text-anchor="middle" dominant-baseline="middle">immutableImageOf</text>
  <text class="node-detail" x="570" y="693.0" text-anchor="middle" dominant-baseline="middle">max + writer</text>
</g>
<g id="captcha">
  <rect class="card" x="845" y="606" width="360" height="86" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="node-title" x="1025" y="629.0" text-anchor="middle" dominant-baseline="middle">images-captcha</text>
  <text class="node-detail" x="1025" y="649.0" text-anchor="middle" dominant-baseline="middle">CaptchaGenerator</text>
  <text class="node-detail" x="1025" y="669.0" text-anchor="middle" dominant-baseline="middle">VerificationService</text>
</g>
<g id="challengeStore">
  <rect class="card" x="1260" y="642" width="340" height="86" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="1430" y="665.0" text-anchor="middle" dominant-baseline="middle">Challenge store</text>
  <text class="node-detail" x="1430" y="685.0" text-anchor="middle" dominant-baseline="middle">in-memory default</text>
  <text class="node-detail" x="1430" y="705.0" text-anchor="middle" dominant-baseline="middle">replace for clusters</text>
</g>
<g id="auth">
  <rect class="card" x="360" y="850" width="320" height="78" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="520" y="879.0" text-anchor="middle" dominant-baseline="middle">Authorization policy</text>
  <text class="node-detail" x="520" y="899.0" text-anchor="middle" dominant-baseline="middle">host application</text>
</g>
<g id="cdn">
  <rect class="card" x="790" y="838" width="320" height="78" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="950" y="867.0" text-anchor="middle" dominant-baseline="middle">S3/CDN URLs</text>
  <text class="node-detail" x="950" y="887.0" text-anchor="middle" dominant-baseline="middle">compose outside routes</text>
</g>
<g id="native">
  <rect class="card" x="1210" y="852" width="340" height="78" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="1380" y="881.0" text-anchor="middle" dominant-baseline="middle">Native acceleration</text>
  <text class="node-detail" x="1380" y="901.0" text-anchor="middle" dominant-baseline="middle">libvips remains optional</text>
</g>
</g>
<rect class="footer-pill" x="76" y="1002" width="1648" height="34" rx="10"/>
<text class="footer" x="900.0" y="1024" text-anchor="middle">Graphviz evidence: images-ktor-architecture-01.dot, .plain, and -graphviz.svg. Host systems compose persistence, authorization, and delivery policy.</text>
</svg>
