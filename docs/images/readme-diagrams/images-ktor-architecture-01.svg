<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-label="Images Ktor Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="1500" height="930"/>
<rect class="frame" x="34" y="28" width="1432" height="872" rx="26"/>
<text class="title" x="70" y="82">Images Ktor Architecture</text>
<text class="subtitle" x="74" y="116">Ktor route helpers compose thumbnail generation, CAPTCHA issue, and one-shot verification.</text>
<g id="layers">
<rect class="layer" x="72" y="152" width="1356" height="122" rx="18"/>
<text class="layer-title" x="104" y="186" dominant-baseline="middle">Application</text>
<rect class="layer" x="72" y="308" width="1356" height="142" rx="18"/>
<text class="layer-title" x="104" y="342" dominant-baseline="middle">Route Helpers</text>
<rect class="layer" x="72" y="484" width="1356" height="146" rx="18"/>
<text class="layer-title" x="104" y="518" dominant-baseline="middle">Processing Libraries</text>
<rect class="layer" x="72" y="664" width="1356" height="142" rx="18"/>
<text class="layer-title" x="104" y="698" dominant-baseline="middle">Host Responsibilities</text>
</g>
<g id="edges">
<path class="edge" d="M 460 246 L 460 300 L 390 300 L 390 340" stroke="#56708C"/>
<path class="edge-dashed" d="M 830 246 L 830 300 L 1255 300 L 1255 340" stroke="#8A72D6"/>
<path class="edge" d="M 510 379 L 560 379" stroke="#56708C"/>
<path class="edge" d="M 510 379 L 535 379 L 535 458 L 985 458 L 985 418" stroke="#58A978"/>
<path class="edge" d="M 685 418 L 685 472 L 500 472 L 500 522" stroke="#DB7890"/>
<path class="edge" d="M 985 418 L 985 472 L 850 472 L 850 522" stroke="#45A7A1"/>
<path class="edge" d="M 985 418 L 985 472 L 1200 472 L 1200 522" stroke="#D9AA4D"/>
<path class="edge-dashed" d="M 390 418 L 390 676 L 505 676 L 505 704" stroke="#56708C"/>
<path class="edge-dashed" d="M 500 600 L 500 676 L 815 676 L 815 704" stroke="#D9AA4D"/>
<path class="edge-dashed" d="M 500 600 L 500 676 L 1140 676 L 1140 704" stroke="#45A7A1"/>
</g>
<g id="nodes">
<g id="app">
  <rect class="card" x="330" y="174" width="260" height="72" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="460" y="200.0" text-anchor="middle" dominant-baseline="middle">Ktor application</text>
  <text class="node-detail" x="460" y="220.0" text-anchor="middle" dominant-baseline="middle">install core plugin</text>
</g>
<g id="core">
  <rect class="card" x="690" y="174" width="280" height="72" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="830" y="200.0" text-anchor="middle" dominant-baseline="middle">Ktor core baseline</text>
  <text class="node-detail" x="830" y="220.0" text-anchor="middle" dominant-baseline="middle">JSON and API errors</text>
</g>
<g id="routing">
  <rect class="card" x="270" y="340" width="240" height="78" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="390" y="369.0" text-anchor="middle" dominant-baseline="middle">Routing DSL</text>
  <text class="node-detail" x="390" y="389.0" text-anchor="middle" dominant-baseline="middle">routing { ... }</text>
</g>
<g id="thumb">
  <rect class="card" x="560" y="340" width="250" height="78" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="685" y="359.0" text-anchor="middle" dominant-baseline="middle">Thumbnail routes</text>
  <text class="node-detail" x="685" y="379.0" text-anchor="middle" dominant-baseline="middle">multipart upload</text>
  <text class="node-detail" x="685" y="399.0" text-anchor="middle" dominant-baseline="middle">PNG thumbnail</text>
</g>
<g id="captchaRoutes">
  <rect class="card" x="860" y="340" width="250" height="78" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="985" y="369.0" text-anchor="middle" dominant-baseline="middle">CAPTCHA routes</text>
  <text class="node-detail" x="985" y="389.0" text-anchor="middle" dominant-baseline="middle">issue and verify</text>
</g>
<g id="errors">
  <rect class="card" x="1130" y="340" width="250" height="78" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="1255" y="369.0" text-anchor="middle" dominant-baseline="middle">Error payloads</text>
  <text class="node-detail" x="1255" y="389.0" text-anchor="middle" dominant-baseline="middle">ApiErrorResponse</text>
</g>
<g id="images">
  <rect class="card" x="360" y="522" width="280" height="78" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="500" y="541.0" text-anchor="middle" dominant-baseline="middle">bluetape4k-images</text>
  <text class="node-detail" x="500" y="561.0" text-anchor="middle" dominant-baseline="middle">immutableImageOf</text>
  <text class="node-detail" x="500" y="581.0" text-anchor="middle" dominant-baseline="middle">max + writer</text>
</g>
<g id="captcha">
  <rect class="card" x="700" y="522" width="300" height="78" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="node-title" x="850" y="541.0" text-anchor="middle" dominant-baseline="middle">images-captcha</text>
  <text class="node-detail" x="850" y="561.0" text-anchor="middle" dominant-baseline="middle">CaptchaGenerator</text>
  <text class="node-detail" x="850" y="581.0" text-anchor="middle" dominant-baseline="middle">VerificationService</text>
</g>
<g id="challengeStore">
  <rect class="card" x="1060" y="522" width="280" height="78" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="1200" y="541.0" text-anchor="middle" dominant-baseline="middle">Challenge store</text>
  <text class="node-detail" x="1200" y="561.0" text-anchor="middle" dominant-baseline="middle">in-memory default</text>
  <text class="node-detail" x="1200" y="581.0" text-anchor="middle" dominant-baseline="middle">replace for clusters</text>
</g>
<g id="auth">
  <rect class="card" x="370" y="704" width="270" height="72" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="505" y="730.0" text-anchor="middle" dominant-baseline="middle">Authorization policy</text>
  <text class="node-detail" x="505" y="750.0" text-anchor="middle" dominant-baseline="middle">host application</text>
</g>
<g id="cdn">
  <rect class="card" x="680" y="704" width="270" height="72" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="815" y="730.0" text-anchor="middle" dominant-baseline="middle">S3/CDN URLs</text>
  <text class="node-detail" x="815" y="750.0" text-anchor="middle" dominant-baseline="middle">compose outside routes</text>
</g>
<g id="native">
  <rect class="card" x="990" y="704" width="300" height="72" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="1140" y="730.0" text-anchor="middle" dominant-baseline="middle">Native acceleration</text>
  <text class="node-detail" x="1140" y="750.0" text-anchor="middle" dominant-baseline="middle">libvips remains optional</text>
</g>
</g>
<rect class="footer-pill" x="76" y="832" width="1348" height="34" rx="10"/>
<text class="footer" x="750.0" y="854" text-anchor="middle">Graphviz evidence: images-ktor-architecture-01.dot, .plain, and -graphviz.svg. Host systems compose persistence, authorization, and delivery policy.</text>
</svg>
