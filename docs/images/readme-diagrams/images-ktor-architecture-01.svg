<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1320" viewBox="0 0 2200 1320" role="img" aria-label="Images Ktor Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="2200" height="1320"/>
<rect class="frame" x="34" y="28" width="2132" height="1262" rx="26"/>
<text class="title" x="70" y="82">Images Ktor Architecture</text>
<text class="subtitle" x="74" y="116">Ktor route helpers compose thumbnail generation, CAPTCHA issue, and one-shot verification.</text>
<g id="layers" transform="translate(0 0)">
<rect class="layer" x="72" y="196" width="2056" height="142" rx="18"/>
<text class="layer-title" x="104" y="230" dominant-baseline="middle">Application</text>
<rect class="layer" x="72" y="390" width="2056" height="238" rx="18"/>
<text class="layer-title" x="104" y="424" dominant-baseline="middle">Route Helpers</text>
<rect class="layer" x="72" y="720" width="2056" height="190" rx="18"/>
<text class="layer-title" x="104" y="754" dominant-baseline="middle">Processing Libraries</text>
<rect class="layer" x="72" y="1030" width="2056" height="170" rx="18"/>
<text class="layer-title" x="104" y="1064" dominant-baseline="middle">Host Responsibilities</text>
</g>
<g id="edges" transform="translate(0 0)">
<path class="edge" d="M 585 307 L 585 370 L 510 370 L 510 440" stroke="#56708C"/>
<path class="edge-dashed" d="M 1140 307 L 1140 365 L 1875 365 L 1875 515" stroke="#8A72D6"/>
<path class="edge" d="M 680 486 L 820 486" stroke="#56708C"/>
<path class="edge" d="M 680 486 L 725 486 L 725 625 L 1500 625 L 1500 512" stroke="#58A978"/>
<path class="edge" d="M 1000 547 L 1000 650 L 625 650 L 625 765" stroke="#DB7890"/>
<path class="edge" d="M 1500 512 L 1500 650 L 1145 650 L 1145 735" stroke="#45A7A1"/>
<path class="edge" d="M 1500 512 L 1500 690 L 1705 690 L 1705 775" stroke="#D9AA4D"/>
<path class="edge-dashed" d="M 510 532 L 200 532 L 200 1111 L 410 1111" stroke="#56708C"/>
<path class="edge-dashed" d="M 625 857 L 625 970 L 1115 970 L 1115 1050" stroke="#D9AA4D"/>
<path class="edge-dashed" d="M 625 857 L 625 990 L 1650 990 L 1650 1070" stroke="#45A7A1"/>
</g>
<g id="nodes" transform="translate(0 0)">
<g id="app">
  <rect class="card" x="420" y="225" width="330" height="82" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="585" y="256.0" text-anchor="middle" dominant-baseline="middle">Ktor application</text>
  <text class="node-detail" x="585" y="276.0" text-anchor="middle" dominant-baseline="middle">install core plugin</text>
</g>
<g id="core">
  <rect class="card" x="960" y="225" width="360" height="82" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="1140" y="256.0" text-anchor="middle" dominant-baseline="middle">Ktor core baseline</text>
  <text class="node-detail" x="1140" y="276.0" text-anchor="middle" dominant-baseline="middle">JSON and API errors</text>
</g>
<g id="routing">
  <rect class="card" x="340" y="440" width="340" height="92" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="510" y="476.0" text-anchor="middle" dominant-baseline="middle">Routing DSL</text>
  <text class="node-detail" x="510" y="496.0" text-anchor="middle" dominant-baseline="middle">routing { ... }</text>
</g>
<g id="thumb">
  <rect class="card" x="820" y="455" width="360" height="92" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="1000" y="481.0" text-anchor="middle" dominant-baseline="middle">Thumbnail routes</text>
  <text class="node-detail" x="1000" y="501.0" text-anchor="middle" dominant-baseline="middle">multipart upload</text>
  <text class="node-detail" x="1000" y="521.0" text-anchor="middle" dominant-baseline="middle">PNG thumbnail</text>
</g>
<g id="captchaRoutes">
  <rect class="card" x="1320" y="420" width="360" height="92" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="1500" y="456.0" text-anchor="middle" dominant-baseline="middle">CAPTCHA routes</text>
  <text class="node-detail" x="1500" y="476.0" text-anchor="middle" dominant-baseline="middle">issue and verify</text>
</g>
<g id="errors">
  <rect class="card" x="1710" y="515" width="330" height="92" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="1875" y="551.0" text-anchor="middle" dominant-baseline="middle">Error payloads</text>
  <text class="node-detail" x="1875" y="571.0" text-anchor="middle" dominant-baseline="middle">ApiErrorResponse</text>
</g>
<g id="images">
  <rect class="card" x="430" y="765" width="390" height="92" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="625" y="791.0" text-anchor="middle" dominant-baseline="middle">bluetape4k-images</text>
  <text class="node-detail" x="625" y="811.0" text-anchor="middle" dominant-baseline="middle">immutableImageOf</text>
  <text class="node-detail" x="625" y="831.0" text-anchor="middle" dominant-baseline="middle">max + writer</text>
</g>
<g id="captcha">
  <rect class="card" x="940" y="735" width="410" height="92" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="node-title" x="1145" y="761.0" text-anchor="middle" dominant-baseline="middle">images-captcha</text>
  <text class="node-detail" x="1145" y="781.0" text-anchor="middle" dominant-baseline="middle">CaptchaGenerator</text>
  <text class="node-detail" x="1145" y="801.0" text-anchor="middle" dominant-baseline="middle">VerificationService</text>
</g>
<g id="challengeStore">
  <rect class="card" x="1510" y="775" width="390" height="92" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="1705" y="801.0" text-anchor="middle" dominant-baseline="middle">Challenge store</text>
  <text class="node-detail" x="1705" y="821.0" text-anchor="middle" dominant-baseline="middle">in-memory default</text>
  <text class="node-detail" x="1705" y="841.0" text-anchor="middle" dominant-baseline="middle">replace for clusters</text>
</g>
<g id="auth">
  <rect class="card" x="410" y="1070" width="360" height="82" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="590" y="1101.0" text-anchor="middle" dominant-baseline="middle">Authorization policy</text>
  <text class="node-detail" x="590" y="1121.0" text-anchor="middle" dominant-baseline="middle">host application</text>
</g>
<g id="cdn">
  <rect class="card" x="935" y="1050" width="360" height="82" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="1115" y="1081.0" text-anchor="middle" dominant-baseline="middle">S3/CDN URLs</text>
  <text class="node-detail" x="1115" y="1101.0" text-anchor="middle" dominant-baseline="middle">compose outside routes</text>
</g>
<g id="native">
  <rect class="card" x="1460" y="1070" width="380" height="82" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="1650" y="1101.0" text-anchor="middle" dominant-baseline="middle">Native acceleration</text>
  <text class="node-detail" x="1650" y="1121.0" text-anchor="middle" dominant-baseline="middle">libvips remains optional</text>
</g>
</g>
<rect class="footer-pill" x="76" y="1222" width="2048" height="34" rx="10"/>
<text class="footer" x="1100.0" y="1244" text-anchor="middle">Graphviz evidence: images-ktor-architecture-01.dot, .plain, and -graphviz.svg. Host systems compose persistence, authorization, and delivery policy.</text>
</svg>
