<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="840" viewBox="0 0 1380 840" role="img" aria-label="Basic Processing Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="1380" height="840"/>
<rect class="frame" x="34" y="28" width="1312" height="782" rx="26"/>
<text class="title" x="70" y="82">Basic Processing Sequence</text>
<text class="subtitle" x="74" y="116">The smoke test and run task share one deterministic generator.</text>
<g id="participants">
<rect class="card" x="70" y="185" width="230" height="72" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="node-title" x="185" y="214" text-anchor="middle" dominant-baseline="middle">User</text>
<text class="node-detail" x="185" y="238" text-anchor="middle" dominant-baseline="middle">Gradle CLI</text>
<line class="lifeline" x1="185" y1="257" x2="185" y2="745"/>
<rect class="card" x="323" y="185" width="230" height="72" rx="10" fill="#EAF7EF" stroke="#58A978"/>
<text class="node-title" x="438" y="214" text-anchor="middle" dominant-baseline="middle">main</text>
<text class="node-detail" x="438" y="238" text-anchor="middle" dominant-baseline="middle">runBlocking</text>
<line class="lifeline" x1="438" y1="257" x2="438" y2="745"/>
<rect class="card" x="575" y="185" width="230" height="72" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
<text class="node-title" x="690" y="214" text-anchor="middle" dominant-baseline="middle">Generator</text>
<text class="node-detail" x="690" y="238" text-anchor="middle" dominant-baseline="middle">generate</text>
<line class="lifeline" x1="690" y1="257" x2="690" y2="745"/>
<rect class="card" x="827" y="185" width="230" height="72" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
<text class="node-title" x="942" y="214" text-anchor="middle" dominant-baseline="middle">Resources</text>
<text class="node-detail" x="942" y="238" text-anchor="middle" dominant-baseline="middle">fixtures</text>
<line class="lifeline" x1="942" y1="257" x2="942" y2="745"/>
<rect class="card" x="1080" y="185" width="230" height="72" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="node-title" x="1195" y="214" text-anchor="middle" dominant-baseline="middle">Outputs</text>
<text class="node-detail" x="1195" y="238" text-anchor="middle" dominant-baseline="middle">files</text>
<line class="lifeline" x1="1195" y1="257" x2="1195" y2="745"/>
</g>
<g id="messages">
<path class="edge" d="M 185 325 L 438 325"/>
<rect x="197.5" y="279" width="228.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="311.5" y="293" text-anchor="middle" dominant-baseline="middle">1. Run :basic-processing:run</text>
<circle cx="185" cy="325" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="438" cy="325" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<path class="edge" d="M 438 395 L 690 395"/>
<rect x="457.0" y="349" width="214.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="564.0" y="363" text-anchor="middle" dominant-baseline="middle">2. Create output directory</text>
<circle cx="438" cy="395" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="690" cy="395" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<path class="edge" d="M 690 465 L 942 465"/>
<rect x="681.0" y="419" width="270.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="816.0" y="433" text-anchor="middle" dominant-baseline="middle">3. Load cafe, landscape, workbench</text>
<circle cx="690" cy="465" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="942" cy="465" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<path class="edge" d="M 690 545 L 1195 545"/>
<rect x="755.0" y="499" width="375.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="942.5" y="513" text-anchor="middle" dominant-baseline="middle">4. Write thumbnail, crop, PNG, watermark, preview</text>
<circle cx="690" cy="545" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="1195" cy="545" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<path class="edge-dashed" d="M 1195 625 L 690 625"/>
<rect x="811.0" y="579" width="263.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="942.5" y="593" text-anchor="middle" dominant-baseline="middle">5. Return GeneratedImage metadata</text>
<circle cx="690" cy="625" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="1195" cy="625" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<path class="edge-dashed" d="M 690 695 L 185 695"/>
<rect x="302.5" y="649" width="270.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="437.5" y="663" text-anchor="middle" dominant-baseline="middle">6. Print file names and dimensions</text>
<circle cx="185" cy="695" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="690" cy="695" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
</g>
<text class="footer" x="690.0" y="790" text-anchor="middle">Tests decode every output and assert the expected image dimensions.</text>
</svg>
