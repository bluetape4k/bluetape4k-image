<text class="label" x="1133.5" y="634" text-anchor="middle" dominant-baseline="middle">Return recognized text</text>
<path data-connector="true" class="edge-dashed" d="M 930 747 L 180 747"/>
<rect class="activation" x="176" y="736" width="8" height="26" rx="3"/>
<rect class="pill" x="422.7" y="700" width="264.6" height="28" rx="9" fill="#FFFFFF" stroke="#2E8F89"/>
<circle cx="440.7" cy="714" r="12" fill="#2E8F89"/>
