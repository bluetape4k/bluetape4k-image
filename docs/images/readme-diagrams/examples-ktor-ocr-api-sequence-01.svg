<rect class="canvas" width="1860" height="1055"/>
<rect class="frame" x="32" y="28" width="1796" height="999" rx="30" fill="#fbfcf8" stroke="#41545d" stroke-width="3"/>
<text class="title" x="70" y="82">Ktor OCR API Sequence</text>
<text class="subtitle" x="74" y="116">Request validation, language options, OCR execution, and error mapping.</text>
<g id="participants">
