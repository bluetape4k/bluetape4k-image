<rect class="pill" x="944.2" y="440" width="346.6" height="28" rx="9" fill="#FFFFFF" stroke="#4F83BF"/>
<circle cx="962.2" cy="454" r="12" fill="#4F83BF"/>
<text class="label" x="962.2" y="455" text-anchor="middle" dominant-baseline="middle" style="fill:#FFFFFF;font-size:12px">3</text>
<text class="label" x="1133.5" y="454" text-anchor="middle" dominant-baseline="middle">Build OcrOptions and extract text</text>
<path data-connector="true" class="edge" d="M 1305 577 L 1680 577"/>
<rect class="activation" x="1676" y="566" width="8" height="26" rx="3"/>
<rect class="pill" x="1382.5" y="530" width="220.0" height="28" rx="9" fill="#FFFFFF" stroke="#4F83BF"/>
<circle cx="1400.5" cy="544" r="12" fill="#4F83BF"/>
