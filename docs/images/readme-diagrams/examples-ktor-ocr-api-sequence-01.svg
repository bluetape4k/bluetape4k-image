<text class="label" x="571.0" y="714" text-anchor="middle" dominant-baseline="middle">Return JSON text result</text>
</g>
<text class="footer" x="930.0" y="987" text-anchor="middle">https://github.com/bluetape4k/bluetape4k-image | project: bluetape4k-image | module: examples:ktor-ocr-api</text>
