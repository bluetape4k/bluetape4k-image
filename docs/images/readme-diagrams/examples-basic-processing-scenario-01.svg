<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="720" viewBox="0 0 1480 720" role="img" aria-label="Basic Processing Scenario">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="1480" height="720"/>
<rect class="frame" x="34" y="28" width="1412" height="662" rx="26"/>
<text class="title" x="70" y="82">Basic Processing Scenario</text>
<text class="subtitle" x="74" y="116">CLI quickstart turns bundled photo fixtures into deterministic output files.</text>
<g id="edges">
<path class="edge" d="M 330 340 L 390 340 L 390 472" stroke="#758297"/>
<rect x="312.0" y="364.0" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="370.0" y="376.0" text-anchor="middle" dominant-baseline="middle">run</text>
<path class="edge" d="M 520 264 L 520 420" stroke="#758297"/>
<rect x="462.0" y="322.0" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="520.0" y="334.0" text-anchor="middle" dominant-baseline="middle">load</text>
<path class="edge" d="M 650 472 L 690 472 L 690 162 L 730 162" stroke="#758297"/>
<rect x="632.0" y="297.0" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="690.0" y="309.0" text-anchor="middle" dominant-baseline="middle">fit</text>
<path class="edge" d="M 650 472 L 700 472 L 700 297 L 730 297" stroke="#758297"/>
<rect x="637.0" y="364.5" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="695.0" y="376.5" text-anchor="middle" dominant-baseline="middle">crop</text>
<path class="edge" d="M 650 472 L 730 432" stroke="#758297"/>
<rect x="632.0" y="432.0" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="690.0" y="444.0" text-anchor="middle" dominant-baseline="middle">png</text>
<path class="edge" d="M 650 472 L 970 472 L 970 297 L 1045 297" stroke="#758297"/>
<rect x="850.8" y="364.5" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="908.8" y="376.5" text-anchor="middle" dominant-baseline="middle">draw</text>
<path class="edge" d="M 650 472 L 1045 432" stroke="#758297"/>
<rect x="789.5" y="432.0" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="847.5" y="444.0" text-anchor="middle" dominant-baseline="middle">reuse</text>
</g>
<g id="nodes">
<g id="run">
  <rect class="card" x="70" y="288" width="260" height="104" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="200" y="330.0" text-anchor="middle" dominant-baseline="middle">Gradle run</text>
  <text class="node-detail" x="200" y="350.0" text-anchor="middle" dominant-baseline="middle">optional output dir</text>
</g>
<g id="fixtures">
  <rect class="card" x="390" y="160" width="260" height="104" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="520" y="192.0" text-anchor="middle" dominant-baseline="middle">Image fixtures</text>
  <text class="node-detail" x="520" y="212.0" text-anchor="middle" dominant-baseline="middle">cafe, landscape</text>
  <text class="node-detail" x="520" y="232.0" text-anchor="middle" dominant-baseline="middle">workbench preview</text>
</g>
<g id="generator">
  <rect class="card" x="390" y="420" width="260" height="104" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="520" y="462.0" text-anchor="middle" dominant-baseline="middle">Quickstart generator</text>
  <text class="node-detail" x="520" y="482.0" text-anchor="middle" dominant-baseline="middle">load, transform, write</text>
</g>
<g id="thumb">
  <rect class="card" x="730" y="110" width="260" height="104" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="860" y="152.0" text-anchor="middle" dominant-baseline="middle">Cafe thumbnail</text>
  <text class="node-detail" x="860" y="172.0" text-anchor="middle" dominant-baseline="middle">320 x 240 JPG</text>
</g>
<g id="crop">
  <rect class="card" x="730" y="245" width="260" height="104" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="860" y="287.0" text-anchor="middle" dominant-baseline="middle">Smart crop</text>
  <text class="node-detail" x="860" y="307.0" text-anchor="middle" dominant-baseline="middle">640 x 360 JPG</text>
</g>
<g id="convert">
  <rect class="card" x="730" y="380" width="260" height="104" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="860" y="422.0" text-anchor="middle" dominant-baseline="middle">PNG conversion</text>
  <text class="node-detail" x="860" y="442.0" text-anchor="middle" dominant-baseline="middle">800 x 600 PNG</text>
</g>
<g id="watermark">
  <rect class="card" x="1045" y="245" width="260" height="104" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="1175" y="287.0" text-anchor="middle" dominant-baseline="middle">Watermark</text>
  <text class="node-detail" x="1175" y="307.0" text-anchor="middle" dominant-baseline="middle">960 x 540 JPG</text>
</g>
<g id="preview">
  <rect class="card" x="1045" y="380" width="260" height="104" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="1175" y="422.0" text-anchor="middle" dominant-baseline="middle">Workbench preview</text>
  <text class="node-detail" x="1175" y="442.0" text-anchor="middle" dominant-baseline="middle">960 x 540 JPG</text>
</g>
</g>
<text class="footer" x="740.0" y="670" text-anchor="middle">All outputs are verified by the same generator that powers :basic-processing:run.</text>
</svg>
