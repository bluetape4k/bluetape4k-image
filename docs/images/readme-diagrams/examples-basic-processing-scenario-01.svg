<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="920" viewBox="0 0 1960 920" role="img" aria-label="Basic Processing Scenario">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="1960" height="920"/>
<rect class="frame" x="34" y="28" width="1892" height="862" rx="26"/>
<text class="title" x="70" y="82">Basic Processing Scenario</text>
<text class="subtitle" x="74" y="116">CLI quickstart turns bundled photo fixtures into deterministic output files.</text>
<g id="edges" transform="translate(0 70)">
<path class="edge" d="M 430 435 L 455 435 L 455 598 L 480 598" stroke="#758297"/>
<path class="edge" d="M 660 322 L 660 540" stroke="#758297"/>
<path class="edge" d="M 860 598 L 960 598 L 960 195 L 1050 195" stroke="#758297"/>
<path class="edge" d="M 860 598 L 960 598 L 960 355 L 1050 355" stroke="#758297"/>
<path class="edge" d="M 860 598 L 960 598 L 960 515 L 1050 515" stroke="#758297"/>
<path class="edge" d="M 1390 355 L 1490 355" stroke="#758297"/>
<path class="edge" d="M 1390 515 L 1490 515" stroke="#758297"/>
</g>
<g id="nodes" transform="translate(0 70)">
<g id="run">
  <rect class="card" x="90" y="380" width="340" height="110" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="260" y="425.0" text-anchor="middle" dominant-baseline="middle">Gradle run</text>
  <text class="node-detail" x="260" y="445.0" text-anchor="middle" dominant-baseline="middle">optional output dir</text>
</g>
<g id="fixtures">
  <rect class="card" x="480" y="210" width="360" height="112" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="660" y="246.0" text-anchor="middle" dominant-baseline="middle">Image fixtures</text>
  <text class="node-detail" x="660" y="266.0" text-anchor="middle" dominant-baseline="middle">cafe, landscape</text>
  <text class="node-detail" x="660" y="286.0" text-anchor="middle" dominant-baseline="middle">workbench preview</text>
</g>
<g id="generator">
  <rect class="card" x="480" y="540" width="380" height="116" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="670" y="588.0" text-anchor="middle" dominant-baseline="middle">Quickstart generator</text>
  <text class="node-detail" x="670" y="608.0" text-anchor="middle" dominant-baseline="middle">load, transform, write</text>
</g>
<g id="thumb">
  <rect class="card" x="1050" y="140" width="340" height="110" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="1220" y="185.0" text-anchor="middle" dominant-baseline="middle">Cafe thumbnail</text>
  <text class="node-detail" x="1220" y="205.0" text-anchor="middle" dominant-baseline="middle">320 x 240 JPG</text>
</g>
<g id="crop">
  <rect class="card" x="1050" y="300" width="340" height="110" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="1220" y="345.0" text-anchor="middle" dominant-baseline="middle">Smart crop</text>
  <text class="node-detail" x="1220" y="365.0" text-anchor="middle" dominant-baseline="middle">640 x 360 JPG</text>
</g>
<g id="convert">
  <rect class="card" x="1050" y="460" width="340" height="110" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="1220" y="505.0" text-anchor="middle" dominant-baseline="middle">PNG conversion</text>
  <text class="node-detail" x="1220" y="525.0" text-anchor="middle" dominant-baseline="middle">800 x 600 PNG</text>
</g>
<g id="watermark">
  <rect class="card" x="1490" y="300" width="340" height="110" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="1660" y="345.0" text-anchor="middle" dominant-baseline="middle">Watermark</text>
  <text class="node-detail" x="1660" y="365.0" text-anchor="middle" dominant-baseline="middle">960 x 540 JPG</text>
</g>
<g id="preview">
  <rect class="card" x="1490" y="460" width="370" height="110" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="1675" y="505.0" text-anchor="middle" dominant-baseline="middle">Workbench preview</text>
  <text class="node-detail" x="1675" y="525.0" text-anchor="middle" dominant-baseline="middle">960 x 540 JPG</text>
</g>
</g>
<g id="edge-labels" transform="translate(0 70)">
<rect x="440.0" y="390.0" width="64" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="472.0" y="402.0" text-anchor="middle" dominant-baseline="middle">run</text>
<rect x="678.0" y="400.0" width="64" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="710.0" y="412.0" text-anchor="middle" dominant-baseline="middle">load</text>
<rect x="888.0" y="554.0" width="64" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="920.0" y="566.0" text-anchor="middle" dominant-baseline="middle">fit</text>
<rect x="968.0" y="310.0" width="64" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1000.0" y="322.0" text-anchor="middle" dominant-baseline="middle">crop</text>
<rect x="968.0" y="470.0" width="64" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1000.0" y="482.0" text-anchor="middle" dominant-baseline="middle">png</text>
<rect x="1413.0" y="310.0" width="64" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1445.0" y="322.0" text-anchor="middle" dominant-baseline="middle">draw</text>
<rect x="1411.0" y="470.0" width="68" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1445.0" y="482.0" text-anchor="middle" dominant-baseline="middle">reuse</text>
</g>
<text class="footer" x="980.0" y="870" text-anchor="middle">All outputs are verified by the same generator that powers :basic-processing:run.</text>
</svg>
