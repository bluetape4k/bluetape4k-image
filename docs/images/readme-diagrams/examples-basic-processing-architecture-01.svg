<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="960" viewBox="0 0 2600 960" role="img" aria-label="Basic Processing Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="2600" height="960"/>
<rect class="frame" x="34" y="28" width="2532" height="902" rx="26"/>
<text class="title" x="70" y="82">Basic Processing Architecture</text>
<text class="subtitle" x="74" y="116">Pure JVM image transformations with suspend-aware writers.</text>
<g id="layers" transform="translate(0 0)">
<rect class="layer" x="72" y="190" width="2456" height="150" rx="18"/>
<text class="layer-title" x="104" y="224" dominant-baseline="middle">Entrypoint</text>
<rect class="layer" x="72" y="350" width="2456" height="150" rx="18"/>
<text class="layer-title" x="104" y="384" dominant-baseline="middle">Workflow</text>
<rect class="layer" x="72" y="510" width="2456" height="130" rx="18"/>
<text class="layer-title" x="104" y="544" dominant-baseline="middle">Image Library</text>
<rect class="layer" x="72" y="670" width="2456" height="130" rx="18"/>
<text class="layer-title" x="104" y="704" dominant-baseline="middle">Output</text>
</g>
<g id="edges" transform="translate(0 0)">
<path class="edge" d="M 630 275 L 680 275 L 680 415 L 730 415" stroke="#758297"/>
<path class="edge" d="M 1230 415 L 1260 415 L 1260 575 L 1290 575" stroke="#758297"/>
<path class="edge" d="M 1650 575 L 1700 575" stroke="#758297"/>
<path class="edge" d="M 1905 630 L 1905 680" stroke="#758297"/>
<path class="edge" d="M 2060 735 L 2110 735" stroke="#758297"/>
</g>
<g id="nodes" transform="translate(0 0)">
<g id="cli">
  <rect class="card" x="290" y="220" width="340" height="110" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="460" y="255.0" text-anchor="middle" dominant-baseline="middle">CLI entrypoint</text>
  <text class="node-detail" x="460" y="275.0" text-anchor="middle" dominant-baseline="middle">main(args)</text>
  <text class="node-detail" x="460" y="295.0" text-anchor="middle" dominant-baseline="middle">runBlocking</text>
</g>
<g id="quickstart">
  <rect class="card" x="730" y="360" width="500" height="110" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="980" y="405.0" text-anchor="middle" dominant-baseline="middle">BasicImageProcessingQuickstart</text>
  <text class="node-detail" x="980" y="425.0" text-anchor="middle" dominant-baseline="middle">generate(outputDirectory)</text>
</g>
<g id="loader">
  <rect class="card" x="1290" y="520" width="360" height="110" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="1470" y="565.0" text-anchor="middle" dominant-baseline="middle">suspendLoadImage</text>
  <text class="node-detail" x="1470" y="585.0" text-anchor="middle" dominant-baseline="middle">file-backed resources</text>
</g>
<g id="transforms">
  <rect class="card" x="1700" y="520" width="410" height="110" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="1905" y="555.0" text-anchor="middle" dominant-baseline="middle">ImmutableImage transforms</text>
  <text class="node-detail" x="1905" y="575.0" text-anchor="middle" dominant-baseline="middle">fit, smartCropTo</text>
  <text class="node-detail" x="1905" y="595.0" text-anchor="middle" dominant-baseline="middle">withGraphics watermark</text>
</g>
<g id="writers">
  <rect class="card" x="1700" y="680" width="360" height="110" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="1880" y="715.0" text-anchor="middle" dominant-baseline="middle">Suspend writers</text>
  <text class="node-detail" x="1880" y="735.0" text-anchor="middle" dominant-baseline="middle">JPEG progressive</text>
  <text class="node-detail" x="1880" y="755.0" text-anchor="middle" dominant-baseline="middle">PNG max compression</text>
</g>
<g id="outputs">
  <rect class="card" x="2110" y="680" width="360" height="110" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="2290" y="715.0" text-anchor="middle" dominant-baseline="middle">Output directory</text>
  <text class="node-detail" x="2290" y="735.0" text-anchor="middle" dominant-baseline="middle">build/tmp/basic-processing</text>
  <text class="node-detail" x="2290" y="755.0" text-anchor="middle" dominant-baseline="middle">five generated files</text>
</g>
</g>
<rect class="footer-pill" x="76" y="862" width="2448" height="34" rx="10"/>
<text class="footer" x="1300.0" y="884" text-anchor="middle">No server, storage service, Docker, S3, CDN, or native libvips is involved.</text>
</svg>
