<rect x="916.0" y="165.0" width="88" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="960.0" y="177.0" text-anchor="middle" dominant-baseline="middle">load</text>
<rect x="506.0" y="400.0" width="88" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="550.0" y="412.0" text-anchor="middle" dominant-baseline="middle">images</text>
<rect x="1256.0" y="345.0" width="88" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="1300.0" y="357.0" text-anchor="middle" dominant-baseline="middle">encode</text>
<rect x="1136.0" y="695.0" width="88" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="1180.0" y="707.0" text-anchor="middle" dominant-baseline="middle">write</text>
</g>
<text class="footer" x="750.0" y="800" text-anchor="middle">https://github.com/bluetape4k/bluetape4k-image | project: bluetape4k-image | module: examples:basic-processing</text>
