  <rect x="104" y="255" width="40" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text class="node-title" x="158" y="257.0" dominant-baseline="middle">CLI entrypoint</text>
  <text class="node-detail" x="158" y="275.0" dominant-baseline="middle">main(args)</text>
  <text class="node-detail" x="158" y="293.0" dominant-baseline="middle">runBlocking</text>
</g>
<g id="quickstart">
  <rect class="card" x="500" y="220" width="420" height="110" rx="8"/>
  <rect x="514" y="255" width="40" height="40" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text class="node-title" x="568" y="257.0" dominant-baseline="middle">BasicImageProcessingQuick</text>
  <text class="node-title" x="568" y="275.0" dominant-baseline="middle">start</text>
  <text class="node-detail" x="568" y="293.0" dominant-baseline="middle">generate(outputDirectory)</text>
</g>
<g id="loader">
  <rect class="card" x="1000" y="220" width="360" height="110" rx="8"/>
  <rect x="1014" y="255" width="40" height="40" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text class="node-title" x="1068" y="266.0" dominant-baseline="middle">suspendLoadImage</text>
  <text class="node-detail" x="1068" y="284.0" dominant-baseline="middle">file-backed resources</text>
</g>
<g id="transforms">
  <rect class="card" x="500" y="450" width="420" height="122" rx="8"/>
  <rect x="514" y="491" width="40" height="40" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text class="node-title" x="568" y="493.0" dominant-baseline="middle">ImmutableImage transforms</text>
  <text class="node-detail" x="568" y="511.0" dominant-baseline="middle">fit, smartCropTo</text>
  <text class="node-detail" x="568" y="529.0" dominant-baseline="middle">withGraphics watermark</text>
</g>
<g id="writers">
  <rect class="card" x="1000" y="400" width="360" height="110" rx="8"/>
  <rect x="1014" y="435" width="40" height="40" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.2"/>
  <text class="node-title" x="1068" y="437.0" dominant-baseline="middle">Suspend writers</text>
  <text class="node-detail" x="1068" y="455.0" dominant-baseline="middle">JPEG progressive</text>
  <text class="node-detail" x="1068" y="473.0" dominant-baseline="middle">PNG max compression</text>
</g>
<g id="outputs">
  <rect class="card" x="1000" y="570" width="360" height="110" rx="8"/>
  <rect x="1014" y="605" width="40" height="40" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2"/>
  <text class="node-title" x="1068" y="607.0" dominant-baseline="middle">Output directory</text>
  <text class="node-detail" x="1068" y="625.0" dominant-baseline="middle">build/tmp/basic-processing</text>
  <text class="node-detail" x="1068" y="643.0" dominant-baseline="middle">five generated files</text>
</g>
</g>
<g id="edge-labels" transform="translate(0 70)">
<rect x="411.0" y="165.0" width="88" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
