<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="640" viewBox="0 0 2480 640" role="img" aria-label="Basic Processing Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="2480" height="640"/>
<rect class="frame" x="34" y="28" width="2412" height="582" rx="26"/>
<text class="title" x="70" y="82">Basic Processing Architecture</text>
<text class="subtitle" x="74" y="116">Pure JVM image transformations with suspend-aware writers.</text>
<g id="edges" transform="translate(0 70)">
<path class="edge" d="M 430 240 L 520 240" stroke="#758297"/>
<path class="edge" d="M 1020 240 L 1110 240" stroke="#758297"/>
<path class="edge" d="M 1470 240 L 1540 240" stroke="#758297"/>
<path class="edge" d="M 1950 240 L 1980 240 L 1980 160 L 2030 160" stroke="#758297"/>
<path class="edge" d="M 1950 240 L 1980 240 L 1980 320 L 2030 320" stroke="#758297"/>
</g>
<g id="nodes" transform="translate(0 70)">
<g id="cli">
  <rect class="card" x="90" y="185" width="340" height="110" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="260" y="220.0" text-anchor="middle" dominant-baseline="middle">CLI entrypoint</text>
  <text class="node-detail" x="260" y="240.0" text-anchor="middle" dominant-baseline="middle">main(args)</text>
  <text class="node-detail" x="260" y="260.0" text-anchor="middle" dominant-baseline="middle">runBlocking</text>
</g>
<g id="quickstart">
  <rect class="card" x="520" y="185" width="500" height="110" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="770" y="230.0" text-anchor="middle" dominant-baseline="middle">BasicImageProcessingQuickstart</text>
  <text class="node-detail" x="770" y="250.0" text-anchor="middle" dominant-baseline="middle">generate(outputDirectory)</text>
</g>
<g id="loader">
  <rect class="card" x="1110" y="185" width="360" height="110" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="1290" y="230.0" text-anchor="middle" dominant-baseline="middle">suspendLoadImage</text>
  <text class="node-detail" x="1290" y="250.0" text-anchor="middle" dominant-baseline="middle">file-backed resources</text>
</g>
<g id="transforms">
  <rect class="card" x="1540" y="185" width="410" height="110" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="1745" y="220.0" text-anchor="middle" dominant-baseline="middle">ImmutableImage transforms</text>
  <text class="node-detail" x="1745" y="240.0" text-anchor="middle" dominant-baseline="middle">fit, smartCropTo</text>
  <text class="node-detail" x="1745" y="260.0" text-anchor="middle" dominant-baseline="middle">withGraphics watermark</text>
</g>
<g id="writers">
  <rect class="card" x="2030" y="105" width="360" height="110" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="2210" y="140.0" text-anchor="middle" dominant-baseline="middle">Suspend writers</text>
  <text class="node-detail" x="2210" y="160.0" text-anchor="middle" dominant-baseline="middle">JPEG progressive</text>
  <text class="node-detail" x="2210" y="180.0" text-anchor="middle" dominant-baseline="middle">PNG max compression</text>
</g>
<g id="outputs">
  <rect class="card" x="2030" y="265" width="360" height="110" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="2210" y="300.0" text-anchor="middle" dominant-baseline="middle">Output directory</text>
  <text class="node-detail" x="2210" y="320.0" text-anchor="middle" dominant-baseline="middle">build/tmp/basic-processing</text>
  <text class="node-detail" x="2210" y="340.0" text-anchor="middle" dominant-baseline="middle">five generated files</text>
</g>
</g>
<g id="edge-labels" transform="translate(0 70)">
<rect x="437.0" y="145.0" width="76" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="475.0" y="157.0" text-anchor="middle" dominant-baseline="middle">invoke</text>
<rect x="1033.0" y="145.0" width="64" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1065.0" y="157.0" text-anchor="middle" dominant-baseline="middle">load</text>
<rect x="1467.0" y="145.0" width="76" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1505.0" y="157.0" text-anchor="middle" dominant-baseline="middle">images</text>
<rect x="1957.0" y="65.0" width="76" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1995.0" y="77.0" text-anchor="middle" dominant-baseline="middle">encode</text>
<rect x="1961.0" y="395.0" width="68" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1995.0" y="407.0" text-anchor="middle" dominant-baseline="middle">write</text>
</g>
<text class="footer" x="1240.0" y="590" text-anchor="middle">No server, storage service, Docker, S3, CDN, or native libvips is involved.</text>
</svg>
