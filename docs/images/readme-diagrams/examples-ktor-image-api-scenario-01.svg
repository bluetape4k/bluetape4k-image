<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="920" viewBox="0 0 2000 920" role="img" aria-label="Ktor Image API Scenario">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="2000" height="920"/>
<rect class="frame" x="34" y="28" width="1932" height="862" rx="26"/>
<text class="title" x="70" y="82">Ktor Image API Scenario</text>
<text class="subtitle" x="74" y="116">Local Ktor service exposes CAPTCHA and thumbnail routes without infrastructure.</text>
<g id="edges" transform="translate(0 70)">
<path class="edge" d="M 450 435 L 520 435" stroke="#758297"/>
<path class="edge" d="M 880 435 L 970 435 L 970 225 L 1050 225" stroke="#758297"/>
<path class="edge" d="M 880 435 L 1050 435" stroke="#758297"/>
<path class="edge" d="M 880 435 L 970 435 L 970 645 L 1050 645" stroke="#758297"/>
<path class="edge" d="M 1410 435 L 1540 435" stroke="#758297"/>
<path class="edge" d="M 1410 645 L 1475 645 L 1475 435 L 1540 435" stroke="#758297"/>
</g>
<g id="nodes" transform="translate(0 70)">
<g id="client">
  <rect class="card" x="90" y="380" width="360" height="110" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="270" y="425.0" text-anchor="middle" dominant-baseline="middle">Local client</text>
  <text class="node-detail" x="270" y="445.0" text-anchor="middle" dominant-baseline="middle">curl or Ktor test host</text>
</g>
<g id="server">
  <rect class="card" x="520" y="380" width="360" height="110" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="700" y="425.0" text-anchor="middle" dominant-baseline="middle">Ktor Netty server</text>
  <text class="node-detail" x="700" y="445.0" text-anchor="middle" dominant-baseline="middle">PORT or 8080</text>
</g>
<g id="ready">
  <rect class="card" x="1050" y="170" width="360" height="110" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="1230" y="215.0" text-anchor="middle" dominant-baseline="middle">Ready endpoint</text>
  <text class="node-detail" x="1230" y="235.0" text-anchor="middle" dominant-baseline="middle">/ready -&gt; OK</text>
</g>
<g id="captcha">
  <rect class="card" x="1050" y="380" width="360" height="110" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="1230" y="415.0" text-anchor="middle" dominant-baseline="middle">CAPTCHA routes</text>
  <text class="node-detail" x="1230" y="435.0" text-anchor="middle" dominant-baseline="middle">/api/captcha</text>
  <text class="node-detail" x="1230" y="455.0" text-anchor="middle" dominant-baseline="middle">issue and verify</text>
</g>
<g id="thumb">
  <rect class="card" x="1050" y="590" width="360" height="110" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="1230" y="625.0" text-anchor="middle" dominant-baseline="middle">Thumbnail route</text>
  <text class="node-detail" x="1230" y="645.0" text-anchor="middle" dominant-baseline="middle">/api/images/thumbnail</text>
  <text class="node-detail" x="1230" y="665.0" text-anchor="middle" dominant-baseline="middle">multipart file</text>
</g>
<g id="response">
  <rect class="card" x="1540" y="380" width="360" height="110" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="1720" y="415.0" text-anchor="middle" dominant-baseline="middle">Local responses</text>
  <text class="node-detail" x="1720" y="435.0" text-anchor="middle" dominant-baseline="middle">JSON challenge</text>
  <text class="node-detail" x="1720" y="455.0" text-anchor="middle" dominant-baseline="middle">PNG thumbnail bytes</text>
</g>
</g>
<g id="edge-labels" transform="translate(0 70)">
<rect x="453.0" y="340.0" width="64" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="485.0" y="352.0" text-anchor="middle" dominant-baseline="middle">HTTP</text>
<rect x="890.0" y="390.0" width="76" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="928.0" y="402.0" text-anchor="middle" dominant-baseline="middle">health</text>
<rect x="891.0" y="445.0" width="68" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="925.0" y="457.0" text-anchor="middle" dominant-baseline="middle">mount</text>
<rect x="891.0" y="500.0" width="68" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="925.0" y="512.0" text-anchor="middle" dominant-baseline="middle">mount</text>
<rect x="1429.0" y="390.0" width="92" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1475.0" y="402.0" text-anchor="middle" dominant-baseline="middle">json/png</text>
<rect x="1433.0" y="715.0" width="64" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1465.0" y="727.0" text-anchor="middle" dominant-baseline="middle">png</text>
</g>
<text class="footer" x="1000.0" y="870" text-anchor="middle">The quickstart intentionally skips S3, CDN, Docker, persistence, and native libvips.</text>
</svg>
