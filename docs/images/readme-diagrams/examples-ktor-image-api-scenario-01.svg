<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="700" viewBox="0 0 1430 700" role="img" aria-label="Ktor Image API Scenario">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="1430" height="700"/>
<rect class="frame" x="34" y="28" width="1362" height="642" rx="26"/>
<text class="title" x="70" y="82">Ktor Image API Scenario</text>
<text class="subtitle" x="74" y="116">Local Ktor service exposes CAPTCHA and thumbnail routes without infrastructure.</text>
<g id="edges">
<path class="edge" d="M 335 350 L 380 350" stroke="#758297"/>
<rect x="299.5" y="330.0" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="357.5" y="342.0" text-anchor="middle" dominant-baseline="middle">HTTP</text>
<path class="edge" d="M 640 350 L 670 350 L 670 167 L 710 167" stroke="#758297"/>
<rect x="614.5" y="238.5" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="672.5" y="250.5" text-anchor="middle" dominant-baseline="middle">health</text>
<path class="edge" d="M 640 350 L 710 350" stroke="#758297"/>
<rect x="617.0" y="330.0" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="675.0" y="342.0" text-anchor="middle" dominant-baseline="middle">mount</text>
<path class="edge" d="M 640 350 L 670 350 L 670 532 L 710 532" stroke="#758297"/>
<rect x="614.5" y="421.0" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="672.5" y="433.0" text-anchor="middle" dominant-baseline="middle">mount</text>
<path class="edge" d="M 970 350 L 1040 350" stroke="#758297"/>
<rect x="947.0" y="330.0" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1005.0" y="342.0" text-anchor="middle" dominant-baseline="middle">json/png</text>
<path class="edge" d="M 970 532 L 1005 532 L 1005 350 L 1040 350" stroke="#758297"/>
<rect x="947.0" y="421.0" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1005.0" y="433.0" text-anchor="middle" dominant-baseline="middle">png</text>
</g>
<g id="nodes">
<g id="client">
  <rect class="card" x="75" y="298" width="260" height="104" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="205" y="340.0" text-anchor="middle" dominant-baseline="middle">Local client</text>
  <text class="node-detail" x="205" y="360.0" text-anchor="middle" dominant-baseline="middle">curl or Ktor test host</text>
</g>
<g id="server">
  <rect class="card" x="380" y="298" width="260" height="104" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="510" y="340.0" text-anchor="middle" dominant-baseline="middle">Ktor Netty server</text>
  <text class="node-detail" x="510" y="360.0" text-anchor="middle" dominant-baseline="middle">PORT or 8080</text>
</g>
<g id="ready">
  <rect class="card" x="710" y="115" width="260" height="104" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="840" y="157.0" text-anchor="middle" dominant-baseline="middle">Ready endpoint</text>
  <text class="node-detail" x="840" y="177.0" text-anchor="middle" dominant-baseline="middle">/ready -&gt; OK</text>
</g>
<g id="captcha">
  <rect class="card" x="710" y="298" width="260" height="104" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="840" y="330.0" text-anchor="middle" dominant-baseline="middle">CAPTCHA routes</text>
  <text class="node-detail" x="840" y="350.0" text-anchor="middle" dominant-baseline="middle">/api/captcha</text>
  <text class="node-detail" x="840" y="370.0" text-anchor="middle" dominant-baseline="middle">issue and verify</text>
</g>
<g id="thumb">
  <rect class="card" x="710" y="480" width="260" height="104" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="840" y="512.0" text-anchor="middle" dominant-baseline="middle">Thumbnail route</text>
  <text class="node-detail" x="840" y="532.0" text-anchor="middle" dominant-baseline="middle">/api/images/thumbnail</text>
  <text class="node-detail" x="840" y="552.0" text-anchor="middle" dominant-baseline="middle">multipart file</text>
</g>
<g id="response">
  <rect class="card" x="1040" y="298" width="260" height="104" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="1170" y="330.0" text-anchor="middle" dominant-baseline="middle">Local responses</text>
  <text class="node-detail" x="1170" y="350.0" text-anchor="middle" dominant-baseline="middle">JSON challenge</text>
  <text class="node-detail" x="1170" y="370.0" text-anchor="middle" dominant-baseline="middle">PNG thumbnail bytes</text>
</g>
</g>
<text class="footer" x="715.0" y="650" text-anchor="middle">The quickstart intentionally skips S3, CDN, Docker, persistence, and native libvips.</text>
</svg>
