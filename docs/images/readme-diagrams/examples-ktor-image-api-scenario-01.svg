<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="920" viewBox="0 0 2000 920" role="img" aria-label="Ktor Image API Scenario">
<defs>
  <marker markerUnits="userSpaceOnUse" id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker markerUnits="userSpaceOnUse" id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280" stroke="#6b7280" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    .canvas{fill:#ffffff}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#111827;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#6b7280;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#111827;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#6b7280;font-weight:400}
    .panel-title{font-family:"Comic Mono";font-size:16px;fill:#4b5563;font-weight:700;letter-spacing:0.8px}
    .layer{fill:#f3f6fa;stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:8 6}
    .layer-title{font-family:"Comic Mono";font-size:16px;fill:#4b5563;font-weight:700;letter-spacing:0.8px}
    .label{font-family:"Comic Mono";font-size:12px;fill:#374151;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#6b7280;font-weight:400}
    .footer-pill{fill:#ffffff;stroke:#d1d5db;stroke-width:1}
    .card{fill:#ffffff;stroke:#94a3b8;stroke-width:1.9}
    .edge{stroke:#2563eb;stroke-width:2.1;fill:none;marker-end:url(#arrow-blue);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#6b7280;stroke-width:1.8;fill:none;marker-end:url(#arrow-gray);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 4}
    .lifeline{stroke:#d1d5db;stroke-width:1.5;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="2000" height="920"/>
<text class="title" x="70" y="82">Ktor Image API Scenario</text>
<text class="subtitle" x="74" y="116">Local Ktor service exposes CAPTCHA and thumbnail routes without infrastructure.</text>
<g id="edges" transform="translate(0 70)">
<path data-connector="true" class="edge" d="M 450 435 L 520 435" stroke="#2563eb"/>
<path data-connector="true" class="edge" d="M 880 435 L 952 435 Q 970 435 970 417 L 970 243 Q 970 225 988 225 L 1050 225" stroke="#2563eb"/>
<path data-connector="true" class="edge" d="M 880 435 L 1050 435" stroke="#2563eb"/>
<path data-connector="true" class="edge" d="M 880 435 L 952 435 Q 970 435 970 453 L 970 627 Q 970 645 988 645 L 1050 645" stroke="#2563eb"/>
<path data-connector="true" class="edge" d="M 1410 435 L 1540 435" stroke="#2563eb"/>
<path data-connector="true" class="edge" d="M 1410 645 L 1457 645 Q 1475 645 1475 627 L 1475 453 Q 1475 435 1493 435 L 1540 435" stroke="#2563eb"/>
</g>
<g id="nodes" transform="translate(0 70)">
<g id="client">
  <rect class="card" x="90" y="380" width="360" height="110" rx="8"/>
  <rect x="104" y="415" width="40" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text class="node-title" x="158" y="426.0" dominant-baseline="middle">Local client</text>
  <text class="node-detail" x="158" y="444.0" dominant-baseline="middle">curl or Ktor test host</text>
</g>
<g id="server">
  <rect class="card" x="520" y="380" width="360" height="110" rx="8"/>
  <rect x="534" y="415" width="40" height="40" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text class="node-title" x="588" y="426.0" dominant-baseline="middle">Ktor Netty server</text>
  <text class="node-detail" x="588" y="444.0" dominant-baseline="middle">PORT or 8080</text>
</g>
<g id="ready">
  <rect class="card" x="1050" y="170" width="360" height="110" rx="8"/>
  <rect x="1064" y="205" width="40" height="40" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text class="node-title" x="1118" y="216.0" dominant-baseline="middle">Ready endpoint</text>
  <text class="node-detail" x="1118" y="234.0" dominant-baseline="middle">/ready -&gt; OK</text>
</g>
<g id="captcha">
  <rect class="card" x="1050" y="380" width="360" height="110" rx="8"/>
  <rect x="1064" y="415" width="40" height="40" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text class="node-title" x="1118" y="417.0" dominant-baseline="middle">CAPTCHA routes</text>
  <text class="node-detail" x="1118" y="435.0" dominant-baseline="middle">/api/captcha</text>
  <text class="node-detail" x="1118" y="453.0" dominant-baseline="middle">issue and verify</text>
</g>
<g id="thumb">
  <rect class="card" x="1050" y="590" width="360" height="110" rx="8"/>
  <rect x="1064" y="625" width="40" height="40" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.2"/>
  <text class="node-title" x="1118" y="627.0" dominant-baseline="middle">Thumbnail route</text>
  <text class="node-detail" x="1118" y="645.0" dominant-baseline="middle">/api/images/thumbnail</text>
  <text class="node-detail" x="1118" y="663.0" dominant-baseline="middle">multipart file</text>
</g>
<g id="response">
  <rect class="card" x="1540" y="380" width="360" height="110" rx="8"/>
  <rect x="1554" y="415" width="40" height="40" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2"/>
  <text class="node-title" x="1608" y="417.0" dominant-baseline="middle">Local responses</text>
  <text class="node-detail" x="1608" y="435.0" dominant-baseline="middle">JSON challenge</text>
  <text class="node-detail" x="1608" y="453.0" dominant-baseline="middle">PNG thumbnail bytes</text>
</g>
</g>
<g id="edge-labels" transform="translate(0 70)">
<rect x="441.0" y="340.0" width="88" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="485.0" y="352.0" text-anchor="middle" dominant-baseline="middle">HTTP</text>
<rect x="884.0" y="390.0" width="88" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="928.0" y="402.0" text-anchor="middle" dominant-baseline="middle">health</text>
<rect x="881.0" y="445.0" width="88" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="925.0" y="457.0" text-anchor="middle" dominant-baseline="middle">mount</text>
<rect x="881.0" y="500.0" width="88" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="925.0" y="512.0" text-anchor="middle" dominant-baseline="middle">mount</text>
<rect x="1425.0" y="390.0" width="100" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="1475.0" y="402.0" text-anchor="middle" dominant-baseline="middle">json/png</text>
<rect x="1421.0" y="715.0" width="88" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="1465.0" y="727.0" text-anchor="middle" dominant-baseline="middle">png</text>
</g>
<text class="footer" x="1000.0" y="870" text-anchor="middle">https://github.com/bluetape4k/bluetape4k-image | project: bluetape4k-image | module: examples:ktor-image-api</text>
</svg>
