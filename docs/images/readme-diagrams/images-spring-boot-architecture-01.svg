<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-label="Images Spring Boot Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="1500" height="930"/>
<rect class="frame" x="34" y="28" width="1432" height="872" rx="26"/>
<text class="title" x="70" y="82">Images Spring Boot Architecture</text>
<text class="subtitle" x="74" y="116">Layered Spring Boot 4 auto-configuration for processing, storage, CDN, health, and metrics.</text>
<g id="layers">
<rect class="layer" x="72" y="152" width="1356" height="122" rx="18"/>
<text class="layer-title" x="104" y="186" dominant-baseline="middle">Application</text>
<rect class="layer" x="72" y="308" width="1356" height="142" rx="18"/>
<text class="layer-title" x="104" y="342" dominant-baseline="middle">Auto-Configuration</text>
<rect class="layer" x="72" y="484" width="1356" height="146" rx="18"/>
<text class="layer-title" x="104" y="518" dominant-baseline="middle">Runtime Services</text>
<rect class="layer" x="72" y="664" width="1356" height="142" rx="18"/>
<text class="layer-title" x="104" y="698" dominant-baseline="middle">Operations</text>
</g>
<g id="edges">
<path class="edge" d="M 460 246 L 460 302 L 335 302 L 335 346" stroke="#56708C"/>
<path class="edge-dashed" d="M 830 246 L 830 302 L 570 302 L 570 346" stroke="#8A72D6"/>
<path class="edge" d="M 440 385 L 465 385" stroke="#56708C"/>
<path class="edge" d="M 675 385 L 700 385" stroke="#DB7890"/>
<path class="edge" d="M 570 424 L 570 474 L 415 474 L 415 522" stroke="#45A7A1"/>
<path class="edge" d="M 570 424 L 570 474 L 715 474 L 715 522" stroke="#D9AA4D"/>
<path class="edge" d="M 805 424 L 805 474 L 1015 474 L 1015 522" stroke="#DB7890"/>
<path class="edge" d="M 570 424 L 570 474 L 1285 474 L 1285 522" stroke="#58A978"/>
<path class="edge" d="M 1040 424 L 1040 650 L 400 650 L 400 698" stroke="#45A7A1"/>
<path class="edge" d="M 1275 424 L 1275 650 L 750 650 L 750 698" stroke="#8A72D6"/>
<path class="edge" d="M 805 424 L 805 650 L 1100 650 L 1100 698" stroke="#B88A44"/>
<path class="edge" d="M 415 600 L 415 650 L 750 650 L 750 698" stroke="#45A7A1"/>
<path class="edge" d="M 715 600 L 715 650 L 750 650 L 750 698" stroke="#D9AA4D"/>
</g>
<g id="nodes">
<g id="app">
  <rect class="card" x="330" y="174" width="260" height="72" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="460" y="200.0" text-anchor="middle" dominant-baseline="middle">Spring Boot app</text>
  <text class="node-detail" x="460" y="220.0" text-anchor="middle" dominant-baseline="middle">imports starter</text>
</g>
<g id="props">
  <rect class="card" x="690" y="174" width="280" height="72" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="830" y="200.0" text-anchor="middle" dominant-baseline="middle">Images properties</text>
  <text class="node-detail" x="830" y="220.0" text-anchor="middle" dominant-baseline="middle">bluetape4k.images.*</text>
</g>
<g id="autoProcessing">
  <rect class="card" x="230" y="346" width="210" height="78" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="335" y="365.0" text-anchor="middle" dominant-baseline="middle">Processing Config</text>
  <text class="node-detail" x="335" y="385.0" text-anchor="middle" dominant-baseline="middle">AutoConfiguration</text>
  <text class="node-detail" x="335" y="405.0" text-anchor="middle" dominant-baseline="middle">format and quality</text>
</g>
<g id="autoStorage">
  <rect class="card" x="465" y="346" width="210" height="78" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="570" y="365.0" text-anchor="middle" dominant-baseline="middle">Storage Config</text>
  <text class="node-detail" x="570" y="385.0" text-anchor="middle" dominant-baseline="middle">AutoConfiguration</text>
  <text class="node-detail" x="570" y="405.0" text-anchor="middle" dominant-baseline="middle">local or S3 backend</text>
</g>
<g id="autoCdn">
  <rect class="card" x="700" y="346" width="210" height="78" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="805" y="365.0" text-anchor="middle" dominant-baseline="middle">CDN Config</text>
  <text class="node-detail" x="805" y="385.0" text-anchor="middle" dominant-baseline="middle">AutoConfiguration</text>
  <text class="node-detail" x="805" y="405.0" text-anchor="middle" dominant-baseline="middle">S3 or CloudFront</text>
</g>
<g id="autoHealth">
  <rect class="card" x="935" y="346" width="210" height="78" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="1040" y="365.0" text-anchor="middle" dominant-baseline="middle">Health Config</text>
  <text class="node-detail" x="1040" y="385.0" text-anchor="middle" dominant-baseline="middle">AutoConfiguration</text>
  <text class="node-detail" x="1040" y="405.0" text-anchor="middle" dominant-baseline="middle">reactive probe</text>
</g>
<g id="autoMetrics">
  <rect class="card" x="1170" y="346" width="210" height="78" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="1275" y="365.0" text-anchor="middle" dominant-baseline="middle">Metrics Config</text>
  <text class="node-detail" x="1275" y="385.0" text-anchor="middle" dominant-baseline="middle">AutoConfiguration</text>
  <text class="node-detail" x="1275" y="405.0" text-anchor="middle" dominant-baseline="middle">Micrometer wrapper</text>
</g>
<g id="local">
  <rect class="card" x="300" y="522" width="230" height="78" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="415" y="541.0" text-anchor="middle" dominant-baseline="middle">Local storage</text>
  <text class="node-detail" x="415" y="561.0" text-anchor="middle" dominant-baseline="middle">filesystem root</text>
  <text class="node-detail" x="415" y="581.0" text-anchor="middle" dominant-baseline="middle">path traversal guard</text>
</g>
<g id="s3">
  <rect class="card" x="600" y="522" width="230" height="78" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="715" y="541.0" text-anchor="middle" dominant-baseline="middle">S3 storage</text>
  <text class="node-detail" x="715" y="561.0" text-anchor="middle" dominant-baseline="middle">S3Operations</text>
  <text class="node-detail" x="715" y="581.0" text-anchor="middle" dominant-baseline="middle">bucket + key prefix</text>
</g>
<g id="signers">
  <rect class="card" x="900" y="522" width="230" height="78" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="1015" y="541.0" text-anchor="middle" dominant-baseline="middle">Read URL signers</text>
  <text class="node-detail" x="1015" y="561.0" text-anchor="middle" dominant-baseline="middle">pre-signed S3</text>
  <text class="node-detail" x="1015" y="581.0" text-anchor="middle" dominant-baseline="middle">CloudFront URLs</text>
</g>
<g id="storageSpi">
  <rect class="card" x="1170" y="522" width="230" height="78" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="1285" y="551.0" text-anchor="middle" dominant-baseline="middle">ImageStorage SPI</text>
  <text class="node-detail" x="1285" y="571.0" text-anchor="middle" dominant-baseline="middle">upload, download, exists</text>
</g>
<g id="health">
  <rect class="card" x="250" y="698" width="300" height="78" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="400" y="727.0" text-anchor="middle" dominant-baseline="middle">Storage health</text>
  <text class="node-detail" x="400" y="747.0" text-anchor="middle" dominant-baseline="middle">exists(healthProbeKey)</text>
</g>
<g id="metrics">
  <rect class="card" x="600" y="698" width="300" height="78" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="750" y="727.0" text-anchor="middle" dominant-baseline="middle">Metrics wrapper</text>
  <text class="node-detail" x="750" y="747.0" text-anchor="middle" dominant-baseline="middle">timers and counters</text>
</g>
<g id="actuator">
  <rect class="card" x="950" y="698" width="300" height="78" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="node-title" x="1100" y="727.0" text-anchor="middle" dominant-baseline="middle">Actuator sanitizer</text>
  <text class="node-detail" x="1100" y="747.0" text-anchor="middle" dominant-baseline="middle">privateKeyPem redaction</text>
</g>
</g>
<rect class="footer-pill" x="76" y="832" width="1348" height="34" rx="10"/>
<text class="footer" x="750.0" y="854" text-anchor="middle">Graphviz evidence: images-spring-boot-architecture-01.dot, .plain, and -graphviz.svg. Final SVG follows source-derived Spring Boot module layers.</text>
</svg>
