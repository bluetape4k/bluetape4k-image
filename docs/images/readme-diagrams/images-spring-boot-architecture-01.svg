<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-label="Images Spring Boot Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="1800" height="1100"/>
<rect class="frame" x="34" y="28" width="1732" height="1042" rx="26"/>
<text class="title" x="70" y="82">Images Spring Boot Architecture</text>
<text class="subtitle" x="74" y="116">Layered Spring Boot 4 auto-configuration for processing, storage, CDN, health, and metrics.</text>
<g id="layers">
<rect class="layer" x="72" y="176" width="1656" height="132" rx="18"/>
<text class="layer-title" x="104" y="210" dominant-baseline="middle">Application</text>
<rect class="layer" x="72" y="356" width="1656" height="196" rx="18"/>
<text class="layer-title" x="104" y="390" dominant-baseline="middle">Auto-Configuration</text>
<rect class="layer" x="72" y="588" width="1656" height="160" rx="18"/>
<text class="layer-title" x="104" y="622" dominant-baseline="middle">Runtime Services</text>
<rect class="layer" x="72" y="806" width="1656" height="148" rx="18"/>
<text class="layer-title" x="104" y="840" dominant-baseline="middle">Operations</text>
</g>
<g id="edges">
<path class="edge" d="M 510 283 L 510 340 L 380 340 L 380 405" stroke="#56708C"/>
<path class="edge-dashed" d="M 960 283 L 960 340 L 740 340 L 740 382" stroke="#8A72D6"/>
<path class="edge" d="M 520 448 L 590 425" stroke="#56708C"/>
<path class="edge" d="M 890 425 L 970 463" stroke="#DB7890"/>
<path class="edge" d="M 740 468 L 740 555 L 510 555 L 510 625" stroke="#45A7A1"/>
<path class="edge" d="M 740 468 L 740 560 L 910 560 L 910 605" stroke="#D9AA4D"/>
<path class="edge" d="M 1112 506 L 1112 580 L 1275 580 L 1275 640" stroke="#DB7890"/>
<path class="edge" d="M 890 425 L 1360 425 L 1360 678 L 1415 678" stroke="#58A978"/>
<path class="edge" d="M 1428 456 L 1428 760 L 510 760 L 510 842" stroke="#45A7A1"/>
<path class="edge" d="M 1562 572 L 1562 790 L 960 790 L 960 850" stroke="#8A72D6"/>
<path class="edge" d="M 1112 506 L 1112 790 L 1415 790 L 1415 838" stroke="#B88A44"/>
<path class="edge" d="M 510 711 L 510 800 L 960 800 L 960 850" stroke="#45A7A1"/>
<path class="edge" d="M 910 691 L 910 800 L 960 800 L 960 850" stroke="#D9AA4D"/>
</g>
<g id="nodes">
<g id="app">
  <rect class="card" x="360" y="205" width="300" height="78" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="510" y="234.0" text-anchor="middle" dominant-baseline="middle">Spring Boot app</text>
  <text class="node-detail" x="510" y="254.0" text-anchor="middle" dominant-baseline="middle">imports starter</text>
</g>
<g id="props">
  <rect class="card" x="795" y="205" width="330" height="78" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="960" y="234.0" text-anchor="middle" dominant-baseline="middle">Images properties</text>
  <text class="node-detail" x="960" y="254.0" text-anchor="middle" dominant-baseline="middle">bluetape4k.images.*</text>
</g>
<g id="autoProcessing">
  <rect class="card" x="240" y="405" width="280" height="86" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="380" y="428.0" text-anchor="middle" dominant-baseline="middle">Processing Config</text>
  <text class="node-detail" x="380" y="448.0" text-anchor="middle" dominant-baseline="middle">AutoConfiguration</text>
  <text class="node-detail" x="380" y="468.0" text-anchor="middle" dominant-baseline="middle">format and quality</text>
</g>
<g id="autoStorage">
  <rect class="card" x="590" y="382" width="300" height="86" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="740" y="405.0" text-anchor="middle" dominant-baseline="middle">Storage Config</text>
  <text class="node-detail" x="740" y="425.0" text-anchor="middle" dominant-baseline="middle">AutoConfiguration</text>
  <text class="node-detail" x="740" y="445.0" text-anchor="middle" dominant-baseline="middle">local or S3 backend</text>
</g>
<g id="autoCdn">
  <rect class="card" x="970" y="420" width="285" height="86" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="1112" y="443.0" text-anchor="middle" dominant-baseline="middle">CDN Config</text>
  <text class="node-detail" x="1112" y="463.0" text-anchor="middle" dominant-baseline="middle">AutoConfiguration</text>
  <text class="node-detail" x="1112" y="483.0" text-anchor="middle" dominant-baseline="middle">S3 or CloudFront</text>
</g>
<g id="autoHealth">
  <rect class="card" x="1285" y="370" width="285" height="86" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="1427" y="393.0" text-anchor="middle" dominant-baseline="middle">Health Config</text>
  <text class="node-detail" x="1427" y="413.0" text-anchor="middle" dominant-baseline="middle">AutoConfiguration</text>
  <text class="node-detail" x="1427" y="433.0" text-anchor="middle" dominant-baseline="middle">reactive probe</text>
</g>
<g id="autoMetrics">
  <rect class="card" x="1420" y="486" width="285" height="86" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="1562" y="509.0" text-anchor="middle" dominant-baseline="middle">Metrics Config</text>
  <text class="node-detail" x="1562" y="529.0" text-anchor="middle" dominant-baseline="middle">AutoConfiguration</text>
  <text class="node-detail" x="1562" y="549.0" text-anchor="middle" dominant-baseline="middle">Micrometer wrapper</text>
</g>
<g id="local">
  <rect class="card" x="360" y="625" width="300" height="86" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="510" y="648.0" text-anchor="middle" dominant-baseline="middle">Local storage</text>
  <text class="node-detail" x="510" y="668.0" text-anchor="middle" dominant-baseline="middle">filesystem root</text>
  <text class="node-detail" x="510" y="688.0" text-anchor="middle" dominant-baseline="middle">path traversal guard</text>
</g>
<g id="s3">
  <rect class="card" x="760" y="605" width="300" height="86" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="910" y="628.0" text-anchor="middle" dominant-baseline="middle">S3 storage</text>
  <text class="node-detail" x="910" y="648.0" text-anchor="middle" dominant-baseline="middle">S3Operations</text>
  <text class="node-detail" x="910" y="668.0" text-anchor="middle" dominant-baseline="middle">bucket + key prefix</text>
</g>
<g id="signers">
  <rect class="card" x="1125" y="640" width="300" height="86" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="1275" y="663.0" text-anchor="middle" dominant-baseline="middle">Read URL signers</text>
  <text class="node-detail" x="1275" y="683.0" text-anchor="middle" dominant-baseline="middle">pre-signed S3</text>
  <text class="node-detail" x="1275" y="703.0" text-anchor="middle" dominant-baseline="middle">CloudFront URLs</text>
</g>
<g id="storageSpi">
  <rect class="card" x="1415" y="635" width="300" height="86" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="1565" y="668.0" text-anchor="middle" dominant-baseline="middle">ImageStorage SPI</text>
  <text class="node-detail" x="1565" y="688.0" text-anchor="middle" dominant-baseline="middle">upload, download, exists</text>
</g>
<g id="health">
  <rect class="card" x="340" y="842" width="340" height="84" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="510" y="874.0" text-anchor="middle" dominant-baseline="middle">Storage health</text>
  <text class="node-detail" x="510" y="894.0" text-anchor="middle" dominant-baseline="middle">exists(healthProbeKey)</text>
</g>
<g id="metrics">
  <rect class="card" x="790" y="850" width="340" height="84" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="960" y="882.0" text-anchor="middle" dominant-baseline="middle">Metrics wrapper</text>
  <text class="node-detail" x="960" y="902.0" text-anchor="middle" dominant-baseline="middle">timers and counters</text>
</g>
<g id="actuator">
  <rect class="card" x="1245" y="838" width="340" height="84" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="node-title" x="1415" y="870.0" text-anchor="middle" dominant-baseline="middle">Actuator sanitizer</text>
  <text class="node-detail" x="1415" y="890.0" text-anchor="middle" dominant-baseline="middle">privateKeyPem redaction</text>
</g>
</g>
<rect class="footer-pill" x="76" y="1002" width="1648" height="34" rx="10"/>
<text class="footer" x="900.0" y="1024" text-anchor="middle">Graphviz evidence: images-spring-boot-architecture-01.dot, .plain, and -graphviz.svg. Final SVG follows source-derived Spring Boot module layers.</text>
</svg>
