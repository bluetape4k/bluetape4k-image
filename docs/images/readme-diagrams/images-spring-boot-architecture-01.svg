<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1320" viewBox="0 0 2200 1320" role="img" aria-label="Images Spring Boot Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="2200" height="1320"/>
<rect class="frame" x="34" y="28" width="2132" height="1262" rx="26"/>
<text class="title" x="70" y="82">Images Spring Boot Architecture</text>
<text class="subtitle" x="74" y="116">Layered Spring Boot 4 auto-configuration for processing, storage, CDN, health, and metrics.</text>
<g id="layers" transform="translate(0 0)">
<rect class="layer" x="72" y="196" width="2056" height="142" rx="18"/>
<text class="layer-title" x="104" y="230" dominant-baseline="middle">Application</text>
<rect class="layer" x="72" y="390" width="2056" height="292" rx="18"/>
<text class="layer-title" x="104" y="424" dominant-baseline="middle">Auto-Configuration</text>
<rect class="layer" x="72" y="720" width="2056" height="190" rx="18"/>
<text class="layer-title" x="104" y="754" dominant-baseline="middle">Runtime Services</text>
<rect class="layer" x="72" y="1030" width="2056" height="170" rx="18"/>
<text class="layer-title" x="104" y="1064" dominant-baseline="middle">Operations</text>
</g>
<g id="edges" transform="translate(0 0)">
<path class="edge" d="M 585 307 L 585 365 L 450 365 L 450 455" stroke="#56708C"/>
<path class="edge-dashed" d="M 1140 307 L 1140 365 L 920 365 L 920 435" stroke="#8A72D6"/>
<path class="edge" d="M 615 501 L 745 501" stroke="#56708C"/>
<path class="edge" d="M 1095 481 L 1170 481 L 1170 521 L 1245 521" stroke="#DB7890"/>
<path class="edge" d="M 920 527 L 920 675 L 565 675 L 565 765" stroke="#45A7A1"/>
<path class="edge" d="M 920 527 L 920 740" stroke="#D9AA4D"/>
<path class="edge" d="M 1415 567 L 1415 790" stroke="#DB7890"/>
<path class="edge" d="M 1095 481 L 1125 481 L 1125 700 L 1915 700 L 1915 760" stroke="#58A978"/>
<path class="edge" d="M 1680 466 L 1680 350 L 160 350 L 160 1110 L 385 1110" stroke="#45A7A1"/>
<path class="edge" d="M 2020 606 L 2110 606 L 2110 1015 L 1100 1015 L 1100 1075" stroke="#8A72D6"/>
<path class="edge" d="M 1585 521 L 2110 521 L 2110 1010 L 1640 1010 L 1640 1060" stroke="#B88A44"/>
<path class="edge" d="M 565 857 L 565 1000 L 1100 1000 L 1100 1075" stroke="#45A7A1"/>
<path class="edge" d="M 1050 832 L 1050 1075" stroke="#D9AA4D"/>
</g>
<g id="nodes" transform="translate(0 0)">
<g id="app">
  <rect class="card" x="420" y="225" width="330" height="82" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="585" y="256.0" text-anchor="middle" dominant-baseline="middle">Spring Boot app</text>
  <text class="node-detail" x="585" y="276.0" text-anchor="middle" dominant-baseline="middle">imports starter</text>
</g>
<g id="props">
  <rect class="card" x="960" y="225" width="360" height="82" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="1140" y="256.0" text-anchor="middle" dominant-baseline="middle">Images properties</text>
  <text class="node-detail" x="1140" y="276.0" text-anchor="middle" dominant-baseline="middle">bluetape4k.images.*</text>
</g>
<g id="autoProcessing">
  <rect class="card" x="285" y="455" width="330" height="92" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="450" y="481.0" text-anchor="middle" dominant-baseline="middle">Processing Config</text>
  <text class="node-detail" x="450" y="501.0" text-anchor="middle" dominant-baseline="middle">AutoConfiguration</text>
  <text class="node-detail" x="450" y="521.0" text-anchor="middle" dominant-baseline="middle">format and quality</text>
</g>
<g id="autoStorage">
  <rect class="card" x="745" y="435" width="350" height="92" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="920" y="461.0" text-anchor="middle" dominant-baseline="middle">Storage Config</text>
  <text class="node-detail" x="920" y="481.0" text-anchor="middle" dominant-baseline="middle">AutoConfiguration</text>
  <text class="node-detail" x="920" y="501.0" text-anchor="middle" dominant-baseline="middle">local or S3 backend</text>
</g>
<g id="autoCdn">
  <rect class="card" x="1245" y="475" width="340" height="92" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="1415" y="501.0" text-anchor="middle" dominant-baseline="middle">CDN Config</text>
  <text class="node-detail" x="1415" y="521.0" text-anchor="middle" dominant-baseline="middle">AutoConfiguration</text>
  <text class="node-detail" x="1415" y="541.0" text-anchor="middle" dominant-baseline="middle">S3 or CloudFront</text>
</g>
<g id="autoHealth">
  <rect class="card" x="1680" y="420" width="340" height="92" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="1850" y="446.0" text-anchor="middle" dominant-baseline="middle">Health Config</text>
  <text class="node-detail" x="1850" y="466.0" text-anchor="middle" dominant-baseline="middle">AutoConfiguration</text>
  <text class="node-detail" x="1850" y="486.0" text-anchor="middle" dominant-baseline="middle">reactive probe</text>
</g>
<g id="autoMetrics">
  <rect class="card" x="1680" y="560" width="340" height="92" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="1850" y="586.0" text-anchor="middle" dominant-baseline="middle">Metrics Config</text>
  <text class="node-detail" x="1850" y="606.0" text-anchor="middle" dominant-baseline="middle">AutoConfiguration</text>
  <text class="node-detail" x="1850" y="626.0" text-anchor="middle" dominant-baseline="middle">Micrometer wrapper</text>
</g>
<g id="local">
  <rect class="card" x="390" y="765" width="350" height="92" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="565" y="791.0" text-anchor="middle" dominant-baseline="middle">Local storage</text>
  <text class="node-detail" x="565" y="811.0" text-anchor="middle" dominant-baseline="middle">filesystem root</text>
  <text class="node-detail" x="565" y="831.0" text-anchor="middle" dominant-baseline="middle">path traversal guard</text>
</g>
<g id="s3">
  <rect class="card" x="875" y="740" width="350" height="92" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="1050" y="766.0" text-anchor="middle" dominant-baseline="middle">S3 storage</text>
  <text class="node-detail" x="1050" y="786.0" text-anchor="middle" dominant-baseline="middle">S3Operations</text>
  <text class="node-detail" x="1050" y="806.0" text-anchor="middle" dominant-baseline="middle">bucket + key prefix</text>
</g>
<g id="signers">
  <rect class="card" x="1320" y="790" width="350" height="92" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="1495" y="816.0" text-anchor="middle" dominant-baseline="middle">Read URL signers</text>
  <text class="node-detail" x="1495" y="836.0" text-anchor="middle" dominant-baseline="middle">pre-signed S3</text>
  <text class="node-detail" x="1495" y="856.0" text-anchor="middle" dominant-baseline="middle">CloudFront URLs</text>
</g>
<g id="storageSpi">
  <rect class="card" x="1740" y="760" width="350" height="92" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="1915" y="796.0" text-anchor="middle" dominant-baseline="middle">ImageStorage SPI</text>
  <text class="node-detail" x="1915" y="816.0" text-anchor="middle" dominant-baseline="middle">upload, download, exists</text>
</g>
<g id="health">
  <rect class="card" x="385" y="1065" width="380" height="90" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="575" y="1100.0" text-anchor="middle" dominant-baseline="middle">Storage health</text>
  <text class="node-detail" x="575" y="1120.0" text-anchor="middle" dominant-baseline="middle">exists(healthProbeKey)</text>
</g>
<g id="metrics">
  <rect class="card" x="910" y="1075" width="380" height="90" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="node-title" x="1100" y="1110.0" text-anchor="middle" dominant-baseline="middle">Metrics wrapper</text>
  <text class="node-detail" x="1100" y="1130.0" text-anchor="middle" dominant-baseline="middle">timers and counters</text>
</g>
<g id="actuator">
  <rect class="card" x="1450" y="1060" width="380" height="90" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="node-title" x="1640" y="1095.0" text-anchor="middle" dominant-baseline="middle">Actuator sanitizer</text>
  <text class="node-detail" x="1640" y="1115.0" text-anchor="middle" dominant-baseline="middle">privateKeyPem redaction</text>
</g>
</g>
<rect class="footer-pill" x="76" y="1222" width="2048" height="34" rx="10"/>
<text class="footer" x="1100.0" y="1244" text-anchor="middle">Graphviz evidence: images-spring-boot-architecture-01.dot, .plain, and -graphviz.svg. Final SVG follows source-derived Spring Boot module layers.</text>
</svg>
