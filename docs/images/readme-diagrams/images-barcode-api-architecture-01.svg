<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Barcode API Provider Architecture">
<defs>
  <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 1.12 1.4 L 12.88 7 L 1.12 12.6 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none"/></marker>
  <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 1.12 1.4 L 12.88 7 L 1.12 12.6 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0" stroke-dasharray="none"/></marker>
  <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 1.12 1.4 L 12.88 7 L 1.12 12.6 Z" fill="#9333ea" stroke="#9333ea" stroke-width="0" stroke-dasharray="none"/></marker>
  <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="secondary" data-tip-direction="positive-x"><path d="M 0.8 1 L 9.2 5 L 0.8 9 Z" fill="#6b7280" stroke="#6b7280" stroke-width="0" stroke-dasharray="none"/></marker>
  <style>
    .canvas{fill:#ffffff}
    .lane{fill:#f3f6fa;stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:8 6}
    .lane-provider{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:8 6}
    .card{fill:#ffffff;stroke:#94a3b8;stroke-width:1.9}
    .card-soft{fill:#ffffff;stroke:#c4b5fd;stroke-width:1.9}
    .badge-text{font-family:"Comic Mono";font-size:11px;fill:#374151;font-weight:700}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#111827;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#6b7280;font-weight:400}
    .panel-title{font-family:"Comic Mono";font-size:16px;fill:#4b5563;font-weight:700;letter-spacing:0.8px}
    .card-title{font-family:"Architects Daughter";font-size:24px;fill:#111827;font-weight:400}
    .detail,.label,.note{font-family:"Comic Mono";fill:#6b7280;font-weight:400}
    .detail{font-size:13px}
    .label{font-size:12px}
    .note{font-size:13px}
    .edge-blue{stroke:#2563eb;stroke-width:2.2;fill:none;marker-end:url(#arrow-blue);stroke-linecap:round;stroke-linejoin:round}
    .edge-green{stroke:#16a34a;stroke-width:2.2;fill:none;marker-end:url(#arrow-green);stroke-linecap:round;stroke-linejoin:round}
    .edge-purple{stroke:#9333ea;stroke-width:2.2;fill:none;marker-end:url(#arrow-purple);stroke-linecap:round;stroke-linejoin:round}
    .edge-gray{stroke:#6b7280;stroke-width:1.8;fill:none;marker-end:url(#arrow-gray);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 4}
    .key-box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.2}
  </style>
</defs>
<rect class="canvas" width="1600" height="900"/>
<text class="title" x="70" y="78">Barcode API + Provider Architecture</text>
<text class="subtitle" x="74" y="112">The API module owns stable contracts; decoder-specific provider modules plug in without coupling callers to ZXing or native runtimes.</text>
<desc>Barcode API Provider Architecture explains images-barcode-api source contracts, provider-neutral models, and future provider module boundaries.</desc>

<rect class="lane" x="78" y="150" width="1444" height="138" rx="8"/>
<text class="panel-title" x="98" y="180" dominant-baseline="middle">CALLER INPUTS</text>
<rect class="lane" x="78" y="318" width="1444" height="308" rx="8"/>
<text class="panel-title" x="98" y="348" dominant-baseline="middle">images-barcode-api CONTRACTS</text>
<rect class="lane-provider" x="78" y="656" width="1444" height="150" rx="8"/>
<text class="panel-title" x="98" y="686" dominant-baseline="middle">PROVIDER MODULES</text>

<g id="edges">
  <path data-connector="true" class="connector edge-blue" d="M 440 224 L 560 224"/>
  <path data-connector="true" class="connector edge-blue" d="M 950 224 L 1080 224"/>
  <path data-connector="true" class="connector edge-blue" d="M 1260 258 L 1260 350"/>
  <path data-connector="true" class="connector edge-blue" d="M 1260 455 L 1260 500"/>
  <path data-connector="true" class="connector edge-purple" d="M 960 552 L 1050 552"/>
  <path data-connector="true" class="connector edge-green" d="M 815 696 L 815 642 Q 815 632 805 632 L 620 632 Q 610 632 610 622 L 610 455"/>
  <path data-connector="true" class="connector edge-gray" d="M 1030 730 L 1170 730"/>
</g>

<g id="cards">
  <g id="caller">
    <rect class="card" x="110" y="190" width="330" height="68" rx="8"/>
    <rect x="130" y="206" width="48" height="36" rx="7" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
    <text class="badge-text" x="154" y="228" text-anchor="middle">APP</text>
    <text class="card-title" x="206" y="217" dominant-baseline="middle">Caller code</text>
    <text class="detail" x="206" y="239" dominant-baseline="middle">service or route</text>
  </g>
  <g id="encoded-input">
    <rect class="card" x="560" y="190" width="390" height="68" rx="8"/>
    <rect x="580" y="206" width="48" height="36" rx="7" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.3"/>
    <text class="badge-text" x="604" y="228" text-anchor="middle">IO</text>
    <text class="card-title" x="656" y="217" dominant-baseline="middle">Encoded inputs</text>
    <text class="detail" x="656" y="239" dominant-baseline="middle">bytes, path, stream, source</text>
  </g>
  <g id="immutable-image">
    <rect class="card" x="1080" y="190" width="390" height="68" rx="8"/>
    <rect x="1100" y="206" width="48" height="36" rx="7" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="1.3"/>
    <text class="badge-text" x="1124" y="228" text-anchor="middle">IMG</text>
    <text class="card-title" x="1176" y="217" dominant-baseline="middle">ImmutableImage</text>
    <text class="detail" x="1176" y="239" dominant-baseline="middle">loaded by bluetape4k-images</text>
  </g>

  <g id="input-helpers">
    <rect class="card" x="110" y="500" width="470" height="105" rx="8"/>
    <rect x="132" y="532" width="54" height="42" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.3"/>
    <text class="badge-text" x="159" y="557" text-anchor="middle">LOAD</text>
    <text class="card-title" x="218" y="528" dominant-baseline="middle">Input helpers</text>
    <text class="detail" x="218" y="552" dominant-baseline="middle">readBarcodes(bytes/path/input/source)</text>
    <text class="detail" x="218" y="574" dominant-baseline="middle">reuse immutableImageOf(...)</text>
  </g>
  <g id="reader-contract">
    <rect class="card" x="520" y="350" width="400" height="105" rx="8"/>
    <rect x="542" y="382" width="54" height="42" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.3"/>
    <text class="badge-text" x="569" y="407" text-anchor="middle">SPI</text>
    <text class="card-title" x="628" y="378" dominant-baseline="middle">BarcodeReader</text>
    <text class="detail" x="628" y="402" dominant-baseline="middle">provider contract</text>
    <text class="detail" x="628" y="424" dominant-baseline="middle">ImmutableImage + options</text>
  </g>
  <g id="extensions">
    <rect class="card" x="1050" y="350" width="420" height="105" rx="8"/>
    <rect x="1072" y="382" width="54" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
    <text class="badge-text" x="1099" y="407" text-anchor="middle">API</text>
    <text class="card-title" x="1158" y="378" dominant-baseline="middle">Image extensions</text>
    <text class="detail" x="1158" y="402" dominant-baseline="middle">extractBarcodes(...)</text>
    <text class="detail" x="1158" y="424" dominant-baseline="middle">suspendExtractBarcodes(...)</text>
  </g>
  <g id="options">
    <rect class="card" x="660" y="500" width="300" height="105" rx="8"/>
    <rect x="682" y="532" width="54" height="42" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.3"/>
    <text class="badge-text" x="709" y="557" text-anchor="middle">OPT</text>
    <text class="card-title" x="768" y="528" dominant-baseline="middle">Options</text>
    <text class="detail" x="768" y="552" dominant-baseline="middle">formats</text>
    <text class="detail" x="768" y="574" dominant-baseline="middle">confidence filter</text>
  </g>
  <g id="models">
    <rect class="card" x="1050" y="500" width="420" height="105" rx="8"/>
    <rect x="1072" y="532" width="54" height="42" rx="8" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="1.3"/>
    <text class="badge-text" x="1099" y="557" text-anchor="middle">DTO</text>
    <text class="card-title" x="1158" y="528" dominant-baseline="middle">Normalized results</text>
    <text class="detail" x="1158" y="552" dominant-baseline="middle">BarcodeResult, region, provider id</text>
    <text class="detail" x="1158" y="574" dominant-baseline="middle">Serializable value models</text>
  </g>

  <g id="zxing-provider">
    <rect class="card-soft" x="110" y="696" width="350" height="72" rx="8"/>
    <rect x="132" y="714" width="48" height="36" rx="7" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.3"/>
    <text class="badge-text" x="156" y="736" text-anchor="middle">ZX</text>
    <text class="card-title" x="208" y="722" dominant-baseline="middle">ZXing provider</text>
    <text class="detail" x="208" y="744" dominant-baseline="middle">future module, issue #245</text>
  </g>
  <g id="other-providers">
    <rect class="card-soft" x="600" y="696" width="430" height="72" rx="8"/>
    <rect x="622" y="714" width="48" height="36" rx="7" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.3"/>
    <text class="badge-text" x="646" y="736" text-anchor="middle">ALT</text>
    <text class="card-title" x="698" y="722" dominant-baseline="middle">Other providers</text>
    <text class="detail" x="698" y="744" dominant-baseline="middle">BoofCV, native, commercial SDK</text>
  </g>
  <g id="decoder-backend">
    <rect class="card-soft" x="1170" y="696" width="350" height="72" rx="8"/>
    <rect x="1192" y="714" width="48" height="36" rx="7" fill="#fef2f2" stroke="#fecaca" stroke-width="1.3"/>
    <text class="badge-text" x="1216" y="736" text-anchor="middle">DEC</text>
    <text class="card-title" x="1268" y="722" dominant-baseline="middle">Decoder backend</text>
    <text class="detail" x="1268" y="744" dominant-baseline="middle">provider-specific lifecycle</text>
  </g>
</g>

<g id="legend">
  <rect class="key-box" x="210" y="826" width="1180" height="38" rx="6"/>
  <path data-connector="true" class="connector edge-blue" d="M 250 845 L 296 845"/>
  <text class="label" x="310" y="849">caller input</text>
  <path data-connector="true" class="connector edge-green" d="M 510 845 L 556 845"/>
  <text class="label" x="570" y="849">provider implements</text>
  <path data-connector="true" class="connector edge-purple" d="M 820 845 L 866 845"/>
  <text class="label" x="880" y="849">API normalization</text>
  <path data-connector="true" class="connector edge-gray" d="M 1120 845 L 1166 845"/>
  <text class="label" x="1180" y="849">private decoder call</text>
</g>

<text class="note" x="800" y="888" text-anchor="middle">https://github.com/bluetape4k/bluetape4k-image | project: bluetape4k-image | module: images-barcode-api</text>
</svg>
