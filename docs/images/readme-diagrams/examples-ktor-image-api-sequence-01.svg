<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="1055" viewBox="0 0 1860 1055" role="img" aria-label="Ktor Image API Sequence">
<defs>
  <marker markerUnits="userSpaceOnUse" id="arrow-blue" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker markerUnits="userSpaceOnUse" id="arrow-teal" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2c7a7b" stroke="#2c7a7b" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    .canvas{fill:#ffffff}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#111827;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#6b7280;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#111827;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#6b7280;font-weight:400}
    .panel-title{font-family:"Comic Mono";font-size:16px;fill:#4b5563;font-weight:700;letter-spacing:0.8px}
    .layer{fill:#f3f6fa;stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:8 6}
    .layer-title{font-family:"Comic Mono";font-size:16px;fill:#4b5563;font-weight:700;letter-spacing:0.8px}
    .label{font-family:"Comic Mono";font-size:12px;fill:#374151;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#6b7280;font-weight:400}
    .footer-pill{fill:#ffffff;stroke:#d1d5db;stroke-width:1}
    .card{fill:#ffffff;stroke:#94a3b8;stroke-width:1.9}
    .edge{stroke:#4f86c6;stroke-width:2.1;fill:none;marker-end:url(#arrow-blue);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#2c7a7b;stroke-width:1.8;fill:none;marker-end:url(#arrow-teal);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 4}
    .lifeline{stroke:#d1d5db;stroke-width:1.5;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="1860" height="1055"/>
<rect class="frame" x="24" y="150" width="1812" height="820" rx="14" fill="none" stroke="#dbe3ee" stroke-width="1.2"/>
<text class="title" x="70" y="82">Ktor Image API Sequence</text>
<text class="subtitle" x="74" y="116">CAPTCHA and thumbnail requests stay local and return JSON or PNG bytes.</text>
<g id="participants">
<rect class="card participant-card header" x="40" y="185" width="280" height="78" rx="8" style="fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.8"/>
<text class="node-title participant" x="180" y="217" text-anchor="middle" dominant-baseline="middle">Client</text>
<text class="node-detail" x="180" y="241" text-anchor="middle" dominant-baseline="middle">curl/test</text>
<line class="lifeline" x1="180" y1="263" x2="180" y2="895"/>
<rect class="card participant-card header" x="415" y="185" width="280" height="78" rx="8" style="fill:#f0fdf4;stroke:#bbf7d0;stroke-width:1.8"/>
<text class="node-title participant" x="555" y="217" text-anchor="middle" dominant-baseline="middle">Ktor app</text>
<text class="node-detail" x="555" y="241" text-anchor="middle" dominant-baseline="middle">routing</text>
<line class="lifeline" x1="555" y1="263" x2="555" y2="895"/>
<rect class="card participant-card header" x="790" y="185" width="280" height="78" rx="8" style="fill:#fff7ed;stroke:#fed7aa;stroke-width:1.8"/>
<text class="node-title participant" x="930" y="217" text-anchor="middle" dominant-baseline="middle">CAPTCHA helper</text>
<text class="node-detail" x="930" y="241" text-anchor="middle" dominant-baseline="middle">images-captcha</text>
<line class="lifeline" x1="930" y1="263" x2="930" y2="895"/>
<rect class="card participant-card header" x="1165" y="185" width="280" height="78" rx="8" style="fill:#fef2f2;stroke:#fecaca;stroke-width:1.8"/>
<text class="node-title participant" x="1305" y="217" text-anchor="middle" dominant-baseline="middle">Thumbnail helper</text>
<text class="node-detail" x="1305" y="241" text-anchor="middle" dominant-baseline="middle">images</text>
<line class="lifeline" x1="1305" y1="263" x2="1305" y2="895"/>
<rect class="card participant-card header" x="1540" y="185" width="280" height="78" rx="8" style="fill:#f0fdfa;stroke:#ccfbf1;stroke-width:1.8"/>
<text class="node-title participant" x="1680" y="217" text-anchor="middle" dominant-baseline="middle">Response</text>
<text class="node-detail" x="1680" y="241" text-anchor="middle" dominant-baseline="middle">JSON/PNG</text>
<line class="lifeline" x1="1680" y1="263" x2="1680" y2="895"/>
</g>
<g id="messages">
<path data-connector="true" class="edge" d="M 180 327 L 555 327"/>
<rect class="activation" x="551" y="316" width="8" height="26" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<rect class="pill" x="227.0" y="280" width="281.0" height="28" rx="9" fill="#ffffff" stroke="#d1d5db"/>
<circle cx="245.0" cy="294" r="12" fill="#4f86c6"/>
<text class="label" x="245.0" y="295" text-anchor="middle" dominant-baseline="middle" style="fill:#ffffff;font-size:12px">1</text>
<text class="label" x="383.5" y="294" text-anchor="middle" dominant-baseline="middle">GET /api/captcha?length=4</text>
<path data-connector="true" class="edge" d="M 555 397 L 930 397"/>
<rect class="activation" x="926" y="386" width="8" height="26" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<rect class="pill" x="614.3" y="350" width="256.4" height="28" rx="9" fill="#ffffff" stroke="#d1d5db"/>
<circle cx="632.3" cy="364" r="12" fill="#4f86c6"/>
<text class="label" x="632.3" y="365" text-anchor="middle" dominant-baseline="middle" style="fill:#ffffff;font-size:12px">2</text>
<text class="label" x="758.5" y="364" text-anchor="middle" dominant-baseline="middle">Create challenge image</text>
<path data-connector="true" class="edge-dashed" d="M 930 477 L 1680 477"/>
<rect class="activation" x="1676" y="466" width="8" height="26" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<rect class="pill" x="1131.7" y="430" width="346.6" height="28" rx="9" fill="#ffffff" stroke="#d1d5db"/>
<circle cx="1149.7" cy="444" r="12" fill="#2c7a7b"/>
<text class="label" x="1149.7" y="445" text-anchor="middle" dominant-baseline="middle" style="fill:#ffffff;font-size:12px">3</text>
<text class="label" x="1321.0" y="444" text-anchor="middle" dominant-baseline="middle">Return issue JSON with base64 PNG</text>
<path data-connector="true" class="edge" d="M 180 557 L 555 557"/>
<rect class="activation" x="551" y="546" width="8" height="26" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<rect class="pill" x="210.6" y="510" width="313.8" height="28" rx="9" fill="#ffffff" stroke="#d1d5db"/>
<circle cx="228.6" cy="524" r="12" fill="#4f86c6"/>
<text class="label" x="228.6" y="525" text-anchor="middle" dominant-baseline="middle" style="fill:#ffffff;font-size:12px">4</text>
<text class="label" x="383.5" y="524" text-anchor="middle" dominant-baseline="middle">POST /api/captcha/{id}/verify</text>
<path data-connector="true" class="edge" d="M 180 627 L 555 627"/>
<rect class="activation" x="551" y="616" width="8" height="26" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<rect class="pill" x="231.1" y="580" width="272.8" height="28" rx="9" fill="#ffffff" stroke="#d1d5db"/>
<circle cx="249.1" cy="594" r="12" fill="#4f86c6"/>
<text class="label" x="249.1" y="595" text-anchor="middle" dominant-baseline="middle" style="fill:#ffffff;font-size:12px">5</text>
<text class="label" x="383.5" y="594" text-anchor="middle" dominant-baseline="middle">POST multipart thumbnail</text>
<path data-connector="true" class="edge" d="M 555 697 L 1305 697"/>
<rect class="activation" x="1301" y="686" width="8" height="26" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<rect class="pill" x="810.0" y="650" width="240.0" height="28" rx="9" fill="#ffffff" stroke="#d1d5db"/>
<circle cx="828.0" cy="664" r="12" fill="#4f86c6"/>
<text class="label" x="828.0" y="665" text-anchor="middle" dominant-baseline="middle" style="fill:#ffffff;font-size:12px">6</text>
<text class="label" x="946.0" y="664" text-anchor="middle" dominant-baseline="middle">Fit image to maxSide</text>
<path data-connector="true" class="edge-dashed" d="M 1305 767 L 1680 767"/>
<rect class="activation" x="1676" y="756" width="8" height="26" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<rect class="pill" x="1347.9" y="720" width="289.2" height="28" rx="9" fill="#ffffff" stroke="#d1d5db"/>
<circle cx="1365.9" cy="734" r="12" fill="#2c7a7b"/>
<text class="label" x="1365.9" y="735" text-anchor="middle" dominant-baseline="middle" style="fill:#ffffff;font-size:12px">7</text>
<text class="label" x="1508.5" y="734" text-anchor="middle" dominant-baseline="middle">Return PNG thumbnail bytes</text>
</g>
<text class="footer" x="930.0" y="987" text-anchor="middle">https://github.com/bluetape4k/bluetape4k-image | project: bluetape4k-image | module: examples:ktor-image-api</text>
</svg>
