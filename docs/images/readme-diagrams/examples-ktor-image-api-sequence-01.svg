<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="870" viewBox="0 0 1450 870" role="img" aria-label="Ktor Image API Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="1450" height="870"/>
<rect class="frame" x="34" y="28" width="1382" height="812" rx="26"/>
<text class="title" x="70" y="82">Ktor Image API Sequence</text>
<text class="subtitle" x="74" y="116">CAPTCHA and thumbnail requests stay local and return JSON or PNG bytes.</text>
<g id="participants">
<rect class="card" x="70" y="185" width="230" height="72" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="node-title" x="185" y="214" text-anchor="middle" dominant-baseline="middle">Client</text>
<text class="node-detail" x="185" y="238" text-anchor="middle" dominant-baseline="middle">curl/test</text>
<line class="lifeline" x1="185" y1="257" x2="185" y2="775"/>
<rect class="card" x="340" y="185" width="230" height="72" rx="10" fill="#EAF7EF" stroke="#58A978"/>
<text class="node-title" x="455" y="214" text-anchor="middle" dominant-baseline="middle">Ktor app</text>
<text class="node-detail" x="455" y="238" text-anchor="middle" dominant-baseline="middle">routing</text>
<line class="lifeline" x1="455" y1="257" x2="455" y2="775"/>
<rect class="card" x="610" y="185" width="230" height="72" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
<text class="node-title" x="725" y="214" text-anchor="middle" dominant-baseline="middle">CAPTCHA helper</text>
<text class="node-detail" x="725" y="238" text-anchor="middle" dominant-baseline="middle">images-captcha</text>
<line class="lifeline" x1="725" y1="257" x2="725" y2="775"/>
<rect class="card" x="880" y="185" width="230" height="72" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
<text class="node-title" x="995" y="214" text-anchor="middle" dominant-baseline="middle">Thumbnail helper</text>
<text class="node-detail" x="995" y="238" text-anchor="middle" dominant-baseline="middle">images</text>
<line class="lifeline" x1="995" y1="257" x2="995" y2="775"/>
<rect class="card" x="1150" y="185" width="230" height="72" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="node-title" x="1265" y="214" text-anchor="middle" dominant-baseline="middle">Response</text>
<text class="node-detail" x="1265" y="238" text-anchor="middle" dominant-baseline="middle">JSON/PNG</text>
<line class="lifeline" x1="1265" y1="257" x2="1265" y2="775"/>
</g>
<g id="messages">
<path class="edge" d="M 185 325 L 455 325"/>
<rect x="206.0" y="279" width="228.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="320.0" y="293" text-anchor="middle" dominant-baseline="middle">1. GET /api/captcha?length=4</text>
<circle cx="185" cy="325" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="455" cy="325" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<path class="edge" d="M 455 395 L 725 395"/>
<rect x="486.5" y="349" width="207.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="590.0" y="363" text-anchor="middle" dominant-baseline="middle">2. Create challenge image</text>
<circle cx="455" cy="395" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="725" cy="395" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<path class="edge-dashed" d="M 725 475 L 1265 475"/>
<rect x="853.0" y="429" width="284.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="995.0" y="443" text-anchor="middle" dominant-baseline="middle">3. Return issue JSON with base64 PNG</text>
<circle cx="725" cy="475" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="1265" cy="475" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<path class="edge" d="M 185 555 L 455 555"/>
<rect x="192.0" y="509" width="256.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="320.0" y="523" text-anchor="middle" dominant-baseline="middle">4. POST /api/captcha/{id}/verify</text>
<circle cx="185" cy="555" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="455" cy="555" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<path class="edge" d="M 185 625 L 455 625"/>
<rect x="209.5" y="579" width="221.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="320.0" y="593" text-anchor="middle" dominant-baseline="middle">5. POST multipart thumbnail</text>
<circle cx="185" cy="625" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="455" cy="625" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<path class="edge" d="M 455 695 L 995 695"/>
<rect x="628.5" y="649" width="193.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="725.0" y="663" text-anchor="middle" dominant-baseline="middle">6. Fit image to maxSide</text>
<circle cx="455" cy="695" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="995" cy="695" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<path class="edge-dashed" d="M 995 765 L 1265 765"/>
<rect x="1012.5" y="719" width="235.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="1130.0" y="733" text-anchor="middle" dominant-baseline="middle">7. Return PNG thumbnail bytes</text>
<circle cx="995" cy="765" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="1265" cy="765" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
</g>
<text class="footer" x="725.0" y="820" text-anchor="middle">Bad multipart requests return the bluetape4k API error payload.</text>
</svg>
