<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="790" viewBox="0 0 1450 790" role="img" aria-label="Ktor Image API Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="1450" height="790"/>
<rect class="frame" x="34" y="28" width="1382" height="732" rx="26"/>
<text class="title" x="70" y="82">Ktor Image API Sequence</text>
<text class="subtitle" x="74" y="116">CAPTCHA and thumbnail requests stay local and return JSON or PNG bytes.</text>
<g id="participants">
<rect class="card" x="52" y="150" width="186" height="68" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="node-title" x="145" y="177" text-anchor="middle" dominant-baseline="middle">Client</text>
<text class="node-detail" x="145" y="199" text-anchor="middle" dominant-baseline="middle">curl/test</text>
<line class="lifeline" x1="145" y1="218" x2="145" y2="695"/>
<rect class="card" x="302" y="150" width="186" height="68" rx="10" fill="#EAF7EF" stroke="#58A978"/>
<text class="node-title" x="395" y="177" text-anchor="middle" dominant-baseline="middle">Ktor app</text>
<text class="node-detail" x="395" y="199" text-anchor="middle" dominant-baseline="middle">routing</text>
<line class="lifeline" x1="395" y1="218" x2="395" y2="695"/>
<rect class="card" x="567" y="150" width="186" height="68" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
<text class="node-title" x="660" y="177" text-anchor="middle" dominant-baseline="middle">CAPTCHA helper</text>
<text class="node-detail" x="660" y="199" text-anchor="middle" dominant-baseline="middle">images-captcha</text>
<line class="lifeline" x1="660" y1="218" x2="660" y2="695"/>
<rect class="card" x="837" y="150" width="186" height="68" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
<text class="node-title" x="930" y="177" text-anchor="middle" dominant-baseline="middle">Thumbnail helper</text>
<text class="node-detail" x="930" y="199" text-anchor="middle" dominant-baseline="middle">images</text>
<line class="lifeline" x1="930" y1="218" x2="930" y2="695"/>
<rect class="card" x="1097" y="150" width="186" height="68" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="node-title" x="1190" y="177" text-anchor="middle" dominant-baseline="middle">Response</text>
<text class="node-detail" x="1190" y="199" text-anchor="middle" dominant-baseline="middle">JSON/PNG</text>
<line class="lifeline" x1="1190" y1="218" x2="1190" y2="695"/>
</g>
<g id="messages">
<path class="edge" d="M 145 285 L 395 285"/>
<rect x="156.0" y="239" width="228.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="270.0" y="253" text-anchor="middle" dominant-baseline="middle">1. GET /api/captcha?length=4</text>
<circle cx="145" cy="285" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="395" cy="285" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<path class="edge" d="M 395 355 L 660 355"/>
<rect x="424.0" y="309" width="207.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="527.5" y="323" text-anchor="middle" dominant-baseline="middle">2. Create challenge image</text>
<circle cx="395" cy="355" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="660" cy="355" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<path class="edge-dashed" d="M 660 435 L 1190 435"/>
<rect x="783.0" y="389" width="284.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="925.0" y="403" text-anchor="middle" dominant-baseline="middle">3. Return issue JSON with base64 PNG</text>
<circle cx="660" cy="435" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="1190" cy="435" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<path class="edge" d="M 145 515 L 395 515"/>
<rect x="142.0" y="469" width="256.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="270.0" y="483" text-anchor="middle" dominant-baseline="middle">4. POST /api/captcha/{id}/verify</text>
<circle cx="145" cy="515" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="395" cy="515" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<path class="edge" d="M 145 585 L 395 585"/>
<rect x="159.5" y="539" width="221.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="270.0" y="553" text-anchor="middle" dominant-baseline="middle">5. POST multipart thumbnail</text>
<circle cx="145" cy="585" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="395" cy="585" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<path class="edge" d="M 395 655 L 930 655"/>
<rect x="566.0" y="609" width="193.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="662.5" y="623" text-anchor="middle" dominant-baseline="middle">6. Fit image to maxSide</text>
<circle cx="395" cy="655" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="930" cy="655" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<path class="edge-dashed" d="M 930 725 L 1190 725"/>
<rect x="942.5" y="679" width="235.0" height="28" rx="9" fill="#FFFFFF" stroke="#D7E2EC"/>
<text class="label" x="1060.0" y="693" text-anchor="middle" dominant-baseline="middle">7. Return PNG thumbnail bytes</text>
<circle cx="930" cy="725" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
<circle cx="1190" cy="725" r="4" fill="#FFFFFF" stroke="#758297" stroke-width="1.8"/>
</g>
<text class="footer" x="725.0" y="740" text-anchor="middle">Bad multipart requests return the bluetape4k API error payload.</text>
</svg>
