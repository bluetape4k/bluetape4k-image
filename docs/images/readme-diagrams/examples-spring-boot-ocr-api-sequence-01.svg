<text class="label" x="1508.5" y="544" text-anchor="middle" dominant-baseline="middle">Run Tess4J OCR</text>
<path data-connector="true" class="edge-dashed" d="M 1305 667 L 930 667"/>
<rect class="activation" x="926" y="656" width="8" height="26" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<rect class="pill" x="989.3" y="620" width="256.4" height="28" rx="9" fill="#ffffff" stroke="#d1d5db"/>
<circle cx="1007.3" cy="634" r="12" fill="#6b7280"/>
<text class="label" x="1007.3" y="635" text-anchor="middle" dominant-baseline="middle" style="fill:#ffffff;font-size:12px">5</text>
<text class="label" x="1133.5" y="634" text-anchor="middle" dominant-baseline="middle">Return recognized text</text>
<path data-connector="true" class="edge-dashed" d="M 930 747 L 180 747"/>
<rect class="activation" x="176" y="736" width="8" height="26" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<rect class="pill" x="422.7" y="700" width="264.6" height="28" rx="9" fill="#ffffff" stroke="#d1d5db"/>
<circle cx="440.7" cy="714" r="12" fill="#6b7280"/>
<text class="label" x="440.7" y="715" text-anchor="middle" dominant-baseline="middle" style="fill:#ffffff;font-size:12px">6</text>
<text class="label" x="571.0" y="714" text-anchor="middle" dominant-baseline="middle">Return JSON text result</text>
</g>
<text class="footer" x="930.0" y="987" text-anchor="middle">https://github.com/bluetape4k/bluetape4k-image | project: bluetape4k-image | module: examples:spring-boot-ocr-api</text>
