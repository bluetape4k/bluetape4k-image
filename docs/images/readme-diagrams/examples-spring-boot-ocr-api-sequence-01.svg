<text class="node-title participant" x="180" y="217" text-anchor="middle" dominant-baseline="middle">Client</text>
<text class="node-detail" x="180" y="241" text-anchor="middle" dominant-baseline="middle">curl/MockMvc</text>
<line class="lifeline" x1="180" y1="263" x2="180" y2="895"/>
<rect class="card participant-card header" x="415" y="185" width="280" height="78" rx="8" style="fill:#f0fdf4;stroke:#bbf7d0;stroke-width:1.8"/>
<text class="node-title participant" x="555" y="217" text-anchor="middle" dominant-baseline="middle">Controller</text>
<text class="node-detail" x="555" y="241" text-anchor="middle" dominant-baseline="middle">REST API</text>
<line class="lifeline" x1="555" y1="263" x2="555" y2="895"/>
<rect class="card participant-card header" x="790" y="185" width="280" height="78" rx="8" style="fill:#fff7ed;stroke:#fed7aa;stroke-width:1.8"/>
<text class="node-title participant" x="930" y="217" text-anchor="middle" dominant-baseline="middle">Service</text>
<text class="node-detail" x="930" y="241" text-anchor="middle" dominant-baseline="middle">options</text>
<line class="lifeline" x1="930" y1="263" x2="930" y2="895"/>
<rect class="card participant-card header" x="1165" y="185" width="280" height="78" rx="8" style="fill:#fef2f2;stroke:#fecaca;stroke-width:1.8"/>
<text class="node-title participant" x="1305" y="217" text-anchor="middle" dominant-baseline="middle">images-ocr</text>
<text class="node-detail" x="1305" y="241" text-anchor="middle" dominant-baseline="middle">suspend API</text>
<line class="lifeline" x1="1305" y1="263" x2="1305" y2="895"/>
<rect class="card participant-card header" x="1540" y="185" width="280" height="78" rx="8" style="fill:#f0fdfa;stroke:#ccfbf1;stroke-width:1.8"/>
<text class="node-title participant" x="1680" y="217" text-anchor="middle" dominant-baseline="middle">Tesseract</text>
<text class="node-detail" x="1680" y="241" text-anchor="middle" dominant-baseline="middle">traineddata</text>
<line class="lifeline" x1="1680" y1="263" x2="1680" y2="895"/>
</g>
