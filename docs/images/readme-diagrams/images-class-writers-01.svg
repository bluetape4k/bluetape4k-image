  <line class="divider" x1="90" y1="252" x2="450" y2="252" stroke="#D6A441"/>
  <text class="stereo" x="270" y="205" text-anchor="middle">&lt;&lt;value object&gt;&gt;</text>
  <text class="class-name" x="270" y="238" text-anchor="middle">SuspendWriteContext</text>
  <text class="member" x="108" y="282">writer + image + metadata</text>
  <text class="member" x="108" y="304">output helpers</text>
</g>
<g id="imageWriter">
