  <line class="divider" x1="640" y1="252" x2="1040" y2="252" stroke="#5B8DEF"/>
  <text class="stereo" x="840" y="205" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text class="class-name" x="840" y="238" text-anchor="middle">SuspendImageWriter</text>
  <text class="member" x="658" y="282">suspendWrite(image, out)</text>
  <text class="member" x="658" y="304">write(image, out)</text>
</g>
<g id="multi">
  <rect class="card" x="1250" y="180" width="460" height="148" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <line class="divider" x1="1250" y1="252" x2="1710" y2="252" stroke="#58A978"/>
  <text class="stereo" x="1480" y="205" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text class="class-name" x="1480" y="238" text-anchor="middle">SuspendMultiPageImageWriter</text>
  <text class="member" x="1268" y="282">suspendWrite(images, out)</text>
  <text class="member" x="1268" y="304">single-page extension</text>
</g>
