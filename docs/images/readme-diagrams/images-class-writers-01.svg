  <text class="stereo" x="700" y="705" text-anchor="middle">&lt;&lt;writer&gt;&gt;</text>
  <text class="class-name" x="700" y="738" text-anchor="middle">SuspendPngWriter</text>
  <text class="member" x="538" y="782">compressionLevel</text>
  <text class="member" x="538" y="804">Max/Min/NoCompression</text>
</g>
<g id="gif">
  <rect class="card" x="930" y="680" width="350" height="148" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="divider" x1="930" y1="752" x2="1280" y2="752" stroke="#8A72D6"/>
  <text class="stereo" x="1105" y="705" text-anchor="middle">&lt;&lt;writer&gt;&gt;</text>
  <text class="class-name" x="1105" y="738" text-anchor="middle">SuspendGifWriter</text>
  <text class="member" x="948" y="782">progressive</text>
  <text class="member" x="948" y="804">Default, Progressive</text>
</g>
<g id="webp">
  <rect class="card" x="1330" y="680" width="400" height="148" rx="8" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="divider" x1="1330" y1="752" x2="1730" y2="752" stroke="#B88A44"/>
  <text class="stereo" x="1530" y="705" text-anchor="middle">&lt;&lt;writer&gt;&gt;</text>
  <text class="class-name" x="1530" y="738" text-anchor="middle">SuspendWebpWriter</text>
  <text class="member" x="1348" y="782">lossless, quality, method</text>
  <text class="member" x="1348" y="804">MaxLosslessCompression</text>
