  <text class="stereo" x="290" y="455" text-anchor="middle">&lt;&lt;writer&gt;&gt;</text>
  <text class="class-name" x="290" y="488" text-anchor="middle">SuspendTiffWriter</text>
  <text class="member" x="108" y="532">TiffCompression, quality</text>
  <text class="member" x="108" y="554">TwelveMonkeys ImageIO</text>
</g>
<g id="tiffMulti">
  <rect class="card" x="1250" y="430" width="460" height="148" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <line class="divider" x1="1250" y1="502" x2="1710" y2="502" stroke="#58A978"/>
  <text class="stereo" x="1480" y="455" text-anchor="middle">&lt;&lt;multi-page writer&gt;&gt;</text>
  <text class="class-name" x="1480" y="488" text-anchor="middle">SuspendTiffMultiPageWriter</text>
  <text class="member" x="1268" y="532">ordered image pages</text>
  <text class="member" x="1268" y="554">DEFLATE/LZW/NONE/JPEG</text>
</g>
<g id="jpeg">
  <rect class="card" x="90" y="680" width="380" height="148" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="divider" x1="90" y1="752" x2="470" y2="752" stroke="#DC6B82"/>
