  <text class="class-name" x="280" y="738" text-anchor="middle">SuspendJpegWriter</text>
  <text class="member" x="108" y="782">compression, progressive</text>
  <text class="member" x="108" y="804">Default, CompressionFromMetaData</text>
</g>
<g id="png">
