<text class="label" x="758.5" y="364" text-anchor="middle" dominant-baseline="middle">Validate file and maxSide</text>
<path data-connector="true" class="edge edge-amber" d="M 930 477 L 1305 477"/>
<rect class="activation" x="1301" y="466" width="8" height="26" rx="3"/>
<rect class="pill" x="993.4" y="430" width="248.2" height="28" rx="9" fill="#FFFFFF" stroke="#B9851B"/>
<circle cx="1011.4" cy="444" r="12" fill="#B9851B"/>
<text class="label" x="1011.4" y="445" text-anchor="middle" dominant-baseline="middle" style="fill:#FFFFFF;font-size:12px">3</text>
<text class="label" x="1133.5" y="444" text-anchor="middle" dominant-baseline="middle">Upload original bytes</text>
<path data-connector="true" class="edge" d="M 1305 547 L 1680 547"/>
<rect class="activation" x="1676" y="536" width="8" height="26" rx="3"/>
<rect class="pill" x="1356.1" y="500" width="272.8" height="28" rx="9" fill="#FFFFFF" stroke="#4F83BF"/>
<circle cx="1374.1" cy="514" r="12" fill="#4F83BF"/>
