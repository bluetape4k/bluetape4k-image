<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="1055" viewBox="0 0 1860 1055" role="img" aria-label="Spring Boot Image API Sequence">
<defs>
  <marker markerUnits="userSpaceOnUse" id="arrow-blue" markerWidth="16" markerHeight="16" viewBox="0 0 12.3077 12.3077" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F83BF" stroke="#4F83BF" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker markerUnits="userSpaceOnUse" id="arrow-green" markerWidth="16" markerHeight="16" viewBox="0 0 12.3077 12.3077" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3E9868" stroke="#3E9868" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker markerUnits="userSpaceOnUse" id="arrow-amber" markerWidth="16" markerHeight="16" viewBox="0 0 12.3077 12.3077" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B9851B" stroke="#B9851B" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker markerUnits="userSpaceOnUse" id="arrow-teal" markerWidth="16" markerHeight="16" viewBox="0 0 12.3077 12.3077" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2E8F89" stroke="#2E8F89" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker markerUnits="userSpaceOnUse" id="arrow-red" markerWidth="16" markerHeight="16" viewBox="0 0 12.3077 12.3077" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C94D68" stroke="#C94D68" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    .canvas{fill:#F6F9FC}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#263238;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#36464f;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#263238;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#36464f;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#36464f;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#36464f;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#d7e0e4;stroke-width:1}
    .card{fill:#FFFFFF;stroke:#546e7a;stroke-width:2}
    .lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8}
    .activation{fill:#e6f2ec;stroke:#5b7e67;stroke-width:1.5}
    .edge{stroke:#4F83BF;stroke-width:2.1;fill:none;marker-end:url(#arrow-blue);stroke-linecap:round;stroke-linejoin:round}
    .edge-green{stroke:#3E9868;marker-end:url(#arrow-green)}
    .edge-amber{stroke:#B9851B;marker-end:url(#arrow-amber)}
    .edge-red{stroke:#C94D68;marker-end:url(#arrow-red)}
    .edge-dashed{stroke:#2E8F89;stroke-width:1.8;fill:none;marker-end:url(#arrow-teal);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 4}
  </style>
</defs>
<rect class="canvas" width="1860" height="1055"/>
<rect class="frame" x="32" y="28" width="1796" height="999" rx="30" fill="#fbfcf8" stroke="#41545d" stroke-width="3"/>
<text class="title" x="70" y="82">Spring Boot Image API Sequence</text>
<text class="subtitle" x="74" y="116">Upload validation, thumbnail generation, local storage, and download.</text>
<g id="participants">
<rect class="card participant-card header" x="40" y="185" width="280" height="78" rx="8"/>
<text class="node-title participant" x="180" y="217" text-anchor="middle" dominant-baseline="middle">Client</text>
<text class="node-detail role" x="180" y="241" text-anchor="middle" dominant-baseline="middle">curl/MockMvc</text>
<line class="lifeline" x1="180" y1="263" x2="180" y2="895"/>
<rect class="card participant-card header" x="415" y="185" width="280" height="78" rx="8"/>
<text class="node-title participant" x="555" y="217" text-anchor="middle" dominant-baseline="middle">Controller</text>
<text class="node-detail role" x="555" y="241" text-anchor="middle" dominant-baseline="middle">REST API</text>
<line class="lifeline" x1="555" y1="263" x2="555" y2="895"/>
<rect class="card participant-card header" x="790" y="185" width="280" height="78" rx="8"/>
<text class="node-title participant" x="930" y="217" text-anchor="middle" dominant-baseline="middle">Service</text>
<text class="node-detail role" x="930" y="241" text-anchor="middle" dominant-baseline="middle">local workflow</text>
<line class="lifeline" x1="930" y1="263" x2="930" y2="895"/>
<rect class="card participant-card header" x="1165" y="185" width="280" height="78" rx="8"/>
<text class="node-title participant" x="1305" y="217" text-anchor="middle" dominant-baseline="middle">ImageStorage</text>
<text class="node-detail role" x="1305" y="241" text-anchor="middle" dominant-baseline="middle">local backend</text>
<line class="lifeline" x1="1305" y1="263" x2="1305" y2="895"/>
<rect class="card participant-card header" x="1540" y="185" width="280" height="78" rx="8"/>
<text class="node-title participant" x="1680" y="217" text-anchor="middle" dominant-baseline="middle">Filesystem</text>
<text class="node-detail role" x="1680" y="241" text-anchor="middle" dominant-baseline="middle">objects</text>
<line class="lifeline" x1="1680" y1="263" x2="1680" y2="895"/>
</g>
<g id="messages">
<path data-connector="true" class="edge edge-amber" d="M 180 327 L 555 327"/>
<rect class="activation" x="551" y="316" width="8" height="26" rx="3"/>
<rect class="pill" x="194.2" y="280" width="346.6" height="28" rx="9" fill="#FFFFFF" stroke="#B9851B"/>
<circle cx="212.2" cy="294" r="12" fill="#B9851B"/>
