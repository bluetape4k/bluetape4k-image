<text class="label" x="1508.5" y="514" text-anchor="middle" dominant-baseline="middle">Write originals/{id}.ext</text>
<path data-connector="true" class="edge" d="M 930 617 L 1305 617"/>
<rect class="activation" x="1301" y="606" width="8" height="26" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<rect class="pill" x="997.5" y="570" width="240.0" height="28" rx="9" fill="#ffffff" stroke="#d1d5db"/>
<circle cx="1015.5" cy="584" r="12" fill="#4f86c6"/>
<text class="label" x="1015.5" y="585" text-anchor="middle" dominant-baseline="middle" style="fill:#ffffff;font-size:12px">5</text>
<text class="label" x="1133.5" y="584" text-anchor="middle" dominant-baseline="middle">Upload PNG thumbnail</text>
<path data-connector="true" class="edge" d="M 1305 687 L 1680 687"/>
<rect class="activation" x="1676" y="676" width="8" height="26" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<rect class="pill" x="1352.0" y="640" width="281.0" height="28" rx="9" fill="#ffffff" stroke="#d1d5db"/>
<circle cx="1370.0" cy="654" r="12" fill="#4f86c6"/>
<text class="label" x="1370.0" y="655" text-anchor="middle" dominant-baseline="middle" style="fill:#ffffff;font-size:12px">6</text>
<text class="label" x="1508.5" y="654" text-anchor="middle" dominant-baseline="middle">Write thumbnails/{id}.png</text>
<path data-connector="true" class="edge-dashed" d="M 930 767 L 180 767"/>
<rect class="activation" x="176" y="756" width="8" height="26" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<rect class="pill" x="381.7" y="720" width="346.6" height="28" rx="9" fill="#ffffff" stroke="#d1d5db"/>
<circle cx="399.7" cy="734" r="12" fill="#2c7a7b"/>
<text class="label" x="399.7" y="735" text-anchor="middle" dominant-baseline="middle" style="fill:#ffffff;font-size:12px">7</text>
<text class="label" x="571.0" y="734" text-anchor="middle" dominant-baseline="middle">Return object keys and local URLs</text>
</g>
<text class="footer" x="930.0" y="987" text-anchor="middle">https://github.com/bluetape4k/bluetape4k-image | project: bluetape4k-image | module: examples:spring-boot-image-api</text>
