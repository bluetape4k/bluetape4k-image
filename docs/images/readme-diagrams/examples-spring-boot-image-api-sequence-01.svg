<text class="label" x="1133.5" y="444" text-anchor="middle" dominant-baseline="middle">Upload original bytes</text>
<path data-connector="true" class="edge" d="M 1305 547 L 1680 547"/>
<rect class="activation" x="1676" y="536" width="8" height="26" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<rect class="pill" x="1356.1" y="500" width="272.8" height="28" rx="9" fill="#ffffff" stroke="#d1d5db"/>
