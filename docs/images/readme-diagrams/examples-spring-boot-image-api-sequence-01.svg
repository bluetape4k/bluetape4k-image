<text class="label" x="383.5" y="294" text-anchor="middle" dominant-baseline="middle">POST multipart image with maxSide</text>
<path data-connector="true" class="edge" d="M 555 397 L 930 397"/>
<rect class="activation" x="926" y="386" width="8" height="26" rx="3"/>
<rect class="pill" x="602.0" y="350" width="281.0" height="28" rx="9" fill="#FFFFFF" stroke="#4F83BF"/>
<circle cx="620.0" cy="364" r="12" fill="#4F83BF"/>
