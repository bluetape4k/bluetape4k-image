  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">DominantColor</text>
  <text class="mono" x="18" y="108">+r: Int</text>
<text class="mono" x="18" y="129">+g: Int</text>
<text class="mono" x="18" y="150">+b: Int</text>
