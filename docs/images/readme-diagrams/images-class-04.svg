<g transform="translate(96,180)">
  <rect class="card" x="0" y="0" width="330" height="154" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">HueAdjustFilter</text>
  <text class="mono" x="18" y="108">+deltaDegrees: Float</text>
<text class="mono" x="18" y="129">+apply(image) ImmutableImage</text>
</g>
<g transform="translate(538,180)">
  <rect class="card" x="0" y="0" width="330" height="175" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#58A978"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">ColorSpaceConverter</text>
  <text class="mono" x="18" y="108">+rgbToHsv(r, g, b) FloatArray</text>
<text class="mono" x="18" y="129">+hsvToRgb(h, s, v) IntArray</text>
<text class="mono" x="18" y="150">+kelvinToRgb(kelvin) IntArray</text>
</g>
<g transform="translate(980,180)">
  <rect class="card" x="0" y="0" width="330" height="154" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#D6A441"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">SaturationAdjustFilter</text>
  <text class="mono" x="18" y="108">+factor: Float</text>
<text class="mono" x="18" y="129">+apply(image) ImmutableImage</text>
</g>
<g transform="translate(96,523)">
  <rect class="card" x="0" y="0" width="330" height="154" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#DC6B82"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">ColorTemperatureFilter</text>
  <text class="mono" x="18" y="108">+kelvin: Int</text>
<text class="mono" x="18" y="129">+apply(image) ImmutableImage</text>
</g>
<g transform="translate(538,523)">
  <rect class="card" x="0" y="0" width="330" height="238" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#45A7A1"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">ImageFilterChain</text>
  <text class="mono" x="18" y="108">+brightness(factor)</text>
<text class="mono" x="18" y="129">+contrast(factor)</text>
<text class="mono" x="18" y="150">+saturation(factor)</text>
<text class="mono" x="18" y="171">+hue(deltaDegrees)</text>
<text class="mono" x="18" y="192">+colorTemperature(kelvin)</text>
<text class="mono" x="18" y="213">+gaussianBlur(radius)</text>
</g>
<g transform="translate(980,523)">
  <rect class="card" x="0" y="0" width="330" height="154" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#8A72D6"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">RoundedCornerFilter</text>
  <text class="mono" x="18" y="108">+radius: Int</text>
<text class="mono" x="18" y="129">+apply(image) ImmutableImage</text>
</g>
<g transform="translate(96,929)">
  <rect class="card" x="0" y="0" width="330" height="175" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#B88A44"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">MedianBlurFilter</text>
  <text class="mono" x="18" y="108">+radius: Int</text>
<text class="mono" x="18" y="129">+boundary: MedianBoundaryMode</text>
<text class="mono" x="18" y="150">+apply(image) ImmutableImage</text>
</g>
<g transform="translate(538,929)">
  <rect class="card" x="0" y="0" width="330" height="133" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#8BA84D"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">SuspendWebpWriter</text>
  <text class="mono" x="18" y="108">+writeImage(image) ByteArray</text>
</g>
<g transform="translate(980,929)">
  <rect class="card" x="0" y="0" width="330" height="133" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">SuspendJpegWriter</text>
  <text class="mono" x="18" y="108">+writeImage(image) ByteArray</text>
</g>
<g transform="translate(96,1272)">
  <rect class="card" x="0" y="0" width="330" height="154" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#58A978"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">ImageSplitter</text>
  <text class="mono" x="18" y="108">+split(image, rows, cols)</text>
<text class="mono" x="18" y="129">List~ImmutableImage~</text>
</g>
<g transform="translate(538,1272)">
  <rect class="card" x="0" y="0" width="330" height="196" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#D6A441"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">ImmutableImage</text>
  <text class="mono" x="18" y="108">+width: Int</text>
<text class="mono" x="18" y="129">+height: Int</text>
<text class="mono" x="18" y="150">+scale(width, height) ImmutableImage</text>
<text class="mono" x="18" y="171">+output(writer) ByteArray</text>
</g>
<g transform="translate(980,1272)">
  <rect class="card" x="0" y="0" width="330" height="133" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#DC6B82"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">WatermarkFilter</text>
  <text class="mono" x="18" y="108">+apply(image) ImmutableImage</text>
</g>
<g transform="translate(96,1636)">
  <rect class="card" x="0" y="0" width="330" height="133" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#45A7A1"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">SuspendPngWriter</text>
  <text class="mono" x="18" y="108">+writeImage(image) ByteArray</text>
</g>
<g transform="translate(538,1636)">
  <rect class="card" x="0" y="0" width="330" height="133" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#8A72D6"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">SuspendGif2WebpWriter</text>
  <text class="mono" x="18" y="108">+writeImage(image) ByteArray</text>
</g>
<g transform="translate(980,1636)">
  <rect class="card" x="0" y="0" width="330" height="154" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#B88A44"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">ImageScaler</text>
  <text class="mono" x="18" y="108">+scale(image, width, height)</text>
<text class="mono" x="18" y="129">ImmutableImage</text>
</g>
