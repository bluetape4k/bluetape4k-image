  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">BlurScore</text>
  <text class="mono" x="18" y="108">+score: Double</text>
<text class="mono" x="18" y="129">+threshold: Double</text>
<text class="mono" x="18" y="150">+isBlurry: Boolean</text>
</g>
