  <text class="small" x="170" y="26" text-anchor="middle">«sealed interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">DominantColorExtractor</text>
  <text class="mono" x="18" y="108">+extract(image, count) List~DominantColor~</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">ExifData</text>
  <text class="mono" x="18" y="108">+gpsLatitude: Double?</text>
<text class="mono" x="18" y="129">+gpsLongitude: Double?</text>
<text class="mono" x="18" y="150">+dateTimeOriginal: LocalDateTime?</text>
<text class="mono" x="18" y="171">+cameraMake: String?</text>
<text class="mono" x="18" y="192">+iso: Int?</text>
<text class="mono" x="18" y="213">+hasGps: Boolean</text>
</g>
<g transform="translate(92,544)">
  <rect class="card" x="0" y="0" width="340" height="112" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">File</text>

</g>
