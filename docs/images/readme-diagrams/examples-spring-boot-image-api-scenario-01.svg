<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="900" viewBox="0 0 1900 900" role="img" aria-label="Spring Boot Image API Scenario">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="1900" height="900"/>
<rect class="frame" x="34" y="28" width="1832" height="842" rx="26"/>
<text class="title" x="70" y="82">Spring Boot Image API Scenario</text>
<text class="subtitle" x="74" y="116">Multipart upload creates a local original object and a PNG thumbnail.</text>
<g id="edges" transform="translate(0 70)">
<path class="edge" d="M 430 355 L 500 355" stroke="#758297"/>
<path class="edge" d="M 900 358 L 970 358" stroke="#758297"/>
<path class="edge" d="M 1360 358 L 1405 358 L 1405 205 L 1450 205" stroke="#758297"/>
<path class="edge" d="M 1360 358 L 1405 358 L 1405 505 L 1450 505" stroke="#758297"/>
<path class="edge-dashed" d="M 500 405 L 465 405 L 465 375 L 430 375" stroke="#758297"/>
</g>
<g id="nodes" transform="translate(0 70)">
<g id="client">
  <rect class="card" x="90" y="300" width="340" height="110" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="260" y="345.0" text-anchor="middle" dominant-baseline="middle">Local client</text>
  <text class="node-detail" x="260" y="365.0" text-anchor="middle" dominant-baseline="middle">curl or MockMvc</text>
</g>
<g id="controller">
  <rect class="card" x="500" y="300" width="400" height="116" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="700" y="338.0" text-anchor="middle" dominant-baseline="middle">ImageApiController</text>
  <text class="node-detail" x="700" y="358.0" text-anchor="middle" dominant-baseline="middle">POST /api/images</text>
  <text class="node-detail" x="700" y="378.0" text-anchor="middle" dominant-baseline="middle">GET /api/images/{key}</text>
</g>
<g id="service">
  <rect class="card" x="970" y="300" width="390" height="116" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="1165" y="348.0" text-anchor="middle" dominant-baseline="middle">LocalImageApiService</text>
  <text class="node-detail" x="1165" y="368.0" text-anchor="middle" dominant-baseline="middle">validate, resize, store</text>
</g>
<g id="original">
  <rect class="card" x="1450" y="150" width="360" height="110" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="1630" y="195.0" text-anchor="middle" dominant-baseline="middle">Original object</text>
  <text class="node-detail" x="1630" y="215.0" text-anchor="middle" dominant-baseline="middle">originals/{id}.jpg</text>
</g>
<g id="thumbnail">
  <rect class="card" x="1450" y="450" width="360" height="110" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="1630" y="495.0" text-anchor="middle" dominant-baseline="middle">Thumbnail object</text>
  <text class="node-detail" x="1630" y="515.0" text-anchor="middle" dominant-baseline="middle">thumbnails/{id}.png</text>
</g>
</g>
<g id="edge-labels" transform="translate(0 70)">
<rect x="415.0" y="240.0" width="100" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="465.0" y="252.0" text-anchor="middle" dominant-baseline="middle">multipart</text>
<rect x="893.0" y="240.0" width="84" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="935.0" y="252.0" text-anchor="middle" dominant-baseline="middle">suspend</text>
<rect x="1262.0" y="240.0" width="76" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1300.0" y="252.0" text-anchor="middle" dominant-baseline="middle">upload</text>
<rect x="1258.0" y="435.0" width="84" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1300.0" y="447.0" text-anchor="middle" dominant-baseline="middle">fit+png</text>
<rect x="411.0" y="435.0" width="108" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="465.0" y="447.0" text-anchor="middle" dominant-baseline="middle">local urls</text>
</g>
<text class="footer" x="950.0" y="850" text-anchor="middle">Default storage is filesystem-backed under build/tmp/spring-boot-image-api/storage.</text>
</svg>
