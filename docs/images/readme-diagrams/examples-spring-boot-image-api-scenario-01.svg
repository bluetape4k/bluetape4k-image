<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="720" viewBox="0 0 1480 720" role="img" aria-label="Spring Boot Image API Scenario">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="1480" height="720"/>
<rect class="frame" x="34" y="28" width="1412" height="662" rx="26"/>
<text class="title" x="70" y="82">Spring Boot Image API Scenario</text>
<text class="subtitle" x="74" y="116">Multipart upload creates a local original object and a PNG thumbnail.</text>
<g id="edges">
<path class="edge" d="M 330 352 L 390 352" stroke="#758297"/>
<rect x="302.0" y="332.0" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="360.0" y="344.0" text-anchor="middle" dominant-baseline="middle">multipart</text>
<path class="edge" d="M 650 352 L 720 352" stroke="#758297"/>
<rect x="627.0" y="332.0" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="685.0" y="344.0" text-anchor="middle" dominant-baseline="middle">suspend</text>
<path class="edge" d="M 980 352 L 1015 352 L 1015 212 L 1055 212" stroke="#758297"/>
<rect x="958.2" y="262.0" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1016.2" y="274.0" text-anchor="middle" dominant-baseline="middle">upload</text>
<path class="edge" d="M 980 352 L 1015 352 L 1015 492 L 1055 492" stroke="#758297"/>
<rect x="958.2" y="402.0" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1016.2" y="414.0" text-anchor="middle" dominant-baseline="middle">fit+png</text>
<path class="edge-dashed" d="M 390 390 L 330 390" stroke="#758297"/>
<rect x="302.0" y="370.0" width="116" height="22" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="360.0" y="382.0" text-anchor="middle" dominant-baseline="middle">local urls</text>
</g>
<g id="nodes">
<g id="client">
  <rect class="card" x="70" y="300" width="260" height="104" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="200" y="342.0" text-anchor="middle" dominant-baseline="middle">Local client</text>
  <text class="node-detail" x="200" y="362.0" text-anchor="middle" dominant-baseline="middle">curl or MockMvc</text>
</g>
<g id="controller">
  <rect class="card" x="390" y="300" width="260" height="104" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="520" y="332.0" text-anchor="middle" dominant-baseline="middle">ImageApiController</text>
  <text class="node-detail" x="520" y="352.0" text-anchor="middle" dominant-baseline="middle">POST /api/images</text>
  <text class="node-detail" x="520" y="372.0" text-anchor="middle" dominant-baseline="middle">GET /api/images/{key}</text>
</g>
<g id="service">
  <rect class="card" x="720" y="300" width="260" height="104" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="850" y="342.0" text-anchor="middle" dominant-baseline="middle">LocalImageApiService</text>
  <text class="node-detail" x="850" y="362.0" text-anchor="middle" dominant-baseline="middle">validate, resize, store</text>
</g>
<g id="original">
  <rect class="card" x="1055" y="160" width="260" height="104" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="1185" y="202.0" text-anchor="middle" dominant-baseline="middle">Original object</text>
  <text class="node-detail" x="1185" y="222.0" text-anchor="middle" dominant-baseline="middle">originals/{id}.jpg</text>
</g>
<g id="thumbnail">
  <rect class="card" x="1055" y="440" width="260" height="104" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="1185" y="482.0" text-anchor="middle" dominant-baseline="middle">Thumbnail object</text>
  <text class="node-detail" x="1185" y="502.0" text-anchor="middle" dominant-baseline="middle">thumbnails/{id}.png</text>
</g>
</g>
<text class="footer" x="740.0" y="670" text-anchor="middle">Default storage is filesystem-backed under build/tmp/spring-boot-image-api/storage.</text>
</svg>
