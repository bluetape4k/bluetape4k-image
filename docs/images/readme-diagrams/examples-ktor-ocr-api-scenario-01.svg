<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="700" viewBox="0 0 2100 700" role="img" aria-label="Ktor OCR API Scenario">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#203040;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#203040;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#4D5F70;font-weight:400}
    .panel-title{font-family:"Architects Daughter";font-size:24px;fill:#203040;font-weight:400}
    .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
    .label{font-family:"Comic Mono";font-size:12px;fill:#405366;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    .footer-pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    .card{filter:url(#shadow);stroke-width:2}
    .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .lifeline{stroke:#9AA8B8;stroke-width:1.7;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="2100" height="700"/>
<rect class="frame" x="34" y="28" width="2032" height="642" rx="26"/>
<text class="title" x="70" y="82">Ktor OCR API Scenario</text>
<text class="subtitle" x="74" y="116">Multipart upload extracts text through images-ocr and host Tesseract.</text>
<g id="edges" transform="translate(0 70)">
<path class="edge" d="M 430 295 L 520 295" stroke="#758297"/>
<path class="edge" d="M 940 295 L 1030 295" stroke="#758297"/>
<path class="edge" d="M 1480 295 L 1530 295 L 1530 165 L 1580 165" stroke="#758297"/>
<path class="edge" d="M 1780 220 L 1780 390" stroke="#758297"/>
<path class="edge-dashed" d="M 1030 340 L 980 340 L 980 420 L 260 420 L 260 350" stroke="#758297"/>
</g>
<g id="nodes" transform="translate(0 70)">
<g id="client">
  <rect class="card" x="90" y="240" width="340" height="110" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="node-title" x="260" y="285.0" text-anchor="middle" dominant-baseline="middle">Local client</text>
  <text class="node-detail" x="260" y="305.0" text-anchor="middle" dominant-baseline="middle">curl or Ktor test host</text>
</g>
<g id="route">
  <rect class="card" x="520" y="240" width="420" height="110" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="node-title" x="730" y="285.0" text-anchor="middle" dominant-baseline="middle">Ktor OCR route</text>
  <text class="node-detail" x="730" y="305.0" text-anchor="middle" dominant-baseline="middle">POST /api/ocr</text>
</g>
<g id="service">
  <rect class="card" x="1030" y="240" width="450" height="110" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="node-title" x="1255" y="285.0" text-anchor="middle" dominant-baseline="middle">KtorOcrService</text>
  <text class="node-detail" x="1255" y="305.0" text-anchor="middle" dominant-baseline="middle">validate and parse languages</text>
</g>
<g id="ocr">
  <rect class="card" x="1580" y="110" width="400" height="110" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="node-title" x="1780" y="155.0" text-anchor="middle" dominant-baseline="middle">images-ocr</text>
  <text class="node-detail" x="1780" y="175.0" text-anchor="middle" dominant-baseline="middle">suspendExtractText</text>
</g>
<g id="native">
  <rect class="card" x="1580" y="390" width="400" height="110" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="node-title" x="1780" y="435.0" text-anchor="middle" dominant-baseline="middle">Host Tesseract</text>
  <text class="node-detail" x="1780" y="455.0" text-anchor="middle" dominant-baseline="middle">traineddata language packs</text>
</g>
</g>
<g id="edge-labels" transform="translate(0 70)">
<rect x="425.0" y="180.0" width="100" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="475.0" y="192.0" text-anchor="middle" dominant-baseline="middle">multipart</text>
<rect x="939.0" y="180.0" width="92" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="985.0" y="192.0" text-anchor="middle" dominant-baseline="middle">delegate</text>
<rect x="1424.0" y="180.0" width="92" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1470.0" y="192.0" text-anchor="middle" dominant-baseline="middle">OCR call</text>
<rect x="1812.0" y="290.0" width="76" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="1850.0" y="302.0" text-anchor="middle" dominant-baseline="middle">Tess4J</text>
<rect x="670.0" y="435.0" width="100" height="24" rx="8" fill="#FFFFFF" stroke="#D7E2EC" opacity="0.94"/>
<text class="label" x="720.0" y="447.0" text-anchor="middle" dominant-baseline="middle">JSON text</text>
</g>
<text class="footer" x="1050.0" y="650" text-anchor="middle">Tests inject a fake OCR engine, so CI does not require host Tesseract.</text>
</svg>
