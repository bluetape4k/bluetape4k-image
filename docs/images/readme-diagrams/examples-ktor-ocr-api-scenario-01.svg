<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="700" viewBox="0 0 2100 700" role="img" aria-label="Ktor OCR API Scenario">
<defs>
  <marker markerUnits="userSpaceOnUse" id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" viewBox="0 0 10 7" data-role="secondary" data-tip-direction="positive-x"><path d="M 0.8 0.7 L 9.2 3.5 L 0.8 6.3 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none"/></marker>
  <marker markerUnits="userSpaceOnUse" id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" viewBox="0 0 10 7" data-role="secondary" data-tip-direction="positive-x"><path d="M 0.8 0.7 L 9.2 3.5 L 0.8 6.3 Z" fill="#6b7280" stroke="#6b7280" stroke-width="0" stroke-dasharray="none"/></marker>
  <style>
    .canvas{fill:#ffffff}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#111827;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#6b7280;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#111827;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#6b7280;font-weight:400}
    .panel-title{font-family:"Comic Mono";font-size:16px;fill:#4b5563;font-weight:700;letter-spacing:0.8px}
    .layer{fill:#f3f6fa;stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:8 6}
    .layer-title{font-family:"Comic Mono";font-size:16px;fill:#4b5563;font-weight:700;letter-spacing:0.8px}
    .label{font-family:"Comic Mono";font-size:12px;fill:#374151;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#6b7280;font-weight:400}
    .footer-pill{fill:#ffffff;stroke:#d1d5db;stroke-width:1}
    .card{fill:#ffffff;stroke:#94a3b8;stroke-width:1.9}
    .edge{stroke:#2563eb;stroke-width:2.1;fill:none;marker-end:url(#arrow-blue);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#6b7280;stroke-width:1.8;fill:none;marker-end:url(#arrow-gray);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 4}
    .lifeline{stroke:#d1d5db;stroke-width:1.5;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="2100" height="700"/>
<text class="title" x="70" y="82">Ktor OCR API Scenario</text>
<text class="subtitle" x="74" y="116">Multipart upload extracts text through images-ocr and host Tesseract.</text>
<g id="edges" transform="translate(0 70)">
<path data-connector="true" class="edge" d="M 430 295 L 520 295" stroke="#2563eb"/>
<path data-connector="true" class="edge" d="M 940 295 L 1030 295" stroke="#2563eb"/>
<path data-connector="true" class="edge" d="M 1480 295 L 1512 295 Q 1530 295 1530 277 L 1530 183 Q 1530 165 1548 165 L 1580 165" stroke="#2563eb"/>
<path data-connector="true" class="edge" d="M 1780 220 L 1780 390" stroke="#2563eb"/>
<path data-connector="true" class="edge-dashed" d="M 1030 340 L 998 340 Q 980 340 980 358 L 980 402 Q 980 420 962 420 L 278 420 Q 260 420 260 402 L 260 350" stroke="#6b7280"/>
</g>
<g id="nodes" transform="translate(0 70)">
<g id="client">
  <rect class="card" x="90" y="240" width="340" height="110" rx="8"/>
  <rect x="104" y="275" width="40" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text class="node-title" x="158" y="286.0" dominant-baseline="middle">Local client</text>
  <text class="node-detail" x="158" y="304.0" dominant-baseline="middle">curl or Ktor test host</text>
</g>
<g id="route">
  <rect class="card" x="520" y="240" width="420" height="110" rx="8"/>
  <rect x="534" y="275" width="40" height="40" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text class="node-title" x="588" y="286.0" dominant-baseline="middle">Ktor OCR route</text>
  <text class="node-detail" x="588" y="304.0" dominant-baseline="middle">POST /api/ocr</text>
</g>
<g id="service">
  <rect class="card" x="1030" y="240" width="450" height="110" rx="8"/>
  <rect x="1044" y="275" width="40" height="40" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text class="node-title" x="1098" y="286.0" dominant-baseline="middle">KtorOcrService</text>
  <text class="node-detail" x="1098" y="304.0" dominant-baseline="middle">validate and parse languages</text>
</g>
<g id="ocr">
  <rect class="card" x="1580" y="110" width="400" height="110" rx="8"/>
  <rect x="1594" y="145" width="40" height="40" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text class="node-title" x="1648" y="156.0" dominant-baseline="middle">images-ocr</text>
  <text class="node-detail" x="1648" y="174.0" dominant-baseline="middle">suspendExtractText</text>
</g>
<g id="native">
  <rect class="card" x="1580" y="390" width="400" height="110" rx="8"/>
  <rect x="1594" y="425" width="40" height="40" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.2"/>
  <text class="node-title" x="1648" y="436.0" dominant-baseline="middle">Host Tesseract</text>
  <text class="node-detail" x="1648" y="454.0" dominant-baseline="middle">traineddata language packs</text>
</g>
</g>
<g id="edge-labels" transform="translate(0 70)">
<rect x="421.0" y="180.0" width="108" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="475.0" y="192.0" text-anchor="middle" dominant-baseline="middle">multipart</text>
<rect x="935.0" y="180.0" width="100" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="985.0" y="192.0" text-anchor="middle" dominant-baseline="middle">delegate</text>
<rect x="1420.0" y="180.0" width="100" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="1470.0" y="192.0" text-anchor="middle" dominant-baseline="middle">OCR call</text>
<rect x="1806.0" y="290.0" width="88" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="1850.0" y="302.0" text-anchor="middle" dominant-baseline="middle">Tess4J</text>
<rect x="666.0" y="435.0" width="108" height="24" rx="8" fill="#ffffff" stroke="#d1d5db" opacity="0.96"/>
<text class="label" x="720.0" y="447.0" text-anchor="middle" dominant-baseline="middle">JSON text</text>
</g>
<text class="footer" x="1050.0" y="650" text-anchor="middle">https://github.com/bluetape4k/bluetape4k-image | project: bluetape4k-image | module: examples:ktor-ocr-api</text>
</svg>
