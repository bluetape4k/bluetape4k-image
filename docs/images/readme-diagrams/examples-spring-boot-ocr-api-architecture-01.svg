<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1540" viewBox="0 0 2100 1540" role="img" aria-label="Spring Boot OCR API Architecture">
<defs>
  <marker markerUnits="userSpaceOnUse" id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker markerUnits="userSpaceOnUse" id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280" stroke="#6b7280" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    .canvas{fill:#ffffff}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#111827;font-weight:400}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#6b7280;font-weight:400}
    .node-title{font-family:"Architects Daughter";font-size:22px;fill:#111827;font-weight:400}
    .node-detail{font-family:"Comic Mono";font-size:13px;fill:#6b7280;font-weight:400}
    .panel-title{font-family:"Comic Mono";font-size:16px;fill:#4b5563;font-weight:700;letter-spacing:0.8px}
    .layer{fill:#f3f6fa;stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:8 6}
    .layer-title{font-family:"Comic Mono";font-size:16px;fill:#4b5563;font-weight:700;letter-spacing:0.8px}
    .label{font-family:"Comic Mono";font-size:12px;fill:#374151;font-weight:400}
    .footer{font-family:"Comic Mono";font-size:13px;fill:#6b7280;font-weight:400}
    .footer-pill{fill:#ffffff;stroke:#d1d5db;stroke-width:1}
    .card{fill:#ffffff;stroke:#94a3b8;stroke-width:1.9}
    .edge{stroke:#2563eb;stroke-width:2.1;fill:none;marker-end:url(#arrow-blue);stroke-linecap:round;stroke-linejoin:round}
    .edge-dashed{stroke:#6b7280;stroke-width:1.8;fill:none;marker-end:url(#arrow-gray);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 4}
    .lifeline{stroke:#d1d5db;stroke-width:1.5;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="canvas" width="2100" height="1540"/>
<text class="title" x="70" y="82">Spring Boot OCR API Architecture</text>
<text class="subtitle" x="74" y="116">Top-down layers keep HTTP wiring separate from images-ocr and native Tesseract.</text>
<g id="layers" transform="translate(0 70)">
<rect class="layer" x="70" y="160" width="1960" height="150" rx="8"/>
<text class="panel-title" x="88" y="188" dominant-baseline="middle">CLIENT LAYER</text>
<rect class="layer" x="70" y="335" width="1960" height="150" rx="8"/>
<text class="panel-title" x="88" y="363" dominant-baseline="middle">SPRING WEB LAYER</text>
<rect class="layer" x="70" y="510" width="1960" height="155" rx="8"/>
<text class="panel-title" x="88" y="538" dominant-baseline="middle">APPLICATION LAYER</text>
<rect class="layer" x="70" y="700" width="1960" height="310" rx="8"/>
<text class="panel-title" x="88" y="728" dominant-baseline="middle">OCR LIBRARY LAYER</text>
<rect class="layer" x="70" y="1050" width="1960" height="320" rx="8"/>
<text class="panel-title" x="88" y="1078" dominant-baseline="middle">NATIVE RUNTIME LAYER</text>
</g>
<g id="edges" transform="translate(0 70)">
<path data-connector="true" class="edge" d="M 1050 275 L 1050 360" stroke="#2563eb"/>
<path data-connector="true" class="edge" d="M 1050 456 L 1050 530" stroke="#2563eb"/>
<path data-connector="true" class="edge" d="M 730 580 L 668 580 Q 650 580 650 598 L 650 730" stroke="#2563eb"/>
<path data-connector="true" class="edge" d="M 1370 580 L 1442 580 Q 1460 580 1460 598 L 1460 730" stroke="#2563eb"/>
<path data-connector="true" class="edge" d="M 1050 630 L 1050 875" stroke="#2563eb"/>
<path data-connector="true" class="edge" d="M 1050 971 L 1050 1002 Q 1050 1020 1032 1020 L 738 1020 Q 720 1020 720 1038 L 720 1080" stroke="#2563eb"/>
<path data-connector="true" class="edge" d="M 960 1128 L 1060 1128" stroke="#2563eb"/>
<path data-connector="true" class="edge" d="M 1270 1176 L 1270 1193 Q 1270 1210 1253 1210 L 1060 1210 Q 1050 1210 1050 1220 L 1050 1230" stroke="#2563eb"/>
</g>
<g id="nodes" transform="translate(0 70)">
<g id="client">
  <rect class="card" x="800" y="185" width="500" height="90" rx="8"/>
  <rect x="814" y="210" width="40" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text class="node-title" x="868" y="221.0" dominant-baseline="middle">Client</text>
  <text class="node-detail" x="868" y="239.0" dominant-baseline="middle">curl or MockMvc</text>
</g>
<g id="controller">
  <rect class="card" x="760" y="360" width="580" height="96" rx="8"/>
  <rect x="774" y="388" width="40" height="40" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text class="node-title" x="828" y="399.0" dominant-baseline="middle">OcrApiController</text>
  <text class="node-detail" x="828" y="417.0" dominant-baseline="middle">multipart endpoint</text>
</g>
<g id="service">
  <rect class="card" x="730" y="530" width="640" height="100" rx="8"/>
  <rect x="744" y="560" width="40" height="40" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text class="node-title" x="798" y="571.0" dominant-baseline="middle">SpringBootOcrService</text>
  <text class="node-detail" x="798" y="589.0" dominant-baseline="middle">validation and options</text>
</g>
<g id="image">
  <rect class="card" x="420" y="730" width="450" height="96" rx="8"/>
  <rect x="434" y="758" width="40" height="40" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text class="node-title" x="488" y="769.0" dominant-baseline="middle">ImmutableImage</text>
  <text class="node-detail" x="488" y="787.0" dominant-baseline="middle">uploaded bytes</text>
</g>
<g id="options">
  <rect class="card" x="1220" y="730" width="420" height="96" rx="8"/>
  <rect x="1234" y="758" width="40" height="40" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.2"/>
  <text class="node-title" x="1288" y="769.0" dominant-baseline="middle">OcrOptions</text>
  <text class="node-detail" x="1288" y="787.0" dominant-baseline="middle">languages + tessdata path</text>
</g>
<g id="extract">
  <rect class="card" x="760" y="875" width="580" height="96" rx="8"/>
  <rect x="774" y="903" width="40" height="40" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2"/>
  <text class="node-title" x="828" y="914.0" dominant-baseline="middle">suspendExtractText</text>
  <text class="node-detail" x="828" y="932.0" dominant-baseline="middle">Dispatchers.IO boundary</text>
</g>
<g id="engine">
  <rect class="card" x="480" y="1080" width="480" height="96" rx="8"/>
  <rect x="494" y="1108" width="40" height="40" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text class="node-title" x="548" y="1119.0" dominant-baseline="middle">TesseractOcrEngine</text>
  <text class="node-detail" x="548" y="1137.0" dominant-baseline="middle">fresh Tess4J client</text>
</g>
<g id="tess4j">
  <rect class="card" x="1060" y="1080" width="420" height="96" rx="8"/>
  <rect x="1074" y="1108" width="40" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text class="node-title" x="1128" y="1119.0" dominant-baseline="middle">Tess4J</text>
  <text class="node-detail" x="1128" y="1137.0" dominant-baseline="middle">JNI bridge</text>
</g>
<g id="tesseract">
  <rect class="card" x="790" y="1230" width="520" height="96" rx="8"/>
  <rect x="804" y="1258" width="40" height="40" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text class="node-title" x="858" y="1269.0" dominant-baseline="middle">Host Tesseract</text>
  <text class="node-detail" x="858" y="1287.0" dominant-baseline="middle">installed traineddata</text>
</g>
</g>
<text class="footer" x="1050.0" y="1490" text-anchor="middle">https://github.com/bluetape4k/bluetape4k-image | project: bluetape4k-image | module: examples:spring-boot-ocr-api</text>
</svg>
