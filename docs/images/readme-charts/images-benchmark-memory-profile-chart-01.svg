<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="Image Workload Memory Profile">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:40px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:16px;font-weight:400;fill:#536273}
    .panel{filter:url(#shadow)}.label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:20px;font-weight:400;fill:#102033}
    .axis{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:13px;font-weight:400;fill:#536273}
    .value{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:13px;font-weight:700;fill:#102033}
    .note{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:13px;font-weight:400;fill:#536273}
  </style>
</defs>
<rect class="canvas" width="1280" height="760"/>
<rect class="frame" x="32" y="28" width="1216" height="704" rx="28"/>
<text class="title" x="66" y="82">Image Workload Memory Profile</text>
<text class="subtitle" x="70" y="116">Allocation addendum for kotlinx-benchmark memory profile, macOS arm64, GraalVM Java 25; lower is better</text>

<rect x="58" y="144" width="1164" height="494" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="panel"/>
<line x1="342" y1="178" x2="342" y2="576" stroke="#D8E0EA" stroke-width="1"/>
<line x1="502" y1="178" x2="502" y2="576" stroke="#D8E0EA" stroke-width="1"/>
<line x1="662" y1="178" x2="662" y2="576" stroke="#D8E0EA" stroke-width="1"/>
<line x1="822" y1="178" x2="822" y2="576" stroke="#D8E0EA" stroke-width="1"/>
<line x1="982" y1="178" x2="982" y2="576" stroke="#D8E0EA" stroke-width="1"/>
<text class="axis" x="342" y="604" text-anchor="middle">4 KB</text>
<text class="axis" x="502" y="604" text-anchor="middle">256 KB</text>
<text class="axis" x="662" y="604" text-anchor="middle">1 MB</text>
<text class="axis" x="822" y="604" text-anchor="middle">16 MB</text>
<text class="axis" x="982" y="604" text-anchor="middle">128 MB</text>
<text class="axis" x="662" y="628" text-anchor="middle">Allocated bytes per operation, log-like scale</text>

<text class="label" x="88" y="214">scrimage JPEG encode</text>
<rect x="342" y="194" width="808" height="22" rx="7" fill="#8FC5F3"/>
<text class="value" x="1164" y="211" text-anchor="end">96.34 MB/op</text>

<text class="label" x="88" y="272">scrimage resize 1920</text>
<rect x="342" y="252" width="620" height="22" rx="7" fill="#F2C879"/>
<text class="value" x="976" y="269">24.04 MB/op</text>

<text class="label" x="88" y="330">scrimage PNG encode</text>
<rect x="342" y="310" width="158" height="22" rx="7" fill="#D8B4F8"/>
<text class="value" x="516" y="327">0.26 MB/op</text>

<text class="label" x="88" y="388">vips JPEG encode</text>
<rect x="342" y="368" width="160" height="22" rx="7" fill="#7CC7A2"/>
<text class="value" x="518" y="385">0.26 MB/op</text>

<text class="label" x="88" y="446">vips crop 1920</text>
<rect x="342" y="426" width="30" height="22" rx="7" fill="#A7D8DE"/>
<text class="value" x="388" y="443">4.63 KB/op</text>

<text class="label" x="88" y="504">vips resize 1920</text>
<rect x="342" y="484" width="27" height="22" rx="7" fill="#A7D8DE"/>
<text class="value" x="386" y="501">4.14 KB/op</text>

<text class="label" x="88" y="562">vips thumbnail 1920</text>
<rect x="342" y="542" width="26" height="22" rx="7" fill="#A7D8DE"/>
<text class="value" x="386" y="559">3.95 KB/op</text>

<rect x="86" y="654" width="18" height="12" rx="5" fill="#8FC5F3"/>
<text class="note" x="112" y="666">scrimage encode</text>
<rect x="260" y="654" width="18" height="12" rx="5" fill="#F2C879"/>
<text class="note" x="286" y="666">scrimage transform</text>
<rect x="470" y="654" width="18" height="12" rx="5" fill="#7CC7A2"/>
<text class="note" x="496" y="666">vips encode</text>
<rect x="620" y="654" width="18" height="12" rx="5" fill="#A7D8DE"/>
<text class="note" x="646" y="666">vips native transform</text>
<text class="note" x="86" y="704">Source: benchmark-memory-profile-jmh-gc-2026-05-29-macos-java25.json. Fixtures: landscape.jpg and homer.jpg.</text>
</svg>
