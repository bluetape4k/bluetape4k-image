<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="Vips Backend Comparison Benchmark">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:40px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:16px;font-weight:400;fill:#536273}
    .axis{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:13px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:20px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:13px;font-weight:400;fill:#536273}
    .value{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:13px;font-weight:700;fill:#102033}
    .na{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:13px;font-weight:700;fill:#8A4B20}
    .note{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:13px;font-weight:400;fill:#536273}
    .panel{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1280" height="760"/>
<rect class="frame" x="32" y="28" width="1216" height="704" rx="28"/>
<text class="title" x="66" y="82">Vips Backend Comparison Benchmark</text>
<text class="subtitle" x="70" y="116">macOS Java 25 measured rows; Java 21 JNI is N/A on this arm64 host</text>

<rect x="58" y="140" width="1164" height="500" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="panel"/>
<line x1="250" y1="164" x2="250" y2="570" stroke="#D8E0EA" stroke-width="1"/>
<text class="axis" x="250" y="596" text-anchor="middle">0.01</text>
<line x1="450" y1="164" x2="450" y2="570" stroke="#D8E0EA" stroke-width="1"/>
<text class="axis" x="450" y="596" text-anchor="middle">0.1</text>
<line x1="650" y1="164" x2="650" y2="570" stroke="#D8E0EA" stroke-width="1"/>
<text class="axis" x="650" y="596" text-anchor="middle">1</text>
<line x1="850" y1="164" x2="850" y2="570" stroke="#D8E0EA" stroke-width="1"/>
<text class="axis" x="850" y="596" text-anchor="middle">10</text>
<line x1="1050" y1="164" x2="1050" y2="570" stroke="#D8E0EA" stroke-width="1"/>
<text class="axis" x="1050" y="596" text-anchor="middle">100</text>
<text class="axis" x="650" y="626" text-anchor="middle">AverageTime ms/op, log scale, lower is better</text>

<text class="label" x="86" y="204">Resize 1920x1080</text>
<rect x="250" y="174" width="763" height="17" rx="5" fill="#8FC5F3"/>
<text class="na" x="250" y="216">Java 21 JNI: N/A</text>
<rect x="250" y="228" width="260" height="17" rx="5" fill="#7CC7A2"/>
<text class="value" x="1023" y="188">scrimage 65.64 ms</text>
<text class="value" x="520" y="242">FFM 0.200 ms</text>

<text class="label" x="86" y="326">Thumbnail 1920</text>
<text class="small" x="250" y="306">scrimage: N/A</text>
<text class="na" x="250" y="334">Java 21 JNI: N/A</text>
<rect x="250" y="346" width="272" height="17" rx="5" fill="#7CC7A2"/>
<text class="value" x="532" y="360">FFM 0.230 ms</text>

<text class="label" x="86" y="448">Crop 1920x1080</text>
<text class="small" x="250" y="428">scrimage: N/A</text>
<text class="na" x="250" y="456">Java 21 JNI: N/A</text>
<rect x="250" y="468" width="156" height="17" rx="5" fill="#7CC7A2"/>
<text class="value" x="416" y="482">FFM 0.060 ms</text>

<text class="label" x="86" y="556">JPEG encode</text>
<rect x="250" y="520" width="734" height="17" rx="5" fill="#8FC5F3"/>
<text class="na" x="250" y="562">Java 21 JNI: N/A</text>
<rect x="250" y="574" width="638" height="17" rx="5" fill="#7CC7A2"/>
<text class="value" x="994" y="534">scrimage 46.55 ms</text>
<text class="value" x="898" y="588">FFM 15.55 ms</text>

<rect x="970" y="274" width="18" height="12" rx="5" fill="#8FC5F3"/>
<text class="small" x="998" y="286">scrimage baseline</text>
<rect x="970" y="300" width="18" height="12" rx="5" fill="#7CC7A2"/>
<text class="small" x="998" y="312">Java 25 FFM measured</text>
<text class="na" x="970" y="338">Java 21 JNI: N/A</text>

<text class="note" x="86" y="672">Source: Java 25 FFM full run on 2026-05-28 plus scrimage macOS Java 25 baseline from 2026-05-25.</text>
<text class="note" x="86" y="700">Java 21 JNI cannot produce native measurements on this macOS arm64 host because the bundled JVips dylib is x86_64.</text>
</svg>
