<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-label="Image File IO Throughput Benchmark">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:16px;font-weight:400;fill:#536273}
    .panel{filter:url(#shadow)}.panel-title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:26px;font-weight:400;fill:#102033}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .axis{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .value{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:14px;font-weight:700;fill:#102033}
    .note{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:13px;font-weight:400;fill:#536273}
  </style>
</defs>
<rect class="canvas" width="1280" height="700"/>
<rect class="frame" x="32" y="28" width="1216" height="644" rx="28"/>
<text class="title" x="66" y="82">Concurrent Image File IO Throughput</text>
<text class="subtitle" x="70" y="116">64 concurrent compressed homer.jpg files; kotlinx-benchmark Throughput; higher files/s is better</text>

<rect x="62" y="148" width="1156" height="190" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="panel"/>
<text class="panel-title" x="92" y="192">Concurrent reads</text>
<line x1="360" y1="218" x2="360" y2="292" stroke="#D8E0EA" stroke-width="1"/>
<line x1="540" y1="218" x2="540" y2="292" stroke="#D8E0EA" stroke-width="1"/>
<line x1="720" y1="218" x2="720" y2="292" stroke="#D8E0EA" stroke-width="1"/>
<line x1="900" y1="218" x2="900" y2="292" stroke="#D8E0EA" stroke-width="1"/>
<line x1="1080" y1="218" x2="1080" y2="292" stroke="#D8E0EA" stroke-width="1"/>
<text class="axis" x="360" y="316" text-anchor="middle">0</text>
<text class="axis" x="540" y="316" text-anchor="middle">22.5k</text>
<text class="axis" x="720" y="316" text-anchor="middle">45k</text>
<text class="axis" x="900" y="316" text-anchor="middle">67.5k</text>
<text class="axis" x="1080" y="316" text-anchor="middle">90k files/s</text>

<text class="label" x="92" y="235">Path</text>
<rect x="360" y="220" width="668" height="22" rx="7" fill="#7CC7A2"/>
<text class="value" x="1044" y="236">83,394</text>
<text class="label" x="92" y="266">Okio Source</text>
<rect x="360" y="251" width="559" height="22" rx="7" fill="#F2C879"/>
<text class="value" x="935" y="267">69,907</text>
<text class="label" x="92" y="297">Suspended File Source</text>
<rect x="360" y="282" width="70" height="22" rx="7" fill="#D8B4F8"/>
<text class="value" x="446" y="298">8,713</text>

<rect x="62" y="370" width="1156" height="190" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="panel"/>
<text class="panel-title" x="92" y="414">Concurrent writes</text>
<line x1="360" y1="440" x2="360" y2="492" stroke="#D8E0EA" stroke-width="1"/>
<line x1="540" y1="440" x2="540" y2="492" stroke="#D8E0EA" stroke-width="1"/>
<line x1="720" y1="440" x2="720" y2="492" stroke="#D8E0EA" stroke-width="1"/>
<line x1="900" y1="440" x2="900" y2="492" stroke="#D8E0EA" stroke-width="1"/>
<line x1="1080" y1="440" x2="1080" y2="492" stroke="#D8E0EA" stroke-width="1"/>
<text class="axis" x="360" y="552" text-anchor="middle">0</text>
<text class="axis" x="540" y="552" text-anchor="middle">400</text>
<text class="axis" x="720" y="552" text-anchor="middle">800</text>
<text class="axis" x="900" y="552" text-anchor="middle">1,200</text>
<text class="axis" x="1080" y="552" text-anchor="middle">1,600 files/s</text>

<text class="label" x="92" y="457">Path</text>
<rect x="360" y="442" width="645" height="22" rx="7" fill="#7CC7A2"/>
<text class="value" x="1021" y="458">1,434</text>
<text class="label" x="92" y="488">Okio Sink</text>
<rect x="360" y="473" width="620" height="22" rx="7" fill="#F2C879"/>
<text class="value" x="996" y="489">1,377</text>
<text class="label" x="92" y="519">Suspended File Sink</text>
<rect x="360" y="504" width="604" height="22" rx="7" fill="#D8B4F8"/>
<text class="value" x="980" y="520">1,341</text>

<text class="note" x="86" y="614">Source: ImageFileIoThroughputBenchmark, macOS arm64, GraalVM Java 25, 2026-05-29 local run.</text>
<text class="note" x="86" y="636">This isolates compressed file IO and intentionally excludes Scrimage decode/encode CPU work.</text>
</svg>
