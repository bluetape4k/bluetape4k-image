<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="Image File IO Throughput Benchmark">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:16px;font-weight:400;fill:#536273}
    .panel{filter:url(#shadow)}.panel-title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;font-weight:400;fill:#102033}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:19px;font-weight:400;fill:#102033}
    .axis{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .value{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:13px;font-weight:700;fill:#102033}
    .note{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:13px;font-weight:400;fill:#536273}
  </style>
</defs>
<rect class="canvas" width="1280" height="760"/>
<rect class="frame" x="32" y="28" width="1216" height="704" rx="28"/>
<text class="title" x="66" y="82">Large Image File IO Throughput</text>
<text class="subtitle" x="70" y="116">cafe.jpg and landscape.jpg; reads use 6,400 hard-linked paths, writes use 256 output files; higher files/s is better</text>

<rect x="62" y="148" width="560" height="214" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="panel"/>
<text class="panel-title" x="92" y="190">Read cafe.jpg (2.9 MB)</text>
<line x1="250" y1="215" x2="250" y2="303" stroke="#D8E0EA" stroke-width="1"/>
<line x1="350" y1="215" x2="350" y2="303" stroke="#D8E0EA" stroke-width="1"/>
<line x1="450" y1="215" x2="450" y2="303" stroke="#D8E0EA" stroke-width="1"/>
<line x1="550" y1="215" x2="550" y2="303" stroke="#D8E0EA" stroke-width="1"/>
<text class="axis" x="250" y="328" text-anchor="middle">0</text>
<text class="axis" x="350" y="328" text-anchor="middle">5k</text>
<text class="axis" x="450" y="328" text-anchor="middle">10k</text>
<text class="axis" x="550" y="328" text-anchor="middle">15k files/s</text>
<text class="label" x="92" y="234">Path</text>
<rect x="250" y="219" width="338" height="20" rx="7" fill="#7CC7A2"/>
<text class="value" x="523" y="234">16,904</text>
<text class="label" x="92" y="264">Okio Source</text>
<rect x="250" y="249" width="50" height="20" rx="7" fill="#F2C879"/>
<text class="value" x="316" y="264">2,513</text>
<text class="label" x="92" y="294">Susp. Source</text>
<rect x="250" y="279" width="4" height="20" rx="2" fill="#D8B4F8"/>
<text class="value" x="270" y="294">74</text>

<rect x="658" y="148" width="560" height="214" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="panel"/>
<text class="panel-title" x="688" y="190">Read landscape.jpg (3.4 MB)</text>
<line x1="846" y1="215" x2="846" y2="303" stroke="#D8E0EA" stroke-width="1"/>
<line x1="946" y1="215" x2="946" y2="303" stroke="#D8E0EA" stroke-width="1"/>
<line x1="1046" y1="215" x2="1046" y2="303" stroke="#D8E0EA" stroke-width="1"/>
<line x1="1146" y1="215" x2="1146" y2="303" stroke="#D8E0EA" stroke-width="1"/>
<text class="axis" x="846" y="328" text-anchor="middle">0</text>
<text class="axis" x="946" y="328" text-anchor="middle">5k</text>
<text class="axis" x="1046" y="328" text-anchor="middle">10k</text>
<text class="axis" x="1146" y="328" text-anchor="middle">15k files/s</text>
<text class="label" x="688" y="234">Path</text>
<rect x="846" y="219" width="320" height="20" rx="7" fill="#7CC7A2"/>
<text class="value" x="1099" y="234">15,981</text>
<text class="label" x="688" y="264">Okio Source</text>
<rect x="846" y="249" width="41" height="20" rx="7" fill="#F2C879"/>
<text class="value" x="903" y="264">2,072</text>
<text class="label" x="688" y="294">Susp. Source</text>
<rect x="846" y="279" width="4" height="20" rx="2" fill="#D8B4F8"/>
<text class="value" x="866" y="294">70</text>

<rect x="62" y="398" width="560" height="214" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="panel"/>
<text class="panel-title" x="92" y="440">Write cafe.jpg (256 files)</text>
<line x1="250" y1="465" x2="250" y2="553" stroke="#D8E0EA" stroke-width="1"/>
<line x1="350" y1="465" x2="350" y2="553" stroke="#D8E0EA" stroke-width="1"/>
<line x1="450" y1="465" x2="450" y2="553" stroke="#D8E0EA" stroke-width="1"/>
<line x1="550" y1="465" x2="550" y2="553" stroke="#D8E0EA" stroke-width="1"/>
<text class="axis" x="250" y="578" text-anchor="middle">0</text>
<text class="axis" x="350" y="578" text-anchor="middle">500</text>
<text class="axis" x="450" y="578" text-anchor="middle">1,000</text>
<text class="axis" x="550" y="578" text-anchor="middle">1,500 files/s</text>
<text class="label" x="92" y="484">Path</text>
<rect x="250" y="469" width="302" height="20" rx="7" fill="#7CC7A2"/>
<text class="value" x="568" y="484">1,507</text>
<text class="label" x="92" y="514">Okio Sink</text>
<rect x="250" y="499" width="153" height="20" rx="7" fill="#F2C879"/>
<text class="value" x="419" y="514">767</text>
<text class="label" x="92" y="544">Susp. Sink</text>
<rect x="250" y="529" width="29" height="20" rx="7" fill="#D8B4F8"/>
<text class="value" x="295" y="544">147</text>

<rect x="658" y="398" width="560" height="214" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="panel"/>
<text class="panel-title" x="688" y="440">Write landscape.jpg (256 files)</text>
<line x1="846" y1="465" x2="846" y2="553" stroke="#D8E0EA" stroke-width="1"/>
<line x1="946" y1="465" x2="946" y2="553" stroke="#D8E0EA" stroke-width="1"/>
<line x1="1046" y1="465" x2="1046" y2="553" stroke="#D8E0EA" stroke-width="1"/>
<line x1="1146" y1="465" x2="1146" y2="553" stroke="#D8E0EA" stroke-width="1"/>
<text class="axis" x="846" y="578" text-anchor="middle">0</text>
<text class="axis" x="946" y="578" text-anchor="middle">500</text>
<text class="axis" x="1046" y="578" text-anchor="middle">1,000</text>
<text class="axis" x="1146" y="578" text-anchor="middle">1,500 files/s</text>
<text class="label" x="688" y="484">Path</text>
<rect x="846" y="469" width="256" height="20" rx="7" fill="#7CC7A2"/>
<text class="value" x="1118" y="484">1,280</text>
<text class="label" x="688" y="514">Okio Sink</text>
<rect x="846" y="499" width="156" height="20" rx="7" fill="#F2C879"/>
<text class="value" x="1018" y="514">778</text>
<text class="label" x="688" y="544">Susp. Sink</text>
<rect x="846" y="529" width="31" height="20" rx="7" fill="#D8B4F8"/>
<text class="value" x="893" y="544">154</text>

<text class="note" x="86" y="664">Source: ImageFileIoThroughputBenchmark, macOS arm64, GraalVM Java 25, 2026-05-29 local run.</text>
<text class="note" x="86" y="686">Read inputs are 6,400 hard links to avoid 18-22 GB setup copies; writes use 256 real output files per invocation.</text>
<text class="note" x="86" y="708">The benchmark streams bytes with a fixed 128 KiB buffer and excludes Scrimage decode/encode CPU work.</text>
</svg>
