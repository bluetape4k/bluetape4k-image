<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Image Pipeline Allocation Benchmark">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:40px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:16px;font-weight:400;fill:#536273}
    .panel{filter:url(#shadow)}.panel-title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:27px;font-weight:400;fill:#102033}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:22px;font-weight:400;fill:#102033}
    .axis{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:13px;font-weight:400;fill:#536273}
    .value{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:14px;font-weight:700;fill:#102033}
    .note{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:13px;font-weight:400;fill:#536273}
  </style>
</defs>
<rect class="canvas" width="1280" height="720"/>
<rect class="frame" x="32" y="28" width="1216" height="664" rx="28"/>
<text class="title" x="66" y="82">Image Pipeline Allocation Benchmark</text>
<text class="subtitle" x="70" y="116">scrimage chained operations, macOS arm64, GraalVM Java 25; lower is better</text>

<rect x="62" y="146" width="1156" height="220" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="panel"/>
<text class="panel-title" x="92" y="190">Latency</text>
<line x1="330" y1="216" x2="330" y2="308" stroke="#D8E0EA" stroke-width="1"/>
<line x1="500" y1="216" x2="500" y2="308" stroke="#D8E0EA" stroke-width="1"/>
<line x1="670" y1="216" x2="670" y2="308" stroke="#D8E0EA" stroke-width="1"/>
<line x1="840" y1="216" x2="840" y2="308" stroke="#D8E0EA" stroke-width="1"/>
<line x1="1010" y1="216" x2="1010" y2="308" stroke="#D8E0EA" stroke-width="1"/>
<text class="axis" x="330" y="335" text-anchor="middle">0</text>
<text class="axis" x="500" y="335" text-anchor="middle">30</text>
<text class="axis" x="670" y="335" text-anchor="middle">60</text>
<text class="axis" x="840" y="335" text-anchor="middle">90</text>
<text class="axis" x="1010" y="335" text-anchor="middle">120 ms/op</text>

<text class="label" x="92" y="244">Photo preview JPEG</text>
<rect x="330" y="224" width="645" height="26" rx="8" fill="#8FC5F3"/>
<text class="value" x="991" y="243">113.82 ms/op</text>

<text class="label" x="92" y="298">Document preview PNG</text>
<rect x="330" y="278" width="328" height="26" rx="8" fill="#F2C879"/>
<text class="value" x="674" y="297">57.86 ms/op</text>

<rect x="62" y="398" width="1156" height="220" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="panel"/>
<text class="panel-title" x="92" y="442">Allocation per operation</text>
<line x1="330" y1="468" x2="330" y2="560" stroke="#D8E0EA" stroke-width="1"/>
<line x1="500" y1="468" x2="500" y2="560" stroke="#D8E0EA" stroke-width="1"/>
<line x1="670" y1="468" x2="670" y2="560" stroke="#D8E0EA" stroke-width="1"/>
<line x1="840" y1="468" x2="840" y2="560" stroke="#D8E0EA" stroke-width="1"/>
<line x1="1010" y1="468" x2="1010" y2="560" stroke="#D8E0EA" stroke-width="1"/>
<text class="axis" x="330" y="587" text-anchor="middle">0</text>
<text class="axis" x="500" y="587" text-anchor="middle">20</text>
<text class="axis" x="670" y="587" text-anchor="middle">40</text>
<text class="axis" x="840" y="587" text-anchor="middle">60</text>
<text class="axis" x="1010" y="587" text-anchor="middle">80 MB/op</text>

<text class="label" x="92" y="496">Photo preview JPEG</text>
<rect x="330" y="476" width="431" height="26" rx="8" fill="#7CC7A2"/>
<text class="value" x="777" y="495">50.75 MB/op</text>

<text class="label" x="92" y="550">Document preview PNG</text>
<rect x="330" y="530" width="518" height="26" rx="8" fill="#D8B4F8"/>
<text class="value" x="864" y="549">60.89 MB/op</text>

<text class="note" x="86" y="650">Source: kotlinx-benchmark latency report plus JVM GC-profiler allocation addendum, 2026-05-29 local run.</text>
<text class="note" x="86" y="674">Fixtures: landscape.jpg photo path and homer.png illustration path from images/src/test/resources/images.</text>
</svg>
