<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1000" viewBox="0 0 2000 1000" role="img" aria-label="Spring Boot Barcode API Architecture">
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <polygon points="0,0 14,7 0,14" fill="#3b82c4"/>
    </marker>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .canvas{fill:#f8fafc}
      .frame{fill:#fff;stroke:#475569;stroke-width:2.4}
      .title{font-family:"Architects Daughter";font-size:44px;fill:#1f2937}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#64748b}
      .lane{fill:#f4f7fb;stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:8 6}
      .lane-title{font-family:"Comic Mono";font-size:15px;fill:#475569;font-weight:700;letter-spacing:1px}
      .card{fill:#fff;stroke:#94a3b8;stroke-width:1.8;filter:url(#shadow)}
      .node-title{font-family:"Architects Daughter";font-size:22px;fill:#1f2937}
      .node-detail{font-family:"Comic Mono";font-size:13px;fill:#64748b}
      .edge{fill:none;stroke:#3b82c4;stroke-width:2.6;marker-end:url(#arrow-blue);stroke-linecap:round;stroke-linejoin:round}
      .edge-static{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow-gray);stroke-linecap:round;stroke-linejoin:round}
      .label-box{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}
      .label{font-family:"Comic Mono";font-size:12px;fill:#475569}
      .legend{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .footer{font-family:"Comic Mono";font-size:13px;fill:#64748b}
    </style>
  </defs>

  <rect class="canvas" width="2000" height="1000"/>
  <rect class="frame" x="34" y="30" width="1932" height="920" rx="28"/>
  <text class="title" x="76" y="92">Spring Boot Barcode API Architecture</text>
  <text class="subtitle" x="80" y="126">The example keeps HTTP concerns local while consuming provider-neutral barcode contracts.</text>

  <g id="lanes">
    <rect class="lane" x="80" y="180" width="330" height="650" rx="16"/>
    <text class="lane-title" x="104" y="214">APPLICATION</text>
    <rect class="lane" x="450" y="180" width="450" height="650" rx="16"/>
    <text class="lane-title" x="474" y="214">WEB + CONFIG</text>
    <rect class="lane" x="940" y="180" width="400" height="650" rx="16"/>
    <text class="lane-title" x="964" y="214">BOUNDED EXTRACTION</text>
    <rect class="lane" x="1380" y="180" width="500" height="650" rx="16"/>
    <text class="lane-title" x="1404" y="214">LIBRARY CONTRACTS + PROVIDER</text>
  </g>

  <g id="connectors">
    <path data-connector="true" class="edge" stroke="#3b82c4" d="M 360 470 L 430 470 Q 450 470 450 450 L 450 330 Q 450 310 470 310 L 500 310"/>
    <path data-connector="true" class="edge" stroke="#3b82c4" d="M 360 485 L 500 485"/>
    <path data-connector="true" class="edge" stroke="#3b82c4" d="M 360 500 L 430 500 Q 450 500 450 520 L 450 660 Q 450 680 470 680 L 500 680"/>
    <path data-connector="true" class="edge" stroke="#3b82c4" d="M 850 310 L 910 310 Q 930 310 930 330 L 930 470 Q 930 490 950 490 L 980 490"/>
    <path data-connector="true" class="edge" stroke="#3b82c4" d="M 850 680 L 890 680 Q 910 680 910 660 L 910 550 Q 910 530 930 530 L 980 530"/>
    <path data-connector="true" class="edge" stroke="#3b82c4" d="M 1300 470 L 1360 470 Q 1380 470 1380 450 L 1380 330 Q 1380 310 1400 310 L 1430 310"/>
    <path data-connector="true" class="edge" stroke="#3b82c4" d="M 1300 530 L 1360 530 Q 1380 530 1380 550 L 1380 660 Q 1380 680 1400 680 L 1430 680"/>
    <path data-connector="true" class="edge-static" stroke="#64748b" d="M 1680 620 L 1680 520"/>
  </g>

  <g id="cards">
    <g id="application">
      <rect class="card" x="120" y="410" width="240" height="150" rx="14"/>
      <rect x="142" y="438" width="44" height="44" rx="10" fill="#e8f2fb" stroke="#7aa7d8"/>
      <text class="node-title" x="200" y="458">Spring Boot 4</text>
      <text class="node-detail" x="200" y="482">barcode quickstart</text>
      <text class="node-detail" x="142" y="526">coroutine MVC endpoints</text>
    </g>
    <g id="controller">
      <rect class="card" x="500" y="250" width="350" height="120" rx="14"/>
      <rect x="520" y="278" width="42" height="42" rx="9" fill="#edf8f1" stroke="#74b48f"/>
      <text class="node-title" x="578" y="298">BarcodeApiController</text>
      <text class="node-detail" x="578" y="324">GET scenarios + POST upload</text>
    </g>
    <g id="handler">
      <rect class="card" x="500" y="420" width="350" height="120" rx="14"/>
      <rect x="520" y="448" width="42" height="42" rx="9" fill="#fbecec" stroke="#d68a8a"/>
      <text class="node-title" x="578" y="468">Exception handler</text>
      <text class="node-detail" x="578" y="494">sanitized HTTP error DTOs</text>
    </g>
    <g id="configuration">
      <rect class="card" x="500" y="620" width="350" height="120" rx="14"/>
      <rect x="520" y="648" width="42" height="42" rx="9" fill="#fff7ed" stroke="#e7b36e"/>
      <text class="node-title" x="578" y="668">Configuration</text>
      <text class="node-detail" x="578" y="694">limits + BarcodeReader bean</text>
    </g>
    <g id="service">
      <rect class="card" x="980" y="400" width="320" height="190" rx="14"/>
      <text class="node-title" x="1140" y="446" text-anchor="middle">BarcodeExtractionService</text>
      <text class="node-detail" x="1140" y="484" text-anchor="middle">validate compressed bytes</text>
      <text class="node-detail" x="1140" y="510" text-anchor="middle">guard decoded dimensions</text>
      <text class="node-detail" x="1140" y="536" text-anchor="middle">map bounded results</text>
    </g>
    <g id="images-core">
      <rect class="card" x="1430" y="250" width="400" height="120" rx="14"/>
      <rect x="1450" y="278" width="42" height="42" rx="9" fill="#e8f2fb" stroke="#7aa7d8"/>
      <text class="node-title" x="1508" y="298">bluetape4k-images</text>
      <text class="node-detail" x="1508" y="324">probe dimensions + ImmutableImage</text>
    </g>
    <g id="barcode-api">
      <rect class="card" x="1430" y="400" width="400" height="120" rx="14"/>
      <rect x="1450" y="428" width="42" height="42" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
      <text class="node-title" x="1508" y="448">images-barcode-api</text>
      <text class="node-detail" x="1508" y="474">BarcodeReader + result contracts</text>
    </g>
    <g id="zxing-provider">
      <rect class="card" x="1430" y="620" width="400" height="120" rx="14"/>
      <rect x="1450" y="648" width="42" height="42" rx="9" fill="#edf8f1" stroke="#74b48f"/>
      <text class="node-title" x="1508" y="668">images-barcode-zxing</text>
      <text class="node-detail" x="1508" y="694">pure-JVM ZxingBarcodeReader</text>
    </g>
  </g>

  <g id="labels">
    <rect class="label-box" x="384" y="280" width="92" height="28" rx="10"/>
    <text class="label" x="430" y="299" text-anchor="middle">scan</text>
    <rect class="label-box" x="866" y="274" width="100" height="28" rx="10"/>
    <text class="label" x="916" y="293" text-anchor="middle">delegate</text>
    <rect class="label-box" x="1336" y="274" width="104" height="28" rx="10"/>
    <text class="label" x="1388" y="293" text-anchor="middle">decode</text>
    <rect class="label-box" x="1604" y="522" width="152" height="28" rx="10"/>
    <text class="label" x="1680" y="541" text-anchor="middle">implements</text>
  </g>

  <g id="legend">
    <rect x="705" y="858" width="590" height="54" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <line x1="750" y1="885" x2="800" y2="885" stroke="#3b82c4" stroke-width="4"/>
    <text class="legend" x="814" y="890">runtime dependency</text>
    <line x1="1014" y1="885" x2="1064" y2="885" stroke="#64748b" stroke-width="4" stroke-dasharray="7 5"/>
    <text class="legend" x="1078" y="890">implementation</text>
  </g>

  <text class="footer" x="1000" y="930" text-anchor="middle">bluetape4k-image | examples:spring-boot-barcode-api</text>
</svg>
