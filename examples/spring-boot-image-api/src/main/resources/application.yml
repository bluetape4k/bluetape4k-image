server:
  port: 8080

example:
  image:
    max-input-bytes: 10485760
    max-input-pixels: 16777216
    max-input-side: 8192

bluetape4k:
  images:
    storage:
      backend: local
      max-size-bytes: 10485760
      local:
        root-dir: build/tmp/spring-boot-image-api/storage
        bootstrap-prefixes: [originals, thumbnails]

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
